  --success:#2f9e44;
  --warning:#f08c00;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 2px 4px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.08);

}

.brand__name{font-weight:800;font-size:15px;letter-spacing:.02em}
.brand__sub{font-size:11px;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav__item{
  display:flex;align-items:center;gap:11px;width:100%;
  padding:10px 12px;border-radius:var(--radius-sm);
  color:var(--text-2);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;
  border:1px solid transparent;background:none;text-align:left;
  -webkit-tap-highlight-color:transparent;
}
.nav__item:hover{background:var(--surface-3)}
.nav__item.is-active{background:var(--primary-weak);color:var(--primary);border-color:color-mix(in srgb,var(--primary) 22%,transparent)}
.nav__item svg{width:18px;height:18px;flex:0 0 auto}
.nav__sep{height:1px;background:var(--border);margin:10px 8px}

.main{min-width:0;margin-left:248px}
.content{max-width:1140px;margin:0 auto;padding:26px 30px 120px}

.appbar{
  display:none;position:sticky;top:0;z-index:20;
  align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(8px);border-bottom:1px solid var(--border);
}
.appbar__title{font-weight:800;font-size:16px}
.appbar__left{display:flex;align-items:center;gap:10px;min-width:0}

.tabbar{display:none}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  --bg:var(--surface); --bd:var(--border-strong); --fg:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:42px;padding:0 15px;border-radius:var(--radius-sm);
  background:var(--bg);border:1px solid var(--bd);color:var(--fg);
  font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  transition:filter .12s ease, background .12s ease, box-shadow .12s ease, transform .06s ease;
}
.btn:hover{filter:brightness(.97)}
.btn:active{filter:brightness(.92);transform:translateY(1px)}
.btn:focus-visible{outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 30%,transparent)}
.nav__item:focus-visible,.tabbar__item:focus-visible,.card__link:focus-visible,.chipbtn:focus-visible,.choice:focus-visible,.pill-toggle button:focus-visible,.disclosure__btn:focus-visible,.loglist__del:focus-visible,.funnel-toggle:focus-visible{
  outline:2px solid var(--primary);outline-offset:2px;border-radius:8px;
}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important} }
.btn--primary:active,.btn--primary.is-pressed{
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 34%,transparent),0 4px 14px color-mix(in srgb,var(--primary) 40%,transparent);
  filter:brightness(1.06);
}
.btn svg{width:16px;height:16px}
.btn--primary{--bg:var(--primary);--bd:var(--primary);--fg:var(--primary-ink)}
.btn--ghost{--bg:transparent;--bd:transparent;--fg:var(--text-2)}
.btn--ghost:hover{background:var(--surface-3)}
.btn--soft{--bg:var(--surface-3);--bd:transparent}
.btn--danger{--bg:var(--danger);--bd:var(--danger);--fg:#fff}
.btn--danger-soft{--bg:var(--danger-weak);--bd:transparent;--fg:var(--danger)}
.btn--sm{min-height:34px;padding:0 11px;font-size:13px;border-radius:var(--radius-xs)}
.btn--lg{min-height:48px;font-size:15px;padding:0 20px}
.btn--block{display:flex;width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chipbtn{
  display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;
  border-radius:999px;background:var(--primary-weak);color:var(--primary);
  border:1px solid color-mix(in srgb,var(--primary) 24%,transparent);
  font-weight:700;font-size:13px;text-decoration:none;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.chipbtn:hover{filter:brightness(.97)}
.chipbtn:active{filter:brightness(.93)}
.chipbtn svg{width:15px;height:15px}

.fab{
  position:fixed;right:18px;bottom:86px;z-index:30;
  width:56px;height:56px;border-radius:50%;
  background:var(--primary);color:var(--primary-ink);border:none;
  box-shadow:var(--shadow-md);cursor:pointer;display:none;
  align-items:center;justify-content:center;
}
.fab svg{width:24px;height:24px}

/* ============================================================
   Cards / layout helpers
   ============================================================ */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:var(--shadow-sm);
  padding:18px;
}
.card--pad-lg{padding:22px}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card__title{font-size:14px;font-weight:800;letter-spacing:.02em}
.card__hint{font-size:12px;color:var(--muted);font-weight:600}
.card__link{
  display:inline-flex;align-items:center;gap:5px;min-height:38px;
  padding:8px 12px;margin:-8px -8px -8px 0;
  background:none;border:none;border-radius:10px;
  color:var(--primary);font-weight:700;font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.card__link:hover{background:var(--surface-3)}
.card__link:active{background:var(--primary-weak)}
.card__link svg{width:14px;height:14px}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.page-head h1{font-size:22px}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13px;font-weight:600}

.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row--between{justify-content:space-between;align-items:center}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.section-label{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin:2px 0 10px}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.stat{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px;box-shadow:var(--shadow-sm);
}
.stat__label{font-size:12px;color:var(--muted);font-weight:700}
.stat__value{font-size:27px;font-weight:800;margin-top:6px;letter-spacing:-.01em}
.stat__value small{font-size:14px;font-weight:700;color:var(--muted)}
.stat__delta{font-size:11px;font-weight:700;margin-top:3px;color:var(--muted)}
.stat--accent .stat__value{color:var(--primary)}
.stat--good .stat__value{color:var(--success)}
.stat--bad .stat__value{color:var(--danger)}
/* dashboard hero (big money) + compact pipeline counters */
.stats--hero{grid-template-columns:repeat(3,1fr)}
.stat--hero{padding:16px 18px}
.stat--hero .stat__value{font-size:31px;margin-top:4px}
.stats--compact{grid-template-columns:repeat(7,1fr);gap:8px}
.stat--sm{padding:10px 12px}
.stat--sm .stat__label{font-size:11px}
.stat--sm .stat__value{font-size:20px;margin-top:2px}
@media (max-width:900px){
  .stats--hero{grid-template-columns:repeat(2,1fr)}
  .stats--hero .stat--hero:last-child{grid-column:1 / -1}
  .stat--hero .stat__value{font-size:24px}
  .stats--compact{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
  .stat--sm .stat__value{font-size:18px}
}

/* Badges */
.badge{
  --c:var(--muted);
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;line-height:1.4;
  background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c);
  border:1px solid color-mix(in srgb,var(--c) 30%,transparent);
  white-space:nowrap;
}
.badge--dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge--lg{font-size:13px;padding:5px 12px}

.s-new{--c:#7d8896}
.s-phone_connected{--c:#3b93d6}
.s-quote_requested{--c:#0fa3a3}
.s-survey_scheduled{--c:#6366f1}
.s-survey_done{--c:#8b5cf6}
.s-quote_submitted{--c:#e8940c}
.s-considering{--c:#ef6c1a}
.s-won{--c:#2f9e44}
.s-lost{--c:#e5484d}

.p-A{--c:#2f9e44}
.p-B{--c:#2f6feb}
.p-C{--c:#e8940c}
.p-D{--c:#7d8896}

.pr-high{--c:#e5484d}
.pr-mid{--c:#e8940c}
.pr-low{--c:#7d8896}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field__label{font-size:12.5px;font-weight:700;color:var(--text-2)}
.field__label .req{color:var(--danger);margin-left:3px}
.field__hint{font-size:11.5px;color:var(--muted)}
.other-wrap{padding:10px;margin-top:2px;background:color-mix(in srgb,var(--warning) 9%,transparent);border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);border-radius:10px}
.other-wrap .field__label{color:var(--warning)}
.input,.select,textarea.input{
  width:100%;min-height:44px;padding:10px 12px;
  background:var(--surface);border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;
  transition:border-color .12s ease, box-shadow .12s ease;
}
.input:focus,.select:focus,textarea.input:focus{
  outline:none;border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent);
}
.input.is-invalid,.select.is-invalid,textarea.input.is-invalid{
  border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent);
}
.fielderr{color:var(--danger);font-size:12px;font-weight:700;margin-top:5px}
@keyframes shakeX{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
.shake{animation:shakeX .4s ease}
@media (prefers-reduced-motion: reduce){ .shake{animation:none} }
#errbanner{
  position:fixed;left:0;right:0;top:0;z-index:300;
  background:var(--danger);color:#fff;font-weight:800;font-size:14px;
  padding:12px 16px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.25);
  display:none;
}
#errbanner.is-open{display:block}
textarea.input{min-height:74px;resize:vertical;line-height:1.5}
.input::placeholder,textarea.input::placeholder{color:var(--muted);opacity:.65}
.datewrap{display:block;width:100%}
.datewrap .datein{width:100%;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.filterbar .datewrap{min-width:150px;max-width:190px;flex:0 0 auto}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b7480' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:34px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .col-span{grid-column:1 / -1}

/* Segmented / choice buttons */
.segmented{display:flex;flex-wrap:wrap;gap:8px}
.choice{
  min-height:40px;padding:0 14px;border-radius:999px;cursor:pointer;
  border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text-2);font-weight:700;font-size:13px;
  display:inline-flex;align-items:center;gap:6px;
}
.choice:hover{background:var(--surface-3)}
.choice.is-on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.choice.is-on--soft{background:var(--primary-weak);border-color:color-mix(in srgb,var(--primary) 30%,transparent);color:var(--primary)}

.check{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;font-weight:600;font-size:13.5px}
.check input{width:18px;height:18px;accent-color:var(--primary);flex:0 0 auto}
.check.is-on{border-color:color-mix(in srgb,var(--primary) 40%,transparent);background:var(--primary-weak)}

/* Collapsible */
.disclosure{border:1px dashed var(--border-strong);border-radius:var(--radius);overflow:hidden}
.disclosure__btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;background:var(--surface-2);border:none;color:var(--text);font-weight:700;font-size:14px;cursor:pointer;text-align:left}
.disclosure__btn .chev{width:18px;height:18px;flex:0 0 18px;opacity:.55;transition:transform .15s ease}
.disclosure.is-open .disclosure__btn .chev{transform:rotate(180deg)}
.disclosure__body{padding:13px;border-top:1px solid var(--border);display:none}
.disclosure.is-open .disclosure__body{display:block}
.disclosure__btn>span{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;line-height:1.4}
.disclosure__btn>span .muted{font-size:12.5px}
.disclosure__body .form-grid{gap:10px}
.disclosure__body .input,.disclosure__body .select{min-height:38px;padding:8px 10px;font-size:13px}
.disclosure__body textarea.input{min-height:54px}
.disclosure__body .field__label{font-size:11.5px}
.disclosure__body .check{padding:7px 9px;font-size:12px}
.disclosure__body .check input{width:16px;height:16px}
.disclosure__body .section-label{margin:2px 0 8px}
.disclosure__body .card{padding:13px}
.disclosure__body .stat__value{font-size:19px}

/* Table */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
.table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.table th{
  text-align:left;padding:11px 14px;font-size:11.5px;font-weight:800;letter-spacing:.04em;
  color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);
  background:var(--surface-2);position:sticky;top:0;
}
.table td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr.clickable{cursor:pointer}
.table tr.clickable:hover td{background:var(--surface-3)}
.table td.num,.table th.num{text-align:right;font-variant-numeric:tabular-nums}
.table tfoot td{font-weight:800;background:var(--surface-2);border-top:2px solid var(--border-strong)}

/* Deal cards (mobile list) */
.deal-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;box-shadow:var(--shadow-sm);cursor:pointer;display:flex;flex-direction:column;gap:9px;
}
.deal-card:active{filter:brightness(.97)}
.deal-card__top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.deal-card__co{font-weight:800;font-size:15px}
.deal-card__meta{font-size:12px;color:var(--muted);font-weight:600}
.deal-card__row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.deal-card__amt{font-weight:800;font-variant-numeric:tabular-nums}

/* Funnel */
.funnel{display:flex;flex-direction:column;gap:2px}
.funnel__stage{padding:2px 0}
.funnel__track{flex:1 1 auto;min-width:0}
.funnel__bar{
  height:40px;border-radius:9px;display:flex;align-items:center;padding:0 12px;gap:10px;
  background:linear-gradient(90deg,color-mix(in srgb,var(--primary) 88%,#000 0%),color-mix(in srgb,var(--primary) 55%,transparent));
  color:#fff;font-weight:800;min-width:44px;transition:width .3s ease;box-sizing:border-box;
}
.funnel__name{font-size:12.5px;font-weight:800;color:var(--text-2);width:92px;flex:0 0 auto}
.funnel__row{display:flex;align-items:center;gap:12px}
.funnel__count{font-variant-numeric:tabular-nums}
.funnel__conv{font-size:11.5px;color:var(--muted);font-weight:700;padding-left:104px}
.funnel__conv b{color:var(--text-2)}

/* Bars (analytics) */
.barlist{display:flex;flex-direction:column;gap:11px}
.barlist__row{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:10px;font-size:13px}
.barlist__track{height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.barlist__fill{display:block;height:100%;border-radius:999px;background:var(--primary);transition:width .3s ease}
.barlist__val{font-weight:800;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}

/* Priority list */
.prio{display:flex;flex-direction:column;gap:8px}
.prio__item{
  display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;
}
.prio__item:hover{background:var(--surface-3)}
.prio__rank{width:22px;height:22px;border-radius:6px;background:var(--primary-weak);color:var(--primary);font-weight:800;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
.prio__body{min-width:0;flex:1}
.prio__co{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prio__sub{font-size:12px;color:var(--muted);font-weight:600}
.prio__amt{font-weight:800;font-variant-numeric:tabular-nums;font-size:13px;text-align:right;flex:0 0 auto}

/* Follow-up columns */
.fu-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fu-col__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.fu-col__head h3{font-size:13px;letter-spacing:.03em}
.fu-col--overdue .fu-col__head h3{color:var(--danger)}
.fu-col--overdue{border-color:color-mix(in srgb,var(--danger) 35%,transparent);box-shadow:0 0 0 3px var(--danger-weak)}
.fu-item{padding:11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);cursor:pointer;margin-bottom:8px}
.fu-item:hover{background:var(--surface-3)}
.fu-item__co{font-weight:800;font-size:13.5px}
.fu-item__meta{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Timeline (detail) */
.timeline{display:flex;flex-direction:column;gap:0}
.tl__row{display:flex;gap:12px;align-items:flex-start;padding:9px 0;position:relative}
.tl__dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);background:var(--surface);flex:0 0 auto;margin-top:3px;z-index:1}
.tl__row.is-done .tl__dot{background:var(--primary);border-color:var(--primary)}
.tl__row.is-lost .tl__dot{background:var(--danger);border-color:var(--danger)}
.tl__line{position:absolute;left:6px;top:20px;bottom:-9px;width:2px;background:var(--border)}
.tl__row:last-child .tl__line{display:none}
.tl__row.is-done .tl__line{background:var(--primary)}
.tl__main{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.tl__name{font-weight:700;font-size:13.5px;white-space:nowrap}
.tl__row:not(.is-done) .tl__name{color:var(--muted)}
.tl__date{width:140px;flex:0 0 auto}
.tl__date .datein{min-height:36px;padding:6px 8px;font-size:13px;text-align:center}
@media (max-width:900px){ .tl__date{width:118px} }

/* ファネル折りたたみ */
.funnel-toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:none;border:none;padding:0;margin-bottom:14px;cursor:pointer;font-family:inherit;text-align:left;color:var(--text)}
.funnel-toggle .card__hint{display:inline-flex;align-items:center;gap:5px}
.funnel-toggle .chev{width:16px;height:16px;transition:transform .15s ease}
.funnel-card.is-collapsed .funnel-toggle{margin-bottom:0}
.funnel-card.is-collapsed .funnel-toggle .chev{transform:rotate(-90deg)}
.funnel-card.is-collapsed .funnel-body{display:none}
@media (min-width:901px){
  .funnel-toggle{cursor:default}
  .funnel-toggle .chev{display:none}
  .funnel-card.is-collapsed .funnel-body{display:block}
  .funnel-card.is-collapsed .funnel-toggle{margin-bottom:14px}
}

/* 今月の目標 */
.goalrow{padding:8px 0}
.goalrow + .goalrow{border-top:1px solid var(--border);margin-top:4px;padding-top:12px}
.goalrow__top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13.5px;margin-bottom:7px}
.goalrow__val{font-variant-numeric:tabular-nums}
.goalrow__val.is-done{color:var(--success)}
.goalrow__track{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.goalrow__fill{height:100%;border-radius:999px;background:var(--primary);transition:width .3s ease}
.goalrow__fill.is-done{background:var(--success)}
.goalrow__pct{font-size:11.5px;margin-top:5px;font-weight:600}

/* 連絡ログ */
.loglist{display:flex;flex-direction:column}
.loglist__row{display:grid;grid-template-columns:44px 1fr 26px;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:13px}
.loglist__row:first-child{border-top:none}
.loglist__date{color:var(--muted);font-weight:700;font-size:12px}
.loglist__txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loglist__del{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;border-radius:6px;display:inline-flex}
.filelist{display:flex;flex-direction:column}
.filerow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--border)}
.filelist .filerow:first-child{border-top:none}
.filerow__main{display:flex;align-items:center;gap:10px;min-width:0}
.filerow__ic{font-size:20px;flex:0 0 auto}
.filerow__name{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filerow__meta{font-size:11.5px;color:var(--muted)}
.loglist__del svg{width:13px;height:13px}
.loglist__del:hover{background:var(--danger-weak);color:var(--danger)}

/* Dialog */
.backdrop{
  position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;
  opacity:0;pointer-events:none;transition:opacity .14s ease;
}
.backdrop.is-open{opacity:1;pointer-events:auto}
.dialog{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow-md);width:100%;max-width:440px;padding:22px;
  transform:translateY(6px) scale(.98);transition:transform .14s ease;
  max-height:88vh;overflow-y:auto;
}
.backdrop.is-open .dialog{transform:none}
.dialog h3{font-size:16px;margin-bottom:6px}
.dialog p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.dialog__actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.bigcopy{font-size:19px;font-weight:800;letter-spacing:.03em;text-align:center;padding:16px 12px;background:var(--surface-3);border:1px solid var(--border);border-radius:12px;font-variant-numeric:tabular-nums;word-break:break-all;user-select:all;-webkit-user-select:all}

/* Sheet (mobile "more") */
.sheet-backdrop{
  position:fixed;inset:0;z-index:108;background:rgba(10,14,20,.42);
  opacity:0;pointer-events:none;transition:opacity .18s ease;
}
.sheet-backdrop.is-open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:110;
  background:var(--surface);border-top-left-radius:18px;border-top-right-radius:18px;
  border:1px solid var(--border);padding:10px 14px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .22s ease;box-shadow:var(--shadow-md);
  max-height:82vh;overflow-y:auto;
}
.sheet.is-open{transform:translateY(0)}
.sheet__grab{width:38px;height:4px;border-radius:999px;background:var(--border-strong);margin:6px auto 10px}
.sheet__title{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;padding:0 4px 6px}
.sheet .nav__item{font-size:15px;padding:14px 12px}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-weight:700;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:all .18s ease;
  box-shadow:var(--shadow-md);
}
.toast.is-open{opacity:1;transform:translateX(-50%)}
.toast--undo{display:flex;align-items:center;gap:12px;pointer-events:auto;padding-right:8px}
.toast--undo button{background:none;border:none;color:var(--primary);font-weight:800;font-size:13px;cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit}
.toast--undo button:hover{background:color-mix(in srgb,var(--primary) 22%,transparent)}

/* Empty */
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty svg{width:38px;height:38px;opacity:.5;margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text-2);margin-bottom:4px}
.empty p{font-size:13px;margin:0 0 16px}

.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filterbar .input,.filterbar .select{min-height:40px;font-size:13px}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:34px}
.filter-more{display:contents}
#filterToggle{display:none}
@media (max-width:900px){
  #filterToggle{display:inline-flex}
  .filter-more{display:none}
  .filter-more.is-open{display:flex;flex-wrap:wrap;gap:10px;width:100%;margin-top:2px}
  .filter-more.is-open .select{flex:1 1 45%;max-width:none !important}
  .filter-more.is-open .datewrap{flex:1 1 45%;max-width:none !important;min-width:0 !important}
  .filter-more.is-open #fclear{flex:1 1 100%}
}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;font-weight:600;text-align:right}

.card__bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.deflist{margin:0;display:flex;flex-direction:column}
.deflist__row{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:start;padding:9px 2px;border-top:1px solid var(--border);font-size:13.5px}
.deflist__row:first-child{border-top:0}
.deflist__row dt{color:var(--muted);font-weight:700}
.deflist__row dd{margin:0;font-weight:600;word-break:break-word}
.deflist__memo{white-space:pre-wrap}

.pill-toggle{display:inline-flex;background:var(--surface-3);border-radius:999px;padding:3px;gap:2px}
.pill-toggle button{border:none;background:transparent;padding:7px 13px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--muted);cursor:pointer}
.pill-toggle button.is-on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}

.divider{height:1px;background:var(--border);margin:16px 0}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width:900px){
  .main{margin-left:0}
  .sidebar{display:none}
  .appbar{display:flex}

    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:color-mix(in srgb,var(--surface) 92%,transparent);

  if (n===null || n===undefined || n==="" || isNaN(n)) return "—";

  return (v < 0 ? "−¥" : "¥") + NF.format(Math.abs(v));

// スマホの一覧・カード用のコンパクト表記（例: ¥680万 / ¥1.23億 / -¥50万）
function yenMan(n){
  if (n===null || n===undefined || n==="" || isNaN(n)) return "—";
  var v = Math.round(Number(n));
  var sign = v < 0 ? "−" : "";
  var a = Math.abs(v);
  if (a < 10000) return sign + "¥" + NF.format(a);
  if (a < 100000000){
    var man = a / 10000;
    var t = man >= 100 ? String(Math.round(man)) : (Math.round(man * 10) / 10);

  return sign + "¥" + (oku % 1 === 0 ? String(oku) : String(oku)) + "億";

/* ---- 障害対策: エラーログ / 破損データの隔離 / セーフモード ---------- */
var SAFE_MODE = false;
function logError(kind, msg, extra){
  var e = {
    at: new Date().toISOString(), kind: String(kind),
    msg: String(msg == null ? "" : msg).slice(0, 400),
    extra: extra ? String(extra).slice(0, 300) : "",
    build: (typeof APP_BUILD !== "undefined" ? APP_BUILD : "?"),
    path: (typeof location !== "undefined" ? location.hash : "")
  };
  try {
    var s = JSON.parse(localStorage.getItem("dcrm.errlog") || "[]");
    s.push(e); while (s.length > 25) s.shift();
    localStorage.setItem("dcrm.errlog", JSON.stringify(s));
  } catch (x) {}
  try { if (window.console && console.warn) console.warn("[解体サーチ]", kind, msg, extra || ""); } catch (x) {}
}
function readErrLog(){ try { return JSON.parse(localStorage.getItem("dcrm.errlog") || "[]"); } catch (e){ return []; } }

function read(key, fallback){
  var raw = null;
  try { raw = localStorage.getItem(key); } catch (e){ return fallback; }
  if (raw == null || raw === "") return fallback;
  try { return JSON.parse(raw); }
  catch (e){
    // 壊れた値は消さずに退避（あとで手当てできるように）。呼び出し側は既定値で継続。
    try { localStorage.setItem(key + ".corrupt", raw); } catch (x) {}
    logError("storage-corrupt", key, (e && e.message) || "");
    return fallback;
  }
}
function write(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch (e){
    logError("storage-write", key, (e && e.message) || "");
    // 容量オーバーの可能性 → 自動バックアップ/エラーログを削って一度だけ再試行
    try {
      localStorage.removeItem("dcrm.snapshots");
      localStorage.removeItem("dcrm.errlog");
      localStorage.setItem(key, JSON.stringify(val));
      toast("保存領域が不足したため、自動バックアップ履歴を整理しました");
      return true;
    } catch (e2){
      toast("保存に失敗しました。設定＞データ でJSON書き出しをしてください");
      return false;
    }
  }
}

/* ---- 添付ファイル保管（IndexedDB。localStorageより大容量） ------------ */
var FS = {
  ok: (function(){ try { return !!window.indexedDB; } catch(e){ return false; } })(),
  _db: null,
  _open: function(){
    return new Promise(function(res, rej){
      if (!FS.ok) return rej(new Error("indexedDB なし"));
      if (FS._db) return res(FS._db);
      var r = indexedDB.open("dcrm-files", 1);
      r.onupgradeneeded = function(){ try { r.result.createObjectStore("files"); } catch(e){} };
      r.onsuccess = function(){ FS._db = r.result; res(FS._db); };
      r.onerror = function(){ rej(r.error); };
    });
  },
  put: function(id, blob){ return FS._open().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction("files", "readwrite"); tx.objectStore("files").put(blob, id);
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ rej(tx.error); }; }); }); },
  get: function(id){ return FS._open().then(function(db){ return new Promise(function(res, rej){
    var tx = db.transaction("files", "readonly"); var g = tx.objectStore("files").get(id);
    g.onsuccess = function(){ res(g.result || null); }; g.onerror = function(){ rej(g.error); }; }); }); },
  del: function(id){ return FS._open().then(function(db){ return new Promise(function(res){
    var tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(id);
    tx.oncomplete = function(){ res(); }; tx.onerror = function(){ res(); }; }); }); },
  keys: function(){ return FS._open().then(function(db){ return new Promise(function(res){
    var tx = db.transaction("files", "readonly"); var g = tx.objectStore("files").getAllKeys();
    g.onsuccess = function(){ res(g.result || []); }; g.onerror = function(){ res([]); }; }); }); },
  // どの案件からも参照されていない孤立ファイルを掃除
  gc: function(){
    if (!FS.ok) return;
    try {
      var live = {};
      DB.deals().forEach(function(d){ (d.files || []).forEach(function(f){ if (f && f.id) live[f.id] = 1; }); });
      FS.keys().then(function(ks){
        ks.forEach(function(k){ if (!live[k]) FS.del(k); });
      }, function(){});
    } catch(e){ logError("fs-gc", (e && e.message) || e); }
  }
};

    var deals = DB.deals();

        write(K.deals, deals);
        return deals[i];

  deleteDeal: function(id){

    write(K.deals, DB.deals().filter(function(d){ return d.id!==id; }));
    write(K.events, DB.events().filter(function(e){ return e.deal_id!==id; }));
    write(K.logs, DB.logs().filter(function(l){ return l.deal_id!==id; }));
    return { deal:deal, events:evs, logs:lgs };

  restoreDeal: function(snap){
    if (!snap || !snap.deal) return;
    var deals = DB.deals(); deals.push(snap.deal); write(K.deals, deals);
    var evs = DB.events(); write(K.events, evs.concat(snap.events||[]));
    var lgs = DB.logs(); write(K.logs, lgs.concat(snap.logs||[]));
  },

  /* Move a deal to a status. Records the status event + auto-stamps the date field. */
  setStatus: function(id, statusKey){
    var deal = DB.deal(id); if (!deal) return null;
    var meta = statusMeta(statusKey);
    var patch = { status: statusKey };
    if (meta.dateField && !deal[meta.dateField]) patch[meta.dateField] = isoToday();
    var updated = DB.updateDeal(id, patch);
    DB._addEvent(id, statusKey, patch[meta.dateField] || isoToday());
    return updated;
  },

  _addEvent: function(dealId, status, on){
    var all = read(K.events, []);
    all.push({ id:uid(), deal_id:dealId, status:status, changed_on:on || isoToday(), created_at:new Date().toISOString() });
    write(K.events, all);
  },

  /* 1つ前の段階に戻す（進めるボタンの誤操作リカバリ）。
     いま入ったばかりの段階の自動日付と履歴イベントを取り消す。 */
  revertStatus: function(id){
    var deal = DB.deal(id); if (!deal) return null;
    var i = pipeIndex(deal.status);
    if (i < 1) return null; // 新規、または pipeline 外（成約/失注）は対象外
    var cur = PIPELINE[i], prev = PIPELINE[i-1];
    var patch = { status: prev.key };
    if (cur.dateField) patch[cur.dateField] = null;
    var updated = DB.updateDeal(id, patch);
    var evs = read(K.events, []);
    for (var j = evs.length - 1; j >= 0; j--){
      if (evs[j].deal_id === id && evs[j].status === cur.key){ evs.splice(j, 1); break; }
    }
    write(K.events, evs);
    return updated;
  },

    row.sort = rows.length;

  takeSnapshot: function(reason){
    var b = DB._bundle();
    var snap = {
      id: uid(), at: new Date().toISOString(), reason: reason || "auto",
      counts: { deals: b.deals.length, events: b.events.length, prices: b.prices.length, logs: b.logs.length },
      data: JSON.stringify(b)
    };
    var list = DB.snapshots();
    list.push(snap);
    list.sort(function(a,c){ return a.at < c.at ? -1 : 1; });
    while (list.length > SNAPSHOT_MAX) list.shift();
    try { write(K.snapshots, list); }
    catch (e){
      // 容量オーバー時は古いものを捨てて再試行
      while (list.length > 1){ list.shift(); try { localStorage.setItem(K.snapshots, JSON.stringify(list)); return snap; } catch (e2){} }
    }
    return snap;

  autoBackupIfDue: function(){

    var list = DB.snapshots();
    var today = isoToday();
    var hasTodayAuto = list.some(function(s){ return s.reason === "auto" && String(s.at).slice(0,10) === today; });
    if (!hasTodayAuto) DB.takeSnapshot("auto");

    // 復元前に今の状態も退避しておく
    DB.takeSnapshot("復元前");
    write(K.deals, b.deals || []);

      var deal = DB.createDeal(s);
      var patch = {};
      Object.keys(stamps).forEach(function(k){ patch[k] = stamps[k]; });
      if (survey) patch.survey = survey;
      DB.updateDeal(deal.id, patch);
      // rebuild status events from stamps so funnel/KPIs work
      PIPELINE.slice(1).forEach(function(st){
        if (stamps[st.dateField]) DB._addEvent(deal.id, st.key, stamps[st.dateField]);
      });
      if (stamps.won_on) DB._addEvent(deal.id, "won", stamps.won_on);
      if (stamps.lost_on) DB._addEvent(deal.id, "lost", stamps.lost_on);
    });
  }
};

/* ============================================================
   Calculations  (lib/calc.ts)
   ============================================================ */
var Calc = {
  profit: function(deal){
    var p = num(deal.amount_presented);
    if (p === null) return { profit:null, rate:null };
    var cost = (num(deal.cost_construction)||0) + (num(deal.cost_other)||0);
    var profit = p - cost;
    var rate = p !== 0 ? (profit / p * 100) : null;
    return { profit:profit, rate:rate };
  },
  isActive: function(deal){ return deal.status !== "won" && deal.status !== "lost"; },

  /* how far this deal ever progressed (max pipeline index reached), from events */
  reachedIndex: function(deal){
    var evs = DB.events(deal.id);
    var max = 0;
    evs.forEach(function(e){
      var idx = pipeIndex(e.status);
      if (idx > max) max = idx;
    });
    var cur = pipeIndex(deal.status);
    if (cur > max) max = cur;
    return max;
  },

  /* KPI block for a period. scope = 'month' | 'all' */
  kpis: function(scope){
    var deals = DB.deals();
    var evs = DB.events();
    var monthly = (scope === "month");
    function evCount(statusKey){
      var seen = {};
      evs.forEach(function(e){
        if (e.status !== statusKey) return;
        if (monthly && !inThisMonth(e.changed_on)) return;
        seen[e.deal_id] = true;
      });
      return Object.keys(seen).length;
    }
    function surveyCount(){
      var seen = {};
      evs.forEach(function(e){
        if (e.status !== "survey_scheduled" && e.status !== "survey_done") return;
        if (monthly && !inThisMonth(e.changed_on)) return;
        seen[e.deal_id] = true;
      });
      return Object.keys(seen).length;
    }
    var registered = deals.filter(function(d){ return monthly ? inThisMonth(d.created_on) : true; }).length;
    var phone = evCount("phone_connected");
    var quoteReq = evCount("quote_requested");
    var survey = surveyCount();
    var quoteSub = evCount("quote_submitted");
    var won = evCount("won");
    var lost = evCount("lost");
    var winRate = (won + lost) > 0 ? (won / (won + lost) * 100) : null;

    var estProfit = 0, hasEst = false;
    deals.forEach(function(d){
      if (!Calc.isActive(d)) return;
      var pr = Calc.profit(d).profit;
      if (pr !== null){ estProfit += pr; hasEst = true; }
    });
    var confProfit = 0, hasConf = false;
    deals.forEach(function(d){
      if (d.status !== "won") return;
      if (monthly && !inThisMonth(d.won_on)) return;
      var pr = Calc.profit(d).profit;
      if (pr !== null){ confProfit += pr; hasConf = true; }
    });

    return {
      registered:registered, phone:phone, quoteReq:quoteReq, survey:survey,
      quoteSub:quoteSub, won:won, lost:lost, winRate:winRate,
      estProfit: hasEst ? estProfit : null,
      confProfit: hasConf ? confProfit : null
    };
  },

  funnel: function(scope){
    var k = Calc.kpis(scope);
    var stages = [
      { name:"案件登録", count:k.registered },
      { name:"電話接続", count:k.phone,    conv:k.registered ? k.phone/k.registered : null, convLabel:"電話接続率" },
      { name:"見積依頼", count:k.quoteReq, conv:k.phone ? k.quoteReq/k.phone : null,        convLabel:"見積依頼率" },
      { name:"現調",     count:k.survey,   conv:k.quoteReq ? k.survey/k.quoteReq : null,     convLabel:"現調率" },
      { name:"見積提出", count:k.quoteSub, conv:k.survey ? k.quoteSub/k.survey : null,       convLabel:"見積提出率" },
      { name:"成約",     count:k.won,      conv:k.quoteSub ? k.won/k.quoteSub : null,        convLabel:"見積→成約率" }
    ];
    var max = Math.max.apply(null, stages.map(function(s){ return s.count; }).concat([1]));
    stages.forEach(function(s){ s.width = Math.max(8, Math.round(s.count / max * 100)); });
    return stages;
  },

  avgWinDays: function(){
    var deals = DB.deals().filter(function(d){ return d.status==="won" && d.won_on && d.created_on; });
    if (!deals.length) return null;
    var sum = deals.reduce(function(a,d){ return a + daysBetween(d.created_on, d.won_on); }, 0);
    return Math.round(sum / deals.length);
  },

  // 直近n ヶ月の確定利益（成約日ベース）の推移
  monthlyProfit: function(n){
    var d0 = new Date();
    var curYear = d0.getFullYear();
    var months = [];
    for (var i = n-1; i >= 0; i--){
      var d = new Date(d0.getFullYear(), d0.getMonth() - i, 1);
      var key = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
      months.push({
        key:key,
        label:(d.getFullYear()!==curYear ? String(d.getFullYear()).slice(2)+"/" : "") + (d.getMonth()+1)+"月",
        isCurrent: (i===0),
        profit:0, count:0
      });
    }
    var idx = {}; months.forEach(function(m){ idx[m.key] = m; });
    DB.deals().forEach(function(d){
      if (d.status !== "won" || !d.won_on) return;
      var m = idx[d.won_on.slice(0,7)];
      if (!m) return;
      var pr = Calc.profit(d).profit;
      if (pr !== null){ m.profit += pr; m.count++; }
    });
    return months;
  },

  avgProfitRate: function(statusFilter){
    var deals = DB.deals().filter(function(d){ return !statusFilter || d.status === statusFilter; });
    var sum = 0, cnt = 0;
    deals.forEach(function(d){
      var r = Calc.profit(d).rate;
      if (r !== null){ sum += r; cnt++; }
    });
    return cnt ? sum / cnt : null;
  },

  /* --- 事前見積: 延床予測 -------------------------------------------------- */
  // deal.pre = { land_tsubo, structure, floors, age_band, coverage, far, known_floor, addons:{k:bool} }
  predictFloorArea: function(pre){
    if (!pre) return null;
    var known = num(pre.known_floor);
    if (known && known > 0) return { low:known, mid:known, high:known, known:true };
    var land = num(pre.land_tsubo);
    if (!land || land <= 0) return null;
    var st = pre.structure || "木造";
    var floors = num(pre.floors) || 2;
    var fk = Math.max(1, Math.min(3, Math.round(floors)));
    var lightHouse = (st === "木造" || st === "鉄骨造") && floors <= 3;

    // ルートA: 建築面積（実際の建ぺい充足率）× 階数 × 0.85
    var coverageFill = { "木造":0.45, "鉄骨造":0.50, "RC造":0.60, "SRC造":0.60, "その他":0.50 }[st] || 0.5;
    var ageAdj = ({ old:-0.06, mid:0, "new":0.03, unknown:0 })[pre.age_band] || 0;
    var cf = Math.max(0.30, Math.min(0.78, coverageFill + ageAdj));
    var routeA = land * cf * floors * 0.85;
    var cov = num(pre.coverage); // 建蔽率 %
    if (cov) routeA = Math.min(routeA, land * (cov/100) * floors * 0.9);

    // ルートB: 容積率 × 充足率
    var far = num(pre.far); // 容積率 %
    var farFill = lightHouse ? 0.55 : 0.75;
    var routeB = far ? land * (far/100) * farFill : 0;

    // ルートC: 標準延床
    var trow = TYPICAL_FLOOR[st] || TYPICAL_FLOOR["その他"];
    var routeC = trow[fk] || trow.def;
    if (pre.age_band === "old") routeC *= 0.85;

    var base = Math.max(routeA, routeB, routeC); // 安全側 = 大きいほう
    return { low: base*0.85, mid: base, high: base*1.2, known:false,
             routes:{ A:routeA, B:routeB||null, C:routeC } };
  },

  // 構造別の坪単価（円/坪）。単価マスタ優先、無ければ仮単価。
  unitPriceFor: function(structure){
    var name = STRUCT_TO_UNITNAME[structure];
    if (name){
      var row = DB.prices().filter(function(r){ return r.name === name; })[0];
      if (row && num(row.unit_price) !== null) return { price:num(row.unit_price), fallback:false };
    }
    return { price: FALLBACK_UNIT_PRICE[structure] || FALLBACK_UNIT_PRICE["その他"], fallback:true };
  },

  // 事前見積（社内）: {low, mid, high, structureCost, addonCost, unit, usedFallback, floor}
  preEstimate: function(deal){
    var pre = deal.pre;
    var floor = Calc.predictFloorArea(pre);
    if (!floor) return null;
    var st = (pre && pre.structure) || "木造";
    var u = Calc.unitPriceFor(st);
    var prices = DB.prices();
    function masterPrice(nm){
      if (!nm) return null;
      var row = prices.filter(function(r){ return r.name === nm; })[0];
      return row ? num(row.unit_price) : null;
    }
    var addons = (pre && pre.addons) || {};
    var addonCost = 0;
    PRE_ADDONS.forEach(function(a){
      if (!addons[a.k]) return;
      if (a.k === "tight"){ addonCost += floor.mid * 10000; return; } // 手壊し割増
      var mp = masterPrice(a.priceName);
      addonCost += (mp !== null ? mp : a.amount);
    });
    // 付帯・処分・諸経費のざっくり率（本体の25%）
    function pack(fa){
      var body = fa * u.price;
      var overhead = body * 0.25;
      return body + overhead + addonCost;
    }
    return {
      low:  pack(floor.low)  * 0.95,
      mid:  pack(floor.mid),
      high: pack(floor.high) * 1.1,
      structureCost: floor.mid * u.price,
      overhead: floor.mid * u.price * 0.25,
      addonCost: addonCost,
      unit: u.price,
      usedFallback: u.fallback,
      floor: floor
    };
  },

  // 客先予算（円）: 数値優先、無ければ帯の中央値
  clientBudgetValue: function(deal){
    var v = num(deal.client_budget);
    if (v && v > 0) return v;
    if (deal.client_budget_band && BUDGET_BAND_MID[deal.client_budget_band]) return BUDGET_BAND_MID[deal.client_budget_band];
    return null;
  },

  // 予算 vs 事前見積: { status:'favorable'|'even'|'short'|'unknown', budget, mid, diff, ratio }
  budgetVsEstimate: function(deal){
    var est = Calc.preEstimate(deal);
    var budget = Calc.clientBudgetValue(deal);
    if (!est || !budget) return { status:"unknown", budget:budget, mid: est?est.mid:null, diff:null, ratio:null };
    var diff = budget - est.mid;
    var ratio = budget / est.mid;
    var status = ratio >= 1.08 ? "favorable" : ratio <= 0.92 ? "short" : "even";
    return { status:status, budget:budget, mid:est.mid, diff:diff, ratio:ratio };
  },
  suggestProbability: function(deal){
    var bv = Calc.budgetVsEstimate(deal);
    if (bv.status === "favorable") return "A";
    if (bv.status === "even") return "B";
    if (bv.status === "short") return "C";
    return null;
  },

  priorityScore: function(deal){
    if (!Calc.isActive(deal)) return -99;
    var s = 0;
    s += ({ A:3, B:1, C:-1, D:-2 })[deal.probability] || 0;
    if (deal.status === "quote_submitted" || deal.status === "considering") s += 2;
    if (deal.status === "survey_scheduled" || deal.status === "survey_done" || deal.status === "quote_requested") s += 1;
    if (deal.next_follow_on){
      if (deal.next_follow_on < isoToday()) s += 3;
      else if (deal.next_follow_on === isoToday()) s += 2;
    }
    var pr = Calc.profit(deal).profit;
    if (pr !== null && pr >= 3000000) s += 1;
    var bv = Calc.budgetVsEstimate(deal);
    if (bv.status === "favorable") s += 2;   // 予算＞事前見積 = 利益が乗りやすい
    else if (bv.status === "short") s -= 1;
    return s;
  },
  priorityBucket: function(deal){
    var s = Calc.priorityScore(deal);
    if (s <= -99) return null;
    if (s >= 4) return "high";
    if (s >= 1) return "mid";
    return "low";
  },

  topPriority: function(n){
    return DB.deals().filter(Calc.isActive)
      .map(function(d){ return { d:d, s:Calc.priorityScore(d) }; })
      .sort(function(a,b){
        if (b.s !== a.s) return b.s - a.s;
        var af = a.d.next_follow_on || "9999", bf = b.d.next_follow_on || "9999";
        if (af !== bf) return af < bf ? -1 : 1;
        return (Calc.profit(b.d).profit||0) - (Calc.profit(a.d).profit||0);
      })
      .slice(0, n).map(function(x){ return x.d; });
  },

  followBuckets: function(){
    var t = isoToday();
    var out = { overdue:[], today:[], upcoming:[] };
    DB.deals().filter(Calc.isActive).forEach(function(d){
      if (!d.next_follow_on) return;
      if (d.next_follow_on < t) out.overdue.push(d);
      else if (d.next_follow_on === t) out.today.push(d);
      else out.upcoming.push(d);
    });
    function by(a,b){ return (a.next_follow_on||"") < (b.next_follow_on||"") ? -1 : 1; }
    out.overdue.sort(by); out.today.sort(by); out.upcoming.sort(by);
    return out;
  },

  estimateCost: function(structure, tsubo, addons){
    var prices = DB.prices();
    if (!prices.length) return null;
    function priceOf(name){
      var row = prices.filter(function(r){ return r.name === name; })[0];
      return row ? num(row.unit_price) : null;
    }
    var total = 0, breakdown = [];
    var sName = STRUCT_TO_UNITNAME[structure];
    if (sName && tsubo){
      var up = priceOf(sName);
      if (up !== null){ total += up * tsubo; breakdown.push({ label:sName + " × " + tsubo + "坪", amount:up*tsubo }); }
    }
    (addons||[]).forEach(function(a){
      var up = priceOf(a.name);
      if (up !== null){ var amt = up * (a.qty||1); total += amt; breakdown.push({ label:a.name + " × " + (a.qty||1), amount:amt }); }
    });
    return { total:total, breakdown:breakdown };
  }
};

  var bd = document.getElementById("backdrop");

    '<div class="dialog" role="dialog" aria-modal="true">'+
      '<h3>'+esc(opts.title||"")+'</h3>'+

      '</div>'+
    '</div>';

  function close(){ bd.classList.remove("is-open"); bd.innerHTML=""; }

  if (opts.onMount) opts.onMount(bd.querySelector("#dialogBody"));
  return close;
}

}

/* ---- 日付フィールド: ネイティブ date をやめて素のテキスト入力に --------- */
function isoToDisp(s){
  if (!s) return "";
  var p = String(s).split("-");
  if (p.length < 3 || !p[0] || !p[1] || !p[2]) return "";
  return p[0] + "/" + String(p[1]).padStart(2,"0") + "/" + String(p[2]).padStart(2,"0");
}
function dispToIso(raw){
  if (raw == null) return "";
  var t = String(raw).trim();
  if (!t) return "";
  var y, m, d;
  var n = t.split(/[^\d]+/).filter(Boolean).map(Number);
  if (n.length >= 3){ y = n[0]; m = n[1]; d = n[2]; }
  else if (n.length === 2){ y = new Date().getFullYear(); m = n[0]; d = n[1]; }
  else {
    var s = t.replace(/\D/g, "");
    if (s.length === 8){ y = +s.slice(0,4); m = +s.slice(4,6); d = +s.slice(6,8); }
    else if (s.length === 6){ y = 2000 + +s.slice(0,2); m = +s.slice(2,4); d = +s.slice(4,6); }
    else return null;
  }
  if (y < 100) y += 2000;
  if (!(y >= 2000 && y <= 2100 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  var dt = new Date(y, m-1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== m-1 || dt.getDate() !== d) return null;
  return y + "-" + String(m).padStart(2,"0") + "-" + String(d).padStart(2,"0");
}
function dateField(label, name, value, opts){
  opts = opts || {};
  var disp = isoToDisp(value);
  var idAttr = opts.id ? ' id="'+opts.id+'"' : '';
  var ph = opts.placeholder || "20260905";
  var inner =
    '<span class="datewrap">'+
      '<input class="input datein" data-datefor="'+name+'" type="text" inputmode="numeric" '+
        'placeholder="'+esc(ph)+'" value="'+esc(disp)+'" autocomplete="off" spellcheck="false">'+
      '<input type="hidden" data-field="'+name+'"'+idAttr+' value="'+esc(value||"")+'">'+
    '</span>';
  if (opts.bare) return inner;
  return '<label class="field"><span class="field__label">'+esc(label)+'</span>'+inner+
    (opts.hint === false ? '' : '<span class="field__hint">'+(opts.hint || "例) 20260905")+'</span>')+'</label>';
}
function syncDateField(wrap){
  var vis = wrap.querySelector(".datein");
  var hid = wrap.querySelector('input[type="hidden"]');
  var iso = dispToIso(vis.value);
  if (iso === ""){ hid.value = ""; vis.value = ""; }
  else if (iso === null){ vis.value = isoToDisp(hid.value); return false; }
  else { hid.value = iso; vis.value = isoToDisp(iso); }
  hid.dispatchEvent(new Event("change", { bubbles:true }));
  return true;
}
function wireDateFields(root){
  root.querySelectorAll(".datewrap").forEach(function(w){
    var vis = w.querySelector(".datein");
    if (!vis || w._wired) return; w._wired = true;
    vis.addEventListener("blur", function(){ syncDateField(w); });
    vis.addEventListener("change", function(){ syncDateField(w); });
  });
}
function setDateField(root, name, iso){
  var vis = root.querySelector('.datein[data-datefor="'+name+'"]');
  if (!vis) return;
  var wrap = vis.closest(".datewrap");
  vis.value = isoToDisp(iso);
  var hid = wrap.querySelector('input[type="hidden"]');
  hid.value = iso || "";
  hid.dispatchEvent(new Event("change", { bubbles:true }));
}

/* ---- 金額フィールド: 「680万」「1.2億」入力に対応 ------------------------ */
function parseYen(raw){
  if (raw == null) return null;
  var t = String(raw).trim().replace(/[,\s¥￥円]/g, "").replace(/兆/g, "");
  if (!t) return null;
  if (/^-?\d+(\.\d+)?$/.test(t)) return Math.round(Number(t));
  if (!/^-?[\d.億万千]+$/.test(t)) return null;
  var total = 0, matched = false, m;
  var re = /(-?\d+(?:\.\d+)?)(億|万|千)?/g;
  while ((m = re.exec(t))){
    if (!m[1]) { re.lastIndex++; continue; }
    matched = true;
    var mult = m[2] === "億" ? 1e8 : m[2] === "万" ? 1e4 : m[2] === "千" ? 1e3 : 1;
    total += Number(m[1]) * mult;
    if (re.lastIndex === m.index) re.lastIndex++;
  }
  return matched ? Math.round(total) : null;
}
function moneyField(label, name, value, opts){
  opts = opts || {};
  var disp = (value===null||value===undefined||value==="") ? "" : NF.format(Math.round(Number(value)));
  var inner =

/* ---- 必須項目の共通バリデーション: 赤枠＋メッセージ＋スクロール＆フォーカス ---- */
var _errBannerTimer;
function flashError(message){
  var b = document.getElementById("errbanner");
  if (!b) return;
  b.textContent = message;
  b.classList.add("is-open");
  clearTimeout(_errBannerTimer);
  _errBannerTimer = setTimeout(function(){ b.classList.remove("is-open"); }, 4000);
}
function markFieldError(el, message){
  var msgText = message || "この項目は必須です";
  toast(msgText);        // 画面下の通知
  flashError(msgText);   // 画面上の赤バナー（スクロール位置に関係なく必ず見える）
  if (!el) return true;
  el.classList.add("is-invalid");
  el.setAttribute("aria-invalid", "true");
  var host = (el.closest && el.closest(".field")) || el.parentNode;
  var msg = null;
  if (host){
    var kids = host.children, i;
    for (i = 0; i < kids.length; i++){ if (kids[i].getAttribute && kids[i].getAttribute("class") === "fielderr"){ msg = kids[i]; break; } }
    if (!msg){ msg = document.createElement("div"); msg.className = "fielderr"; host.appendChild(msg); }
    msg.textContent = msgText;
  }
  try { el.focus({ preventScroll:true }); } catch(e){ try{ el.focus(); }catch(e2){} }
  try { el.scrollIntoView({ block:"center", behavior:"smooth" }); } catch(e){}
  el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake");
  if (!el._reqWired){
    el._reqWired = true;
    var clear = function(){ clearFieldError(el); };
    el.addEventListener("input", clear);
    el.addEventListener("change", clear);
  }
  return true;
}
function clearFieldError(el){
  if (!el) return;
  el.classList.remove("is-invalid");
  el.removeAttribute("aria-invalid");
  var host = el.closest(".field") || el.parentNode, kids = host ? host.children : [], i;
  for (i = 0; i < kids.length; i++){ if (kids[i].className === "fielderr"){ kids[i].remove(); break; } }
}
// 値があればOK、空なら赤表示して true（＝未入力）を返す
function requireField(el, message){
  if (!el) return false;
  var ok = el.type === "checkbox" ? el.checked : String(el.value || "").trim() !== "";
  if (ok){ clearFieldError(el); return false; }
  return markFieldError(el, message);
}
// root配下の「その他」未入力を赤表示。未入力があれば true。
function requireOthers(root){
  var m = otherMissing(root);
  if (m){ markFieldError(m, "「その他」を選んだので内容を入力してください"); return true; }
  return false;
}
function fieldInput(label, name, value, opts){

  return '<label class="field"><span class="field__label">'+esc(label)+(opts.required?'<span class="req">*</span>':'')+'</span>'+

    (opts.type==="number"?'step="'+(opts.step||"any")+'" ':(opts.step?'step="'+opts.step+'" ':''))+
    'value="'+esc(value===null||value===undefined?"":value)+'" />'+

/* ============================================================
   Router
   ============================================================ */
var routes = [
  { re:/^\/$/,                 view:function(){ return ViewDashboard(); } },
  { re:/^\/deals$/,            view:function(){ return ViewDeals(); } },
  { re:/^\/deals\/new$/,       view:function(){ return ViewDealNew(); } },
  { re:/^\/deals\/([^/]+)$/,   view:function(m){ return ViewDealDetail(m[1]); } },
  { re:/^\/follow-ups$/,       view:function(){ return ViewFollowUps(); } },
  { re:/^\/profit$/,           view:function(){ return ViewProfit(); } },
  { re:/^\/simulation$/,       view:function(){ return ViewSimulation(); } },
  { re:/^\/unit-prices$/,      view:function(){ return ViewUnitPrices(); } },
  { re:/^\/analytics$/,        view:function(){ return ViewAnalytics(); } },
  { re:/^\/settings$/,         view:function(){ return ViewSettings(); } }
];

function currentPath(){
  var h = location.hash.replace(/^#/, "");
  return h || "/";
}
function navTo(path){ location.hash = path; }

// 画面の描画に失敗したときの復旧画面（アプリ全体を落とさない）
function errorView(err, path){
  var detail = (err && (err.stack || err.message)) ? String(err.stack || err.message).slice(0, 600) : String(err || "不明なエラー");
  var report = "解体サーチ エラー報告\nbuild: " + (typeof APP_BUILD!=="undefined"?APP_BUILD:"?") + "\npath: " + (path||"") + "\ntime: " + new Date().toISOString() + "\n" + detail;
  return {
    title: "表示できませんでした",
    html:
      '<div class="card" style="border-left:4px solid var(--danger)">'+
        '<div style="font-weight:800;font-size:15px;margin-bottom:6px">この画面の表示でエラーが発生しました</div>'+
        '<p class="muted" style="font-size:13px;margin:0 0 12px">データは保存されています。下のいずれかで復帰できます。</p>'+
        '<div class="row" style="flex-wrap:wrap;gap:8px">'+
          '<button class="btn btn--primary btn--sm" data-err="reload">この画面を再読み込み</button>'+
          '<button class="btn btn--soft btn--sm" data-err="home">ホームへ</button>'+
          '<button class="btn btn--soft btn--sm" data-err="settings">設定（データ・バックアップ）</button>'+
          '<button class="btn btn--ghost btn--sm" data-err="copy">エラー内容をコピー</button>'+
        '</div>'+
        '<pre style="margin-top:12px;font-size:11px;white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:160px;overflow:auto">'+esc(detail)+'</pre>'+
      '</div>',
    mount: function(root){
      root.querySelectorAll("[data-err]").forEach(function(b){
        b.onclick = function(){
          var k = b.getAttribute("data-err");
          if (k === "reload") render();
          else if (k === "home") navTo("/");
          else if (k === "settings") navTo("/settings");
          else if (k === "copy"){
            var ok = false;
            try { var t=document.createElement("textarea"); t.value=report; document.body.appendChild(t); t.select(); ok=document.execCommand("copy"); document.body.removeChild(t); } catch(e){}
            if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(report); ok=true; }
            toast(ok ? "コピーしました" : "コピーできませんでした");
          }
        };
      });
    }
  };
}

function render(){
  var path = currentPath();
  var vm = null;
  try {
    for (var i=0;i<routes.length;i++){
      var m = path.match(routes[i].re);
      if (m){ vm = routes[i].view(m); break; }
    }
    if (!vm) vm = ViewDashboard();
  } catch (e){
    logError("view-build", (e && e.message) || e, e && e.stack);
    vm = errorView(e, path);
  }

  var viewEl = document.getElementById("view");
  try {
    viewEl.innerHTML = vm.html;
    document.getElementById("appbarTitle").textContent = vm.title;
    var backBtn = document.getElementById("appbarBack");
    if (vm.back){ backBtn.style.display=""; backBtn.onclick = function(){ vm.back(); }; }
    else backBtn.style.display = "none";
    document.getElementById("appbarAction").innerHTML = vm.appbarAction || "";
    if (vm.mount) vm.mount(viewEl);
  } catch (e){
    logError("view-mount", (e && e.message) || e, e && e.stack);
    var ev = errorView(e, path);
    viewEl.innerHTML = ev.html;
    try { document.getElementById("appbarTitle").textContent = ev.title; document.getElementById("appbarAction").innerHTML = ""; } catch (x) {}
    if (ev.mount) try { ev.mount(viewEl); } catch (x) {}
  }
  try { updateNav(path); } catch (e) {}
  window.scrollTo(0,0);
}

function activeKey(path){
  if (path === "/deals/new") return "/deals/new";
  return path === "/" ? "/" : "/" + path.split("/")[1];
}
function updateNav(path){
  var key = activeKey(path);
  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.classList.toggle("is-active", el.getAttribute("data-nav") === key);
  });
  document.querySelectorAll("[data-tab]").forEach(function(el){
    el.classList.toggle("is-active", el.getAttribute("data-tab") === key);
  });
}

        '<p class="muted" style="font-size:12.5px;margin:6px 0 10px">'+

var dealFilters = { q:"", status:"", prob:"", source:"", from:"", to:"" };
var dealSort = "created_desc";
var DEAL_SORTS = [
  { k:"created_desc",  label:"登録が新しい順" },
  { k:"follow_asc",    label:"次回追客が近い順" },
  { k:"stale_desc",    label:"放置が長い順" },
  { k:"amount_desc",   label:"提示金額が高い順" },
  { k:"profit_desc",   label:"見込利益が高い順" }
];

function ViewDeals(){
  var deals = DB.deals().slice();

  function pass(d){
    var f = dealFilters;
    if (f.q){
      var q = f.q.toLowerCase().trim();
      var qDigits = q.replace(/\D/g, "");
      var hit = (d.company_name||"").toLowerCase().indexOf(q) >= 0
        || (d.contact_name||"").toLowerCase().indexOf(q) >= 0
        || (d.site_address||"").toLowerCase().indexOf(q) >= 0
        || (qDigits.length >= 3 && (d.phone||"").replace(/\D/g,"").indexOf(qDigits) >= 0)
        || (d.code||"").toLowerCase().indexOf(q) >= 0;
      if (!hit) return false;
    }
    if (f.status && d.status !== f.status) return false;
    if (f.prob && d.probability !== f.prob) return false;
    if (f.source && d.source !== f.source) return false;
    if (f.from && d.created_on < f.from) return false;
    if (f.to && d.created_on > f.to) return false;
    return true;
  }
  var filtered = deals.filter(pass);
  var sortFns = {
    created_desc: function(a,b){ return (b.created_on||"") < (a.created_on||"") ? -1 : (b.created_on||"") > (a.created_on||"") ? 1 : 0; },
    follow_asc: function(a,b){ var av=a.next_follow_on||"9999-99-99", bv=b.next_follow_on||"9999-99-99"; return av<bv?-1:av>bv?1:0; },
    stale_desc: function(a,b){
      var aa = Calc.isActive(a), ab = Calc.isActive(b);
      if (aa !== ab) return aa ? -1 : 1;              // 進行中を先に
      return (lastContactDays(b)||-1) - (lastContactDays(a)||-1);
    },
    amount_desc: function(a,b){ return (num(b.amount_presented)||-1) - (num(a.amount_presented)||-1); },
    profit_desc: function(a,b){ return (Calc.profit(b).profit==null?-1e15:Calc.profit(b).profit) - (Calc.profit(a).profit==null?-1e15:Calc.profit(a).profit); }
  };
  filtered.sort(sortFns[dealSort] || sortFns.created_desc);

  var html =
    '<div class="page-head only-desktop"><div><h1>案件一覧</h1><p>'+filtered.length+' / '+deals.length+' 件</p></div></div>';

  var activeFilterCount = ["status","prob","source","from","to"].filter(function(kk){ return dealFilters[kk]; }).length;
  html += '<div class="filterbar">'+
    '<div class="search">'+icon("search")+'<input class="input" id="fq" placeholder="会社名・担当・電話・住所で検索" value="'+esc(dealFilters.q)+'"></div>'+
    '<select class="select" id="fsort" style="max-width:170px">'+
      DEAL_SORTS.map(function(o){ return '<option value="'+o.k+'"'+(dealSort===o.k?" selected":"")+'>'+esc(o.label)+'</option>'; }).join("")+
    '</select>'+
    '<button class="btn btn--soft btn--sm only-mobile" id="filterToggle">絞り込み'+(activeFilterCount?' <span class="badge" style="--c:var(--primary)">'+activeFilterCount+'</span>':'')+'</button>'+
    '<div class="filter-more'+(activeFilterCount?' is-open':'')+'" id="filterMore">'+
      '<select class="select" id="fstatus" style="max-width:150px"><option value="">ステータス：全て</option>'+
        ALL_STATUSES.map(function(s){ return '<option value="'+s.key+'"'+(dealFilters.status===s.key?" selected":"")+'>'+s.label+'</option>'; }).join("")+
      '</select>'+
      '<select class="select" id="fprob" style="max-width:130px"><option value="">見込み度：全て</option>'+
        PROBABILITIES.map(function(p){ return '<option value="'+p.k+'"'+(dealFilters.prob===p.k?" selected":"")+'>'+p.k+'</option>'; }).join("")+
      '</select>'+
      '<select class="select" id="fsource" style="max-width:160px"><option value="">経路：全て</option>'+
        SOURCES.map(function(s){ return '<option'+(dealFilters.source===s?" selected":"")+'>'+esc(s)+'</option>'; }).join("")+
      '</select>'+
      dateField(null,"ffrom",dealFilters.from,{bare:true,id:"ffrom",placeholder:"登録日From"})+
      dateField(null,"fto",dealFilters.to,{bare:true,id:"fto",placeholder:"登録日To"})+
      '<button class="btn btn--ghost btn--sm" id="fclear">クリア</button>'+
    '</div>'+
  '</div>';

  if (!filtered.length){
    html += '<div class="card"><div class="empty">'+icon("inbox")+'<h3>該当する案件がありません</h3>'+
      '<p>条件を変えるか、下の「登録」から案件を追加してください。</p></div></div>';
  } else {
    // desktop table
    html += '<div class="table-wrap only-desktop"><table class="table"><thead><tr>'+
      '<th>会社名 / 担当</th><th>ステータス</th><th>見込み</th><th class="num">提示金額</th>'+
      '<th class="num">見込利益</th><th>次回追客</th><th>優先</th></tr></thead><tbody>';
    var telChip = function(d){
      var tel = (d.phone||"").replace(/[^\d+]/g,"");
      return tel ? '<a class="chipbtn" style="min-height:30px;font-size:12px;padding:0 10px;margin-top:6px" href="tel:'+esc(tel)+'">'+icon("phone")+'発信</a>' : '';
    };
    filtered.forEach(function(d){
      var pr = Calc.profit(d);
      var overdue = d.next_follow_on && d.next_follow_on < isoToday() && Calc.isActive(d);
      var stale = Calc.isActive(d) ? lastContactDays(d) : null;
      var staleB = (stale !== null && stale >= 10) ? ' <span class="badge '+(stale>=21?'pr-high':'pr-mid')+'" title="最終接触からの日数">放置'+stale+'日</span>' : '';
      html += '<tr class="clickable" data-goto="'+d.id+'">'+
        '<td><div style="font-weight:800">'+esc(d.company_name||"（無名）")+'</div>'+
          '<div class="muted" style="font-size:12px">'+esc(d.contact_name||"")+' ・ 登録 '+fmtDate(d.created_on)+'</div>'+telChip(d)+'</td>'+
        '<td>'+statusBadge(d.status)+staleB+'</td>'+
        '<td>'+probBadge(d.probability)+'</td>'+
        '<td class="num" title="'+yen(d.amount_presented)+'">'+yenMan(d.amount_presented)+'</td>'+
        '<td class="num" title="'+yen(pr.profit)+'">'+yenMan(pr.profit)+'</td>'+
        '<td style="white-space:nowrap'+(overdue?';color:var(--danger);font-weight:800':'')+'">'+(d.next_follow_on?fmtDate(d.next_follow_on):"—")+'</td>'+
        '<td>'+(prioBadge(Calc.priorityBucket(d))||"—")+'</td>'+
      '</tr>';
    });
    html += '</tbody></table></div>';

    // mobile cards
    html += '<div class="stack only-mobile">';
    filtered.forEach(function(d){
      var pr = Calc.profit(d);
      var overdue = d.next_follow_on && d.next_follow_on < isoToday() && Calc.isActive(d);
      var stale = Calc.isActive(d) ? lastContactDays(d) : null;
      var staleB = (stale !== null && stale >= 10) ? '<span class="badge '+(stale>=21?'pr-high':'pr-mid')+'">放置'+stale+'日</span>' : '';
      html += '<div class="deal-card" data-goto="'+d.id+'">'+
        '<div class="deal-card__top">'+
          '<div><div class="deal-card__co">'+esc(d.company_name||"（無名）")+'</div>'+
          '<div class="deal-card__meta">'+esc(d.contact_name||"担当者未設定")+' ・ '+esc(sourceLabel(d)||"経路未設定")+'</div>'+
          '<div class="deal-card__meta">登録 '+fmtDate(d.created_on)+'</div></div>'+
          probBadge(d.probability)+
        '</div>'+
        '<div class="deal-card__row" style="flex-wrap:wrap;gap:6px">'+statusBadge(d.status)+(prioBadge(Calc.priorityBucket(d))||"")+staleB+'</div>'+
        '<div class="deal-card__row"><span class="muted">提示 '+yenMan(d.amount_presented)+'</span>'+
          '<span class="deal-card__amt">見込利益 '+yenMan(pr.profit)+'</span></div>'+
        '<div class="deal-card__row"><span class="muted">次回追客</span>'+
          '<span style="white-space:nowrap'+(overdue?';color:var(--danger);font-weight:800':'')+'">'+(d.next_follow_on?fmtDate(d.next_follow_on):"—")+'</span></div>'+
        (telChip(d) ? '<div class="row" style="margin-top:8px">'+telChip(d)+'</div>' : '')+
      '</div>';
    });
    html += '</div>';
  }

  return {
    title:"案件一覧",
    html:html,
    mount:function(root){
      root.querySelectorAll("[data-goto]").forEach(function(el){
        el.onclick = function(e){
          if (e.target.closest && e.target.closest("a,button")) return; // 発信ボタン等は行遷移させない
          navTo("/deals/" + el.getAttribute("data-goto"));
        };
      });
      function bind(id, key, ev){
        var el = root.querySelector("#"+id); if (!el) return;
        el.addEventListener(ev || "change", function(){ dealFilters[key] = el.value; render(); });
      }
      var fq = root.querySelector("#fq");
      if (fq){
        var deb = debounce(function(){ dealFilters.q = fq.value; var pos=fq.selectionStart; render();
          var nf=document.querySelector("#fq"); if(nf){ nf.focus(); try{nf.setSelectionRange(pos,pos);}catch(e){} } }, 220);
        fq.addEventListener("input", deb);
      }
      bind("fstatus","status"); bind("fprob","prob"); bind("fsource","source");
      bind("ffrom","from"); bind("fto","to");
      wireDateFields(root);
      var ft = root.querySelector("#filterToggle");
      if (ft) ft.onclick = function(){ root.querySelector("#filterMore").classList.toggle("is-open"); };
      var fsort = root.querySelector("#fsort");
      if (fsort) fsort.addEventListener("change", function(){ dealSort = fsort.value; render(); });
      var fc = root.querySelector("#fclear");
      if (fc) fc.onclick = function(){ dealFilters = { q:"", status:"", prob:"", source:"", from:"", to:"" }; render(); };
    }
  };
}

/* ---- 物件情報テキストの解析（コピペ → 数値抽出） --------------------- */
function z2h(s){
  return String(s).replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
                  .replace(/　/g, " ");
}
function winAfter(text, kw, len){
  var i = text.indexOf(kw);
  return i < 0 ? "" : text.slice(i, i + kw.length + (len || 50));
}
function areaToTsubo(win){
  if (!win) return null;
  var w = win.replace(/,/g, "");
  var tm = w.match(/(\d+(?:\.\d+)?)\s*坪/);
  if (tm) return parseFloat(tm[1]);
  var mm = w.match(/(\d+(?:\.\d+)?)\s*(?:m2|㎡|m²|平米|平方(?:メートル|m)?)/i);
  if (mm) return parseFloat(mm[1]) / 3.30578;
  return null;
}
function parseListing(text){
  var t = z2h(text || "");
  var f = {};
  var found = [];
  function rec(label, disp){ found.push({ label:label, disp:disp }); }

  // 土地面積
  var landWin = "";
  ["土地面積","敷地面積","土地権利","地積","土地"].some(function(k){ var w = winAfter(t,k,60); if (w){ landWin = w; return true; } });
  var lt = areaToTsubo(landWin);
  if (lt){ lt = Math.round(lt*10)/10; f.land_tsubo = lt; rec("土地坪数", lt + "坪"); }

  // 建物面積 → 実延床(known_floor)
  var bWin = "";
  ["建物面積","延床面積","延べ床面積","建物延床","専有面積","床面積"].some(function(k){ var w = winAfter(t,k,60); if (w){ bWin = w; return true; } });
  var bt = areaToTsubo(bWin);
  if (bt){ bt = Math.round(bt*10)/10; f.known_floor = bt; rec("実延床(建物面積)", bt + "坪"); }

  // 構造（SRC を RC より先に判定）
  var st = null;
  if (/鉄骨鉄筋|ＳＲＣ|SRC/i.test(t)) st = "SRC造";
  else if (/鉄筋コンクリート|ＲＣ|RC造|RC/i.test(t)) st = "RC造";
  else if (/軽量鉄骨|重量鉄骨|鉄骨造|Ｓ造|鉄骨/.test(t)) st = "鉄骨造";
  else if (/木造|Ｗ造|在来|ツーバイフォー|2×4|２×４/.test(t)) st = "木造";
  if (st){ f.structure = st; rec("構造", st); }

  // 階数
  var fl = null;
  if (/平屋|平家/.test(t)) fl = 1;
  var fm = t.match(/(?:地上)?\s*(\d+)\s*階建/) || t.match(/(\d+)\s*階建て/) || t.match(/(\d+)\s*階\s*建/);
  if (fm) fl = parseInt(fm[1], 10);
  if (fl){ f.floors = fl; rec("階数", fl + "階"); }

  // 建ぺい率 / 容積率
  var cm = (winAfter(t,"建ぺい率",18) + winAfter(t,"建蔽率",18)).match(/(\d+(?:\.\d+)?)\s*[%％]/);
  if (cm){ f.coverage = parseFloat(cm[1]); rec("建蔽率", cm[1] + "%"); }
  var vm = winAfter(t,"容積率",18).match(/(\d+(?:\.\d+)?)\s*[%％]/);
  if (vm){ f.far = parseFloat(vm[1]); rec("容積率", vm[1] + "%"); }

  // 築年
  var year = null;
  var eraW = winAfter(t,"築年月",22) + " " + winAfter(t,"建築年月",22) + " " + winAfter(t,"完成",22) + " " + winAfter(t,"新築",22);
  var eraM = (eraW + " " + t).match(/(昭和|平成|令和)\s*(\d+)\s*年/);
  var ad4 = eraW.match(/(19|20)\d{2}/) || t.match(/((?:19|20)\d{2})\s*年(?:\s*\d+\s*月)?\s*(?:築|新築|建築|完成|竣工)/);
  var chikuM = t.match(/築\s*(\d+)\s*年/);
  if (eraM){
    var base = { "昭和":1925, "平成":1988, "令和":2018 }[eraM[1]];
    year = base + parseInt(eraM[2], 10);
  } else if (ad4){
    year = parseInt((ad4[1] && ad4[1].length === 4) ? ad4[1] : ad4[0], 10);
  } else if (chikuM){
    year = new Date().getFullYear() - parseInt(chikuM[1], 10);
  }
  if (year && year > 1900 && year <= new Date().getFullYear() + 1){
    var band = year <= 1980 ? "old" : year <= 2000 ? "mid" : "new";
    f.age_band = band;
    rec("築年", year + "年（" + ({ old:"〜1980", mid:"1981〜2000", "new":"2001〜" }[band]) + "）");
  }

  // 所在地
  var am = t.match(/(?:所在地|物件所在地|住所)[：:\s]*([^\n\r]{4,60})/);
  if (am){ f.address = am[1].trim(); rec("所在地", f.address.slice(0, 30)); }

  return { fields:f, found:found };
}
function landLvColor(lv){ return lv === "高確度" ? "var(--success)" : lv === "候補" ? "var(--warning)" : "var(--muted)"; }

// 解析結果（land: 判定＋抽出, pre: parseListing）を新規登録フォームへ反映
function applyListingResult(land, pre){
  pre = pre || { fields:{} };
  var pf = pre.fields || {};
  land = land || {};
  function fillField(name, val, scoped){
    var sel = (scoped ? '#newForm ' : '') + '[data-field="' + name + '"]';
    var el = document.querySelector(sel);
    if (el && !el.value && val != null && val !== ""){
      el.value = val; el.dispatchEvent(new Event("input", { bubbles:true })); el.dispatchEvent(new Event("change"));
    }
  }
  function setPe(name, val){
    var el = document.querySelector('[data-pe="' + name + '"]');
    if (el && val != null && val !== "" && !el.value){ el.value = val; el.dispatchEvent(new Event("change")); }
  }
  fillField("company_name", land.agency, true);
  fillField("contact_name", land.agentName, true);
  fillField("phone", land.phone, true);
  fillField("site_address", land.address || pf.address);

  // 事前見積の各欄（AI優先、無ければ parseListing）
  var known = land.buildingM2 ? Math.round(land.buildingM2 / 3.30578 * 10) / 10 : pf.known_floor;
  setPe("land_tsubo", land.landTsubo != null ? land.landTsubo : pf.land_tsubo);
  setPe("known_floor", known);
  setPe("structure", land.structure || pf.structure);
  setPe("floors", land.floors != null ? land.floors : pf.floors);
  setPe("coverage", land.coverage != null ? land.coverage : pf.coverage);
  setPe("far", land.far != null ? land.far : pf.far);
  var band = pf.age_band;
  if (land.buildYear) band = land.buildYear <= 1980 ? "old" : land.buildYear <= 2000 ? "mid" : "new";
  if (band){
    var bb = document.querySelector('[data-peseg="age_band"] .choice[data-val="' + band + '"]');
    if (bb) bb.click();
  }

  // 見込み度: 高確度 は既定(C)のときだけ B に引き上げ
  if (land.level === "高確度"){
    var segNew = document.querySelector('#newForm [data-seg="probability"] .choice.is-on');
    if (segNew && segNew.getAttribute("data-val") === "C"){
      var bBtn = document.querySelector('#newForm [data-seg="probability"] .choice[data-val="B"]');
      if (bBtn) bBtn.click();
    }
  }

  // メモに読み取り内容＋判定を追記
  var memoEl = document.querySelector('[data-field="memo"]');
  if (memoEl){
    var mlines = [
      (land.name && land.name.indexOf("名称不明") < 0) ? "物件: " + land.name : "",
      land.price ? "価格: " + land.price : "",
      land.landText ? "土地: " + land.landText : "",
      land.genkyo ? "現況: " + land.genkyo : "",
      land.hikiwatashi ? "引渡: " + land.hikiwatashi : "",
      "更地渡し判定: " + (land.level || "?") + (land.reason ? "\n理由: " + land.reason : ""),
      land.url ? "元URL: " + land.url : ""
    ].filter(Boolean).join("\n");
    memoEl.value = memoEl.value ? (memoEl.value + "\n" + mlines) : mlines;
    memoEl.dispatchEvent(new Event("change"));
  }

  // 事前見積に値が入ったら、その折りたたみを開いて見せる
  var anyPe = ["land_tsubo","known_floor","structure","floors","coverage","far"].some(function(k){
    var el = document.querySelector('[data-pe="' + k + '"]'); return el && el.value;
  });
  var pd = document.querySelector("#preDisc");
  if (anyPe && pd && !pd.classList.contains("is-open")) pd.classList.add("is-open");

  // 同じ住所／会社の案件がすでにある場合は知らせる（二重登録の防止）
  var norm = function(s){ return String(s || "").replace(/[\s　\-‐-―ー－]/g, "").toLowerCase(); };
  var na = norm(land.address), nc = norm(land.agency);
  if (na || nc){
    var hit = DB.deals().filter(function(x){
      return (na && na.length > 4 && norm(x.site_address).indexOf(na) >= 0) ||
             (nc && nc.length > 2 && norm(x.company_name) === nc && na && norm(x.site_address).indexOf(na.slice(0, 8)) >= 0);
    })[0];
    if (hit){
      setTimeout(function(){
        toastAction("同じ住所の案件が既にあります", "その案件を開く", function(){ navTo("/deals/" + hit.id); });
      }, 400);
    }
  }

  // 反映後、まだ空の会社名にフォーカス（必須なので）
  setTimeout(function(){
    var comp = document.querySelector('#newForm [data-field="company_name"]');
    if (comp && !comp.value){ comp.focus(); comp.scrollIntoView({ block:"center", behavior:"smooth" }); }
  }, 60);
}

  }
  function inputHtmlWith(txt){
    return '<div class="stack">'+
      '<div class="field__hint">物件詳細ページの本文を<b>そのままコピーして貼り付け</b>（体裁は気にしなくてOK・URLだけでは読めません）。'+
        (AI.sample ? 'AIが' : 'キーワードで') + '更地渡し判定と各項目を読み取ります。</div>'+
      '<textarea class="input" id="listingText" style="min-height:150px">'+esc(txt||"")+'</textarea>'+
    '</div>';
  }
  function setOk(label, disabled){
    var ok = document.querySelector('#backdrop [data-act="ok"]');
    if (ok){ ok.textContent = label; ok.disabled = !!disabled; }
  }
  function analyze(txt, body){
    STATE = "analyzing";
    body.innerHTML = '<div class="stack" style="align-items:center;text-align:center;padding:18px 0">'+
      '<div style="font-weight:700">'+(AI.sample ? "AIが読み取り中…" : "解析中…")+'</div>'+
      '<div class="muted" style="font-size:12px">'+(AI.sample ? "10〜40秒ほどかかります" : "")+'</div>'+
      (AI.sample ? '<button type="button" class="btn btn--ghost btn--sm" id="cancelAnalyze" style="margin-top:6px">中止してキーワード解析</button>' : '')+
    '</div>';
    setOk("解析中…", true);
    var kw = function(){ return judgeLand(parseLandBlock(stripLandNoise(txt))); };

      landRes = land; preRes = parseListing(txt); STATE = "result";
      body.innerHTML = resultHtml(land, preRes);

    }
    if (AI.sample){
      ctl = new AbortController();
      var ca = body.querySelector("#cancelAnalyze");
      if (ca) ca.onclick = function(){ if (ctl) ctl.abort(); finish(kw()); };
      AI.sample.json(landAiPrompt(txt, true), { modelTier:"default", cache:false, signal:ctl.signal })
        .then(function(arr){ if (STATE !== "analyzing") return; var l = normalizeAiLand(arr, "other")[0]; finish(l || kw()); })
        .catch(function(e){ if (STATE !== "analyzing") return; if (e && e.code === "cancelled") return; finish(kw()); });
    } else {
      finish(kw());
    }
  }
  openDialog({
    title:"物件ページから取り込む",
    confirmLabel:"解析する",
    body: inputHtml,
    onConfirm:function(body){
      if (STATE === "input"){
        if (requireField(body.querySelector("#listingText"), "物件ページの本文を貼り付けてください")) return true;

        applyListingResult(landRes, preRes);
        toast("フォームに反映しました");
        return false; // 閉じる
      }
      return true;
    }
  });
}

/* ---- 連絡ログ（活動履歴） ---------------------------------------------- */
function lastContactDays(deal){
  var dates = [deal.created_on];
  DB.events(deal.id).forEach(function(e){ dates.push(e.changed_on); });
  DB.logs(deal.id).forEach(function(l){ dates.push(l.on); });
  dates = dates.filter(Boolean).sort();
  var latest = dates[dates.length - 1];
  return latest ? daysBetween(latest, isoToday()) : null;
}
/* ---- 書類・写真の添付（案件ごと） --------------------------------- */
function fileIcon(type){
  if (/^image\//.test(type || "")) return "🖼";
  if (/pdf/i.test(type || "")) return "📄";
  return "📎";
}
function fmtBytes(n){
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return Math.round(n / 1024) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
