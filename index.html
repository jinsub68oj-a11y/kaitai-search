    if (st.goal_won && st.goal_won > 0) html += goalRow("成約件数", mk.won, st.goal_won, function(x){ return x + " 件"; });
    if (st.goal_profit && st.goal_profit > 0) html += goalRow("確定利益", mk.confProfit || 0, st.goal_profit, function(x){ return yenMan(x); });
    html += '</div>';
  }

  // Today priority + follow snapshot
  html += '<div class="grid" style="grid-template-columns:1fr;margin-bottom:16px">';
  html += '<div class="card"><div class="card__head"><div><div class="card__title">今日 優先して対応する案件</div>'+
    '<div class="card__hint" style="margin-top:2px">右の金額は見込利益</div></div>'+
    '<button type="button" class="card__link" data-goto-view="/deals">案件一覧 '+icon("arrow-right")+'</button></div>';
  if (!top.length){
    html += '<div class="empty" style="padding:20px">'+icon("check")+'<p style="margin:8px 0 0">対応中の案件はありません</p></div>';
  } else {
    html += '<div class="prio">';
    top.forEach(function(d, i){
      var pr = Calc.profit(d);
      var fu = d.next_follow_on ? (d.next_follow_on < isoToday() ? '<span class="badge pr-high badge--dot">追客期限超過</span>'
              : d.next_follow_on === isoToday() ? '<span class="badge pr-mid badge--dot">今日追客</span>' : '追客 '+fmtDate(d.next_follow_on)) : '';
      html += '<div class="prio__item" data-goto="'+d.id+'">'+
        '<div class="prio__rank">'+(i+1)+'</div>'+
        '<div class="prio__body">'+
          '<div class="prio__co">'+esc(d.company_name||"（無名）")+'</div>'+
          '<div class="prio__sub">'+statusBadge(d.status)+' '+probBadge(d.probability)+' '+fu+'</div>'+
        '</div>'+
        '<div class="prio__amt" title="'+yen(pr.profit)+'">'+yenMan(pr.profit)+'</div>'+
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // 今日 連絡する（期限超過＋今日の追客）
  var todayFollow = fb.overdue.concat(fb.today);
  html += '<div class="card" style="margin-bottom:16px"><div class="card__head">'+
    '<div class="card__title">今日 連絡する（'+todayFollow.length+'）</div>'+
    '<button type="button" class="card__link" data-goto-view="/follow-ups">追客管理へ '+icon("arrow-right")+'</button></div>';
  if (!todayFollow.length){
    html += '<div class="muted" style="font-size:13px">期限が来ている追客はありません。今後の追客 '+fb.upcoming.length+' 件。</div>';
  } else {
    html += '<div class="prio">'+
      todayFollow.slice(0,6).map(function(d){
        var od = d.next_follow_on < isoToday() ? daysBetween(d.next_follow_on, isoToday()) : 0;
        var tel = (d.phone||"").replace(/[^\d+]/g, "");
        return '<div class="prio__item" data-goto="'+d.id+'">'+
          '<div class="prio__body">'+
            '<div class="prio__co">'+esc(d.company_name||"（無名）")+' '+(od>0?'<span class="badge pr-high">'+od+'日超過</span>':'<span class="badge pr-mid">今日</span>')+'</div>'+
            '<div class="prio__sub">'+statusBadge(d.status)+' '+esc(d.next_action||"アクション未設定")+'</div>'+
          '</div>'+
          '<div class="row" style="gap:6px;flex:0 0 auto">'+
            (tel ? '<a class="chipbtn" style="min-height:34px;font-size:12px;padding:0 11px" href="tel:'+esc(tel)+'">'+icon("phone")+'電話</a>' : '')+
            '<button type="button" class="btn btn--soft btn--sm" data-done="'+d.id+'">対応</button>'+
          '</div>'+
        '</div>';
      }).join("")+
      (todayFollow.length>6 ? '<div class="muted" style="font-size:12px;padding-top:6px">ほか '+(todayFollow.length-6)+' 件</div>' : '')+
    '</div>';
  }
  html += '</div>';

  html += '<div class="stats" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-bottom:16px">'+
    '<div class="stat"><div class="stat__label">今後の追客</div><div class="stat__value tnum">'+fb.upcoming.length+'</div></div>'+
    '<div class="stat"><div class="stat__label">平均受注期間</div><div class="stat__value tnum">'+(avg===null?"—":avg)+'<small> 日</small></div></div>'+
  '</div>';

  // Funnel（スマホでは折りたたみ）
  var funBody = '<div class="funnel">'+
    funnel.map(function(s, i){
      return (i>0 ? '<div class="funnel__conv">'+esc(s.convLabel)+' <b>'+(s.conv===null?"—":pct(s.conv*100))+'</b></div>' : '')+
        '<div class="funnel__row">'+
          '<div class="funnel__name">'+esc(s.name)+'</div>'+
          '<div class="funnel__track"><div class="funnel__bar" style="width:'+Math.max(s.width,7)+'%"><span class="funnel__count tnum">'+s.count+'</span></div></div>'+
        '</div>';
    }).join("")+
  '</div>';
  html += '<div class="card funnel-card"><button type="button" class="card__head funnel-toggle" id="funnelToggle" aria-expanded="true">'+
      '<div class="card__title">商談の流れ（'+esc(scopeLabel)+'）</div>'+
      '<span class="card__hint">各段階の転換率 '+icon("chevron","chev")+'</span></button>'+
    '<div class="funnel-body" id="funnelBody">'+funBody+'</div>'+
  '</div>';

  // 予算 ＞ 事前見積 の案件（利益が乗りやすい）
  var favorable = DB.deals().filter(Calc.isActive).map(function(d){
    return { d:d, bv:Calc.budgetVsEstimate(d) };
  }).filter(function(x){ return x.bv.status === "favorable"; })
    .sort(function(a,b){ return b.bv.diff - a.bv.diff; });
  html += '<div class="card" style="margin-top:16px"><div class="card__head">'+
    '<div class="card__title">予算 ＞ 事前見積 の案件（利益が乗りやすい）</div>'+
    '<span class="card__hint">'+favorable.length+' 件</span></div>';
  if (!favorable.length){
    html += '<div class="muted" style="font-size:13px">案件詳細の「事前見積・客先予算」を入れると、ここに有望案件が並びます。</div>';
  } else {
    html += '<div class="prio">';
    favorable.slice(0,5).forEach(function(x){
      html += '<div class="prio__item" data-goto="'+x.d.id+'">'+
        '<div class="prio__rank" style="background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success)">◎</div>'+
        '<div class="prio__body"><div class="prio__co">'+esc(x.d.company_name||"（無名）")+'</div>'+
          '<div class="prio__sub">'+statusBadge(x.d.status)+' 予算 '+yenMan(x.bv.budget)+' / 見積 '+yenMan(x.bv.mid)+'</div></div>'+
        '<div class="prio__amt" style="color:var(--success)" title="'+yen(x.bv.diff)+'">+'+yenMan(x.bv.diff)+'<div class="prio__sub" style="text-align:right">差額</div></div>'+
      '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  return {
    title:"ダッシュボード",
    html:html,
    mount:function(root){
      root.querySelectorAll('[data-act="new"]').forEach(function(b){ b.onclick = function(){ navTo("/deals/new"); }; });
      root.querySelectorAll("[data-scope]").forEach(function(b){
        b.onclick = function(){ dashScope = b.getAttribute("data-scope"); render(); };
      });
      root.querySelectorAll("[data-goto]").forEach(function(el){
        el.onclick = function(e){ if (e.target.closest("button, a")) return; navTo("/deals/" + el.getAttribute("data-goto")); };
      });
      root.querySelectorAll("[data-done]").forEach(function(b){
        b.onclick = function(){ openFollowDoneDialog(b.getAttribute("data-done")); };
      });
      root.querySelectorAll("[data-goto-view]").forEach(function(el){
        el.onclick = function(){ navTo(el.getAttribute("data-goto-view")); };
      });
      var ftog = root.querySelector("#funnelToggle");
      if (ftog){
        var fcard = ftog.closest(".funnel-card");
        if (window.matchMedia("(max-width:900px)").matches) fcard.classList.add("is-collapsed");
        ftog.onclick = function(){
          if (!window.matchMedia("(max-width:900px)").matches) return;
          var c = fcard.classList.toggle("is-collapsed");
          ftog.setAttribute("aria-expanded", c ? "false" : "true");
        };
      }
    }
  };
}

/* ============================================================
   VIEW: Deal list
   ============================================================ */
var dealFilters = { q:"", status:"", prob:"", source:"", from:"", to:"" };
var dealSort = "created_desc";
var DEAL_SORTS = [
  { k:"created_desc",  label:"登録が新しい順" },
  { k:"follow_asc",    label:"次回追客が近い順" },
  { k:"stale_desc",    label:"放置が長い順" },
  { k:"amount_desc",   label:"提示金額が高い順" },
  { k:"profit_desc",   label:"見込利益が高い順" }
];

function ViewDeals(){
  var deals = DB.deals().slice();

  function pass(d){
    var f = dealFilters;
    if (f.q){
      var q = f.q.toLowerCase().trim();
      var qDigits = q.replace(/\D/g, "");
      var hit = (d.company_name||"").toLowerCase().indexOf(q) >= 0
        || (d.contact_name||"").toLowerCase().indexOf(q) >= 0
        || (d.site_address||"").toLowerCase().indexOf(q) >= 0
        || (qDigits.length >= 3 && (d.phone||"").replace(/\D/g,"").indexOf(qDigits) >= 0)
        || (d.code||"").toLowerCase().indexOf(q) >= 0;
      if (!hit) return false;
    }
    if (f.status && d.status !== f.status) return false;
    if (f.prob && d.probability !== f.prob) return false;
    if (f.source && d.source !== f.source) return false;
    if (f.from && d.created_on < f.from) return false;
    if (f.to && d.created_on > f.to) return false;
    return true;
  }
  var filtered = deals.filter(pass);
  var sortFns = {
    created_desc: function(a,b){ return (b.created_on||"") < (a.created_on||"") ? -1 : (b.created_on||"") > (a.created_on||"") ? 1 : 0; },
    follow_asc: function(a,b){ var av=a.next_follow_on||"9999-99-99", bv=b.next_follow_on||"9999-99-99"; return av<bv?-1:av>bv?1:0; },
    stale_desc: function(a,b){
      var aa = Calc.isActive(a), ab = Calc.isActive(b);
      if (aa !== ab) return aa ? -1 : 1;              // 進行中を先に
      return (lastContactDays(b)||-1) - (lastContactDays(a)||-1);
    },
    amount_desc: function(a,b){ return (num(b.amount_presented)||-1) - (num(a.amount_presented)||-1); },
    profit_desc: function(a,b){ return (Calc.profit(b).profit==null?-1e15:Calc.profit(b).profit) - (Calc.profit(a).profit==null?-1e15:Calc.profit(a).profit); }
  };
  filtered.sort(sortFns[dealSort] || sortFns.created_desc);

  var html =
    '<div class="page-head only-desktop"><div><h1>案件一覧</h1><p>'+filtered.length+' / '+deals.length+' 件</p></div></div>';

  var activeFilterCount = ["status","prob","source","from","to"].filter(function(kk){ return dealFilters[kk]; }).length;
  html += '<div class="filterbar">'+
    '<div class="search">'+icon("search")+'<input class="input" id="fq" placeholder="会社名・担当・電話・住所で検索" value="'+esc(dealFilters.q)+'"></div>'+
    '<select class="select" id="fsort" style="max-width:170px">'+
      DEAL_SORTS.map(function(o){ return '<option value="'+o.k+'"'+(dealSort===o.k?" selected":"")+'>'+esc(o.label)+'</option>'; }).join("")+
    '</select>'+
    '<button class="btn btn--soft btn--sm only-mobile" id="filterToggle">絞り込み'+(activeFilterCount?' <span class="badge" style="--c:var(--primary)">'+activeFilterCount+'</span>':'')+'</button>'+
    '<div class="filter-more'+(activeFilterCount?' is-open':'')+'" id="filterMore">'+
      '<select class="select" id="fstatus" style="max-width:150px"><option value="">ステータス：全て</option>'+
        ALL_STATUSES.map(function(s){ return '<option value="'+s.key+'"'+(dealFilters.status===s.key?" selected":"")+'>'+s.label+'</option>'; }).join("")+
      '</select>'+
      '<select class="select" id="fprob" style="max-width:130px"><option value="">見込み度：全て</option>'+
        PROBABILITIES.map(function(p){ return '<option value="'+p.k+'"'+(dealFilters.prob===p.k?" selected":"")+'>'+p.k+'</option>'; }).join("")+
      '</select>'+
      '<select class="select" id="fsource" style="max-width:160px"><option value="">経路：全て</option>'+
        SOURCES.map(function(s){ return '<option'+(dealFilters.source===s?" selected":"")+'>'+esc(s)+'</option>'; }).join("")+
      '</select>'+
      dateField(null,"ffrom",dealFilters.from,{bare:true,id:"ffrom",placeholder:"登録日From"})+
      dateField(null,"fto",dealFilters.to,{bare:true,id:"fto",placeholder:"登録日To"})+
      '<button class="btn btn--ghost btn--sm" id="fclear">クリア</button>'+
    '</div>'+
  '</div>';

  if (!filtered.length){
    html += '<div class="card"><div class="empty">'+icon("inbox")+'<h3>該当する案件がありません</h3>'+
      '<p>条件を変えるか、下の「登録」から案件を追加してください。</p></div></div>';
  } else {
    // desktop table
    html += '<div class="table-wrap only-desktop"><table class="table"><thead><tr>'+
      '<th>会社名 / 担当</th><th>ステータス</th><th>見込み</th><th class="num">提示金額</th>'+
      '<th class="num">見込利益</th><th>次回追客</th><th>優先</th></tr></thead><tbody>';
    var telChip = function(d){
      var tel = (d.phone||"").replace(/[^\d+]/g,"");
      return tel ? '<a class="chipbtn" style="min-height:30px;font-size:12px;padding:0 10px;margin-top:6px" href="tel:'+esc(tel)+'">'+icon("phone")+'発信</a>' : '';
    };
    var filesChip = function(d){
      var n = (d.files || []).length;
      return n ? '<button type="button" class="chipbtn" data-files="'+d.id+'" style="min-height:30px;font-size:12px;padding:0 11px;margin-top:6px;cursor:pointer">'+icon("inbox")+'書類 '+n+'</button>' : '';
    };
    filtered.forEach(function(d){
      var pr = Calc.profit(d);
      var overdue = d.next_follow_on && d.next_follow_on < isoToday() && Calc.isActive(d);
      var stale = Calc.isActive(d) ? lastContactDays(d) : null;
      var staleB = (stale !== null && stale >= 10) ? ' <span class="badge '+(stale>=21?'pr-high':'pr-mid')+'" title="最終接触からの日数">放置'+stale+'日</span>' : '';
      html += '<tr class="clickable" data-goto="'+d.id+'">'+
        '<td><div style="font-weight:800">'+esc(d.company_name||"（無名）")+'</div>'+
          '<div class="muted" style="font-size:12px">'+esc(d.contact_name||"")+' ・ 登録 '+fmtDate(d.created_on)+'</div>'+
          '<div class="row" style="gap:6px">'+telChip(d)+filesChip(d)+'</div></td>'+
        '<td>'+statusBadge(d.status)+staleB+'</td>'+
        '<td>'+probBadge(d.probability)+'</td>'+
        '<td class="num" title="'+yen(d.amount_presented)+'">'+yenMan(d.amount_presented)+'</td>'+
        '<td class="num" title="'+yen(pr.profit)+'">'+yenMan(pr.profit)+'</td>'+
        '<td style="white-space:nowrap'+(overdue?';color:var(--danger);font-weight:800':'')+'">'+(d.next_follow_on?fmtDate(d.next_follow_on):"—")+'</td>'+
        '<td>'+(prioBadge(Calc.priorityBucket(d))||"—")+'</td>'+
      '</tr>';
    });
    html += '</tbody></table></div>';

    // mobile cards
    html += '<div class="stack only-mobile">';
    filtered.forEach(function(d){
      var pr = Calc.profit(d);
      var overdue = d.next_follow_on && d.next_follow_on < isoToday() && Calc.isActive(d);
      var stale = Calc.isActive(d) ? lastContactDays(d) : null;
      var staleB = (stale !== null && stale >= 10) ? '<span class="badge '+(stale>=21?'pr-high':'pr-mid')+'">放置'+stale+'日</span>' : '';
      html += '<div class="deal-card" data-goto="'+d.id+'">'+
        '<div class="deal-card__top">'+
          '<div><div class="deal-card__co">'+esc(d.company_name||"（無名）")+'</div>'+
          '<div class="deal-card__meta">'+esc(d.contact_name||"担当者未設定")+' ・ '+esc(sourceLabel(d)||"経路未設定")+'</div>'+
          '<div class="deal-card__meta">登録 '+fmtDate(d.created_on)+'</div></div>'+
          probBadge(d.probability)+
        '</div>'+
        '<div class="deal-card__row" style="flex-wrap:wrap;gap:6px">'+statusBadge(d.status)+(prioBadge(Calc.priorityBucket(d))||"")+staleB+'</div>'+
        '<div class="deal-card__row"><span class="muted">提示 '+yenMan(d.amount_presented)+'</span>'+
          '<span class="deal-card__amt">見込利益 '+yenMan(pr.profit)+'</span></div>'+
        '<div class="deal-card__row"><span class="muted">次回追客</span>'+
          '<span style="white-space:nowrap'+(overdue?';color:var(--danger);font-weight:800':'')+'">'+(d.next_follow_on?fmtDate(d.next_follow_on):"—")+'</span></div>'+
        ((telChip(d) || filesChip(d)) ? '<div class="row" style="margin-top:8px;gap:6px">'+telChip(d)+filesChip(d)+'</div>' : '')+
      '</div>';
    });
    html += '</div>';
  }

  return {
    title:"案件一覧",
    html:html,
    mount:function(root){
      root.querySelectorAll("[data-goto]").forEach(function(el){
        el.onclick = function(e){
          if (e.target.closest && e.target.closest("a,button")) return; // 発信ボタン等は行遷移させない
          navTo("/deals/" + el.getAttribute("data-goto"));
        };
      });
      root.querySelectorAll("[data-files]").forEach(function(b){
        b.onclick = function(e){ e.stopPropagation(); openDealFilesDialog(b.getAttribute("data-files")); };
      });
      function bind(id, key, ev){
        var el = root.querySelector("#"+id); if (!el) return;
        el.addEventListener(ev || "change", function(){ dealFilters[key] = el.value; render(); });
      }
      var fq = root.querySelector("#fq");
      if (fq){
        var deb = debounce(function(){ dealFilters.q = fq.value; var pos=fq.selectionStart; render();
          var nf=document.querySelector("#fq"); if(nf){ nf.focus(); try{nf.setSelectionRange(pos,pos);}catch(e){} } }, 220);
        fq.addEventListener("input", deb);
      }
      bind("fstatus","status"); bind("fprob","prob"); bind("fsource","source");
      bind("ffrom","from"); bind("fto","to");
      wireDateFields(root);
      var ft = root.querySelector("#filterToggle");
      if (ft) ft.onclick = function(){ root.querySelector("#filterMore").classList.toggle("is-open"); };
      var fsort = root.querySelector("#fsort");
      if (fsort) fsort.addEventListener("change", function(){ dealSort = fsort.value; render(); });
      var fc = root.querySelector("#fclear");
      if (fc) fc.onclick = function(){ dealFilters = { q:"", status:"", prob:"", source:"", from:"", to:"" }; render(); };
    }
  };
}

function readSurveyFrom(root){
  function v(f){ var el=root.querySelector('[data-field="'+f+'"]'); return el?el.value:""; }
  function c(f){ var el=root.querySelector('[data-check="'+f+'"]'); return el?el.checked:false; }
  var anyText = ["sv_structure","sv_floor_area_m2","sv_tsubo","sv_floors","sv_building_age","sv_road_width_m","sv_access_route","sv_neighbor_distance","sv_asbestos","sv_survey_note"]
    .some(function(f){ return v(f); });
  var anyCheck = ["sv_heavy_machine_ok","sv_has_residue","sv_has_block_wall","sv_has_garden_tree","sv_has_shed","sv_has_carport",
    "sv_has_septic","sv_has_well","sv_underground_risk"]
    .some(function(f){ return c(f); });
  if (!anyText && !anyCheck) return null;
  return {

    has_septic:c("sv_has_septic"), has_well:c("sv_has_well"), underground_risk:c("sv_underground_risk"),

/* ---- 物件情報テキストの解析（コピペ → 数値抽出） --------------------- */
function z2h(s){
  return String(s).replace(/[！-～]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
                  .replace(/　/g, " ");
}
function winAfter(text, kw, len){
  var i = text.indexOf(kw);
  return i < 0 ? "" : text.slice(i, i + kw.length + (len || 50));
}
function areaToTsubo(win){
  if (!win) return null;
  var w = win.replace(/,/g, "");
  var tm = w.match(/(\d+(?:\.\d+)?)\s*坪/);
  if (tm) return parseFloat(tm[1]);
  var mm = w.match(/(\d+(?:\.\d+)?)\s*(?:m2|㎡|m²|平米|平方(?:メートル|m)?)/i);
  if (mm) return parseFloat(mm[1]) / 3.30578;
  return null;
}
function parseListing(text){
  var t = z2h(text || "");
  var f = {};
  var found = [];
  function rec(label, disp){ found.push({ label:label, disp:disp }); }

  // 土地面積
  var landWin = "";
  ["土地面積","敷地面積","土地権利","地積","土地"].some(function(k){ var w = winAfter(t,k,60); if (w){ landWin = w; return true; } });
  var lt = areaToTsubo(landWin);
  if (lt){ lt = Math.round(lt*10)/10; f.land_tsubo = lt; rec("土地坪数", lt + "坪"); }

  // 建物面積 → 実延床(known_floor)
  var bWin = "";
  ["建物面積","延床面積","延べ床面積","建物延床","専有面積","床面積"].some(function(k){ var w = winAfter(t,k,60); if (w){ bWin = w; return true; } });
  var bt = areaToTsubo(bWin);
  if (bt){ bt = Math.round(bt*10)/10; f.known_floor = bt; rec("実延床(建物面積)", bt + "坪"); }

  // 構造（SRC を RC より先に判定）
  var st = null;
  if (/鉄骨鉄筋|ＳＲＣ|SRC/i.test(t)) st = "SRC造";
  else if (/鉄筋コンクリート|ＲＣ|RC造|RC/i.test(t)) st = "RC造";
  else if (/軽量鉄骨|重量鉄骨|鉄骨造|Ｓ造|鉄骨/.test(t)) st = "鉄骨造";
  else if (/木造|Ｗ造|在来|ツーバイフォー|2×4|２×４/.test(t)) st = "木造";
  if (st){ f.structure = st; rec("構造", st); }

  // 階数
  var fl = null;
  if (/平屋|平家/.test(t)) fl = 1;
  var fm = t.match(/(?:地上)?\s*(\d+)\s*階建/) || t.match(/(\d+)\s*階建て/) || t.match(/(\d+)\s*階\s*建/);
  if (fm) fl = parseInt(fm[1], 10);
  if (fl){ f.floors = fl; rec("階数", fl + "階"); }

  // 建ぺい率 / 容積率
  var cm = (winAfter(t,"建ぺい率",18) + winAfter(t,"建蔽率",18)).match(/(\d+(?:\.\d+)?)\s*[%％]/);
  if (cm){ f.coverage = parseFloat(cm[1]); rec("建蔽率", cm[1] + "%"); }
  var vm = winAfter(t,"容積率",18).match(/(\d+(?:\.\d+)?)\s*[%％]/);
  if (vm){ f.far = parseFloat(vm[1]); rec("容積率", vm[1] + "%"); }

  // 築年（できるだけ多くの書式に対応：和暦/略号/西暦/相対/新築 など）
  var nowY = new Date().getFullYear();
  var year = null;
  // 見出し周辺（西暦だけ書いてある表組み対策）
  var yw = ["築年月","建築年月","築年","建築年","新築年月","完成年月","竣工年月","完成年","竣工年","完成","竣工","新築","入居可能","現況"]
    .map(function(k){ return winAfter(t, k, 26); }).join("  ");
  var eraFull = (yw + "  " + t).match(/(昭和|平成|令和)\s*(?:(元)|(\d{1,2}))\s*年/);
  var eraAbbr = (yw + "  " + t).match(/(?:^|[\s（(【\[／/｜|])([SHR])\s*[.．]?\s*(\d{1,2})\s*[.．年/／]/);
  var yKw     = t.match(/((?:19|20)\d{2})\s*年?(?:\s*\d{1,2}\s*月)?\s*(?:築|新築|建築|完成|竣工)/);
  var yWin    = yw.match(/((?:19|20)\d{2})/);
  var relM    = t.match(/築(?:年数|後|浅)?[\s:：]{0,3}(\d{1,2})\s*年(?!\d)/) || t.match(/(?:経過|建築後)[\s:：]{0,3}(\d{1,2})\s*年/);
  if (eraFull){
    var b1 = { "昭和":1925, "平成":1988, "令和":2018 }[eraFull[1]];
    year = b1 + (eraFull[2] ? 1 : parseInt(eraFull[3], 10));       // 「元年」対応
  } else if (eraAbbr){
    var b2 = { "S":1925, "H":1988, "R":2018 }[eraAbbr[1]];
    year = b2 + parseInt(eraAbbr[2], 10);
  } else if (yKw){
    year = parseInt(yKw[1], 10);
  } else if (yWin){
    year = parseInt(yWin[1], 10);
  } else if (relM){
    var rn = parseInt(relM[1], 10);
    if (rn > 0 && rn < 130) year = nowY - rn;
  } else if (/新築|築浅|未入居|新古|今年完成|本年完成/.test(yw + "  " + t.slice(0, 500))){
    year = nowY;
  }
  if (year && year > 1900 && year <= nowY + 1){
    f.build_year = year;
    f.building_age = Math.max(0, nowY - year);
    var band = year <= 1980 ? "old" : year <= 2000 ? "mid" : "new";
    f.age_band = band;
    rec("築年", year + "年（築" + f.building_age + "年・" + ({ old:"〜1980", mid:"1981〜2000", "new":"2001〜" }[band]) + "）");
  }

  // 所在地
  var am = t.match(/(?:所在地|物件所在地|住所)[：:\s]*([^\n\r]{4,60})/);
  if (am){ f.address = am[1].trim(); rec("所在地", f.address.slice(0, 30)); }

  return { fields:f, found:found };
}
function landLvColor(lv){ return lv === "高確度" ? "var(--success)" : lv === "候補" ? "var(--warning)" : "var(--muted)"; }

// 解析結果（land: 判定＋抽出, pre: parseListing）を新規登録フォームへ反映
function applyListingResult(land, pre){
  pre = pre || { fields:{} };
  var pf = pre.fields || {};
  land = land || {};
  function fillField(name, val, scoped){
    var sel = (scoped ? '#newForm ' : '') + '[data-field="' + name + '"]';
    var el = document.querySelector(sel);
    if (el && !el.value && val != null && val !== ""){
      el.value = val; el.dispatchEvent(new Event("input", { bubbles:true })); el.dispatchEvent(new Event("change"));
    }
  }
  function setPe(name, val){
    var el = document.querySelector('[data-pe="' + name + '"]');
    if (el && val != null && val !== "" && !el.value){ el.value = val; el.dispatchEvent(new Event("change")); }
  }
  fillField("company_name", land.agency, true);
  fillField("contact_name", land.agentName, true);
  fillField("phone", land.phone, true);
  fillField("site_address", land.address || pf.address);

  // 事前見積の各欄（AI優先、無ければ parseListing）
  var known = land.buildingM2 ? Math.round(land.buildingM2 / 3.30578 * 10) / 10 : pf.known_floor;
  setPe("land_tsubo", land.landTsubo != null ? land.landTsubo : pf.land_tsubo);
  setPe("known_floor", known);
  setPe("structure", land.structure || pf.structure);
  setPe("floors", land.floors != null ? land.floors : pf.floors);
  setPe("coverage", land.coverage != null ? land.coverage : pf.coverage);
  setPe("far", land.far != null ? land.far : pf.far);
  var nowYr = new Date().getFullYear();
  var buildYr = land.buildYear || pf.build_year || null;
  var band = pf.age_band;
  if (buildYr) band = buildYr <= 1980 ? "old" : buildYr <= 2000 ? "mid" : "new";
  if (band){
    var bb = document.querySelector('[data-peseg="age_band"] .choice[data-val="' + band + '"]');
    if (bb) bb.click();
  }
  // 現調の「築年数」も、分かれば埋める（西暦→経過年数）
  var buildAge = buildYr ? Math.max(0, nowYr - buildYr) : (pf.building_age != null ? pf.building_age : null);
  if (buildAge != null) fillField("sv_building_age", buildAge);

  // 見込み度: 高確度 は既定(C)のときだけ B に引き上げ
  if (land.level === "高確度"){
    var segNew = document.querySelector('#newForm [data-seg="probability"] .choice.is-on');
    if (segNew && segNew.getAttribute("data-val") === "C"){
      var bBtn = document.querySelector('#newForm [data-seg="probability"] .choice[data-val="B"]');
      if (bBtn) bBtn.click();
    }
  }

  // メモに読み取り内容＋判定を追記
  var memoEl = document.querySelector('[data-field="memo"]');
  if (memoEl){
    var mlines = [
      (land.name && land.name.indexOf("名称不明") < 0) ? "物件: " + land.name : "",
      land.price ? "価格: " + land.price : "",
      land.landText ? "土地: " + land.landText : "",
      land.genkyo ? "現況: " + land.genkyo : "",
      land.hikiwatashi ? "引渡: " + land.hikiwatashi : "",
      "更地渡し判定: " + (land.level || "?") + (land.reason ? "\n理由: " + land.reason : ""),
      land.url ? "元URL: " + land.url : ""
    ].filter(Boolean).join("\n");
    memoEl.value = memoEl.value ? (memoEl.value + "\n" + mlines) : mlines;
    memoEl.dispatchEvent(new Event("change"));
  }

  // 事前見積に値が入ったら、その折りたたみを開いて見せる
  var anyPe = ["land_tsubo","known_floor","structure","floors","coverage","far"].some(function(k){
    var el = document.querySelector('[data-pe="' + k + '"]'); return el && el.value;
  });
  var pd = document.querySelector("#preDisc");
  if (anyPe && pd && !pd.classList.contains("is-open")) pd.classList.add("is-open");

  // 同じ住所／会社の案件がすでにある場合は知らせる（二重登録の防止）
  var norm = function(s){ return String(s || "").replace(/[\s　\-‐-―ー－]/g, "").toLowerCase(); };
  var na = norm(land.address), nc = norm(land.agency);
  if (na || nc){
    var hit = DB.deals().filter(function(x){
      return (na && na.length > 4 && norm(x.site_address).indexOf(na) >= 0) ||
             (nc && nc.length > 2 && norm(x.company_name) === nc && na && norm(x.site_address).indexOf(na.slice(0, 8)) >= 0);
    })[0];
    if (hit){
      setTimeout(function(){
        toastAction("同じ住所の案件が既にあります", "その案件を開く", function(){ navTo("/deals/" + hit.id); });
      }, 400);
    }
  }

  // 反映後、まだ空の会社名にフォーカス（必須なので）
  setTimeout(function(){
    var comp = document.querySelector('#newForm [data-field="company_name"]');
    if (comp && !comp.value){ comp.focus(); comp.scrollIntoView({ block:"center", behavior:"smooth" }); }
  }, 60);
}

  var dueSoon = tasks.some(function(t){

    var dd = daysBetween(isoToday(), t.due);

  });
  var rows = tasks.map(function(t){
    var badge;
    if (!t.need){
      badge = '<span class="badge">対象外の可能性</span>';

    } else if (t.due){
      var dd = daysBetween(isoToday(), t.due);
      var cls = dd < 0 ? "pr-high" : dd <= 14 ? "pr-mid" : "";

        '<span class="regrow__name">'+esc(t.label)+'</span>'+badge+

    '<div class="section-label">届出と事前調査'+(dueSoon?' <span class="badge pr-mid">期限が近い手続きがあります</span>':'')+'</div>'+

/* ---- 連絡ログ（活動履歴） ---------------------------------------------- */
function lastContactDays(deal){
  var dates = [deal.created_on];
  DB.events(deal.id).forEach(function(e){ dates.push(e.changed_on); });
  DB.logs(deal.id).forEach(function(l){ dates.push(l.on); });
  dates = dates.filter(Boolean).sort();
  var latest = dates[dates.length - 1];
  return latest ? daysBetween(latest, isoToday()) : null;
}
/* ---- 書類・写真の添付（案件ごと） --------------------------------- */
function fileIcon(type){
  if (/^image\//.test(type || "")) return "🖼";
  if (/pdf/i.test(type || "")) return "📄";
  return "📎";
}
function fmtBytes(n){
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return Math.round(n / 1024) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
// 添付1件をプレビュー（画像/ PDF / その他）
function openAttachment(deal, fid){
  var m = ((deal && deal.files) || []).filter(function(f){ return f.id === fid; })[0] || {};
  FS.get(fid).then(function(blob){
    if (!blob){ toast("ファイル本体が見つかりません（この端末にないか削除済み）"); return; }
    var url = URL.createObjectURL(blob);
    var isImg = /^image\//.test(m.type || blob.type || "");
    var isPdf = /pdf/i.test(m.type || blob.type || "");
    openDialog({
      title: m.name || "ファイル", hideCancel: true, confirmLabel: "閉じる",
      body: (isImg ? '<img src="'+url+'" alt="" style="max-width:100%;border-radius:8px;display:block">'
            : isPdf ? '<iframe src="'+url+'" style="width:100%;height:58vh;border:1px solid var(--border);border-radius:8px"></iframe>'
            : '<div class="muted" style="font-size:13px">この形式はプレビューできません。下のボタンで開いてください。</div>')+
        '<div class="row" style="margin-top:10px;gap:8px">'+
          '<a href="'+url+'" download="'+esc(m.name || "file")+'" class="btn btn--soft btn--sm">ダウンロード</a>'+
          '<button type="button" class="btn btn--ghost btn--sm" id="fileNewTab">新しいタブで開く</button>'+
        '</div>',
      onMount: function(bd){
        var nt = bd.querySelector("#fileNewTab");
        if (nt) nt.onclick = function(){ try { window.open(url, "_blank"); } catch(e){} };
      },
      onConfirm: function(){ setTimeout(function(){ try { URL.revokeObjectURL(url); } catch(e){} }, 3000); }
    });
  }, function(e){ toast("開けませんでした"); logError("file-get", (e && e.message) || e); });
}

/* ============================================================
   入金・支払の予定（案件ごと）＋ 資金繰り（全体）
   ============================================================ */
function isoAddDays(iso, n){
  if (!iso) return "";
  var p = String(iso).split("-");
  if (p.length < 3) return "";
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + n);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function payItems(deal){
  var arr = (deal && deal.pay_items) ? deal.pay_items.slice() : [];
  arr.sort(function(a,b){
    var ax = a.due || "9999-99-99", bx = b.due || "9999-99-99";
    return ax < bx ? -1 : ax > bx ? 1 : 0;
  });
  return arr;
}
function payTotals(deal){
  var inSum = 0, outSum = 0;
  payItems(deal).forEach(function(it){
    var v = num(it.amount) || 0;
    if (it.dir === "out") outSum += v; else inSum += v;
  });
  return { inSum:inSum, outSum:outSum, net: inSum - outSum };
}
// 提示金額・原価・解体予定日から標準の入金/支払スケジュールを作る
function makeStdPayPlan(deal){
  var today = isoToday();
  var rev = num(deal.amount_presented);
  var cost = (num(deal.cost_construction) || 0) + (num(deal.cost_other) || 0);
  var start = deal.won_on || today;
  var demo = deal.demo_date || isoAddDays(today, 30);
  var first = rev != null ? Math.round(rev * 0.3 / 10000) * 10000 : null;
  return [
    { id:uid(), dir:"in",  label:"着手金（3割）",  amount:first,                       due:start,                 done:false, done_on:null },
    { id:uid(), dir:"in",  label:"中間金（3割）",  amount:first,                       due:demo,                  done:false, done_on:null },
    { id:uid(), dir:"in",  label:"完了金（残り）", amount:(rev != null && first != null) ? (rev - first * 2) : null, due:isoAddDays(demo, 7), done:false, done_on:null },
    { id:uid(), dir:"out", label:"協力会社への支払", amount:cost > 0 ? cost : null,      due:isoAddDays(demo, 35),  done:false, done_on:null }
  ];
}

// 全案件の未処理の予定を月ごとに集計
function cashflowBuild(monthsAhead){
  monthsAhead = monthsAhead || 8;
  var today = isoToday();
  var curMonth = today.slice(0,7);
  var byMonth = {}, overdue = [];
  DB.deals().forEach(function(d){
    (d.pay_items || []).forEach(function(it){
      if (it.done) return;
      var v = num(it.amount) || 0;
      if (!v) return;
      var rec = { dealId:d.id, company:d.company_name || "（無名）", it:it, v:v };
      var due = it.due || "";
      if (due && due < today){ overdue.push(rec); return; }
      var mk = due ? due.slice(0,7) : curMonth;
      if (mk < curMonth) mk = curMonth;
      if (!byMonth[mk]) byMonth[mk] = { inSum:0, outSum:0, items:[] };
      byMonth[mk].items.push(rec);
      if (it.dir === "out") byMonth[mk].outSum += v; else byMonth[mk].inSum += v;
    });
  });
  var list = [], y = +curMonth.slice(0,4), m = +curMonth.slice(5,7);
  for (var i=0;i<monthsAhead;i++){
    var key = y + "-" + String(m).padStart(2,"0");
    var b = byMonth[key] || { inSum:0, outSum:0, items:[] };
    list.push({ key:key, label: y + "年" + m + "月", inSum:b.inSum, outSum:b.outSum, items:b.items });
    m++; if (m > 12){ m = 1; y++; }
  }
  var later = { inSum:0, outSum:0, items:[] };
  Object.keys(byMonth).forEach(function(k){
    if (k < curMonth) return;
    if (list.some(function(x){ return x.key === k; })) return;
    later.inSum += byMonth[k].inSum; later.outSum += byMonth[k].outSum;
    later.items = later.items.concat(byMonth[k].items);
  });
  return { today:today, overdue:overdue, months:list, later:later, hasLater: later.items.length > 0 };
}
function ViewCashflow(){
  var s = DB.settings();
  var start = num(s.cash_on_hand);
  var cf = cashflowBuild(8);
  var hasAny = cf.overdue.length || cf.later.items.length || cf.months.some(function(x){ return x.items.length; });

  var odIn = 0, odOut = 0;
  cf.overdue.forEach(function(r){ if (r.it.dir === "out") odOut += r.v; else odIn += r.v; });

  var html =
    '<div class="page-head only-desktop"><div><h1>資金繰り</h1><p>案件ごとの「入金・支払の予定」から、月ごとの残高見込みを出します。</p></div></div>';

  // 今の現金
  html += '<div class="card"><div class="section-label">今の現金（起点）</div>'+
    '<div class="form-grid">'+
      moneyField("通帳・財布の残高","cash_on_hand",s.cash_on_hand,{hint:"ここを起点に先の月末残高を計算します"})+
      dateField("その残高の基準日","cash_on_hand_on",s.cash_on_hand_on || "",{hint:"だいたいでOK（今日でも可）"})+
    '</div></div>';

  if (!hasAny){
    html += '<div class="card"><div class="empty">'+icon("yen")+
      '<h3>まだ予定がありません</h3>'+
      '<p>案件を開いて「入金・支払の予定」に、着手金・中間金・完了金の入金予定と、協力会社への支払予定を入れてください。ここに月ごとの残高見込みが出ます。</p>'+
      '</div></div>';
    return { title:"資金繰り", html:html, mount: cashflowMount };
  }

  if (start == null){
    html += '<div class="cf-note">「今の現金」を入れると、下の表に月末残高の見込みが出ます。</div>';
  }

  // 遅れ（期日を過ぎた未処理）
  if (cf.overdue.length){
    html += '<div class="card" style="border-color:color-mix(in srgb,var(--danger) 32%,var(--border))">'+
      '<div class="section-label" style="color:var(--danger)">期日が過ぎた未処理（'+cf.overdue.length+'件）</div>'+
      '<div class="paylist" style="margin-top:8px">'+
      cf.overdue.map(function(r){
        var isOut = r.it.dir === "out";
        return '<button type="button" class="payrow" data-goto="'+esc(r.dealId)+'">'+
          '<span class="payrow__tag '+(isOut?"is-out":"is-in")+'">'+(isOut?"支払":"入金")+'</span>'+
          '<span class="payrow__body"><span class="payrow__label">'+esc(r.company)+' / '+esc(r.it.label||"")+'</span>'+
          '<span class="payrow__due">'+(r.it.due?fmtDateFull(r.it.due):"日付未定")+'</span></span>'+
          '<span class="payrow__amt'+(isOut?" is-out":"")+'">'+(isOut?"−":"+")+yen(r.v)+'</span></button>';
      }).join("")+
      '</div>'+
      '<div class="cf-note" style="margin-top:8px">これらは下の「今月」に含めて計算しています。済んだものは案件側でチェックしてください。</div>'+
    '</div>';
  }

  // 月別テーブル
  var running = (start != null ? start : 0) + (odIn - odOut);
  var rowsHtml = "";
  cf.months.forEach(function(mo, i){
    var net = mo.inSum - mo.outSum;
    if (i === 0) running = (start != null ? start : 0) + (odIn - odOut) + net;
    else running = running + net;
    var neg = start != null && running < 0;
    rowsHtml += '<tr'+(neg?' class="cfrow--neg"':'')+'>'+
      '<td style="font-weight:700">'+esc(mo.label)+(i===0?'（今月）':'')+'</td>'+
      '<td class="num" style="color:var(--success)">'+(mo.inSum?'+'+yen(mo.inSum):'—')+'</td>'+
      '<td class="num" style="color:var(--danger)">'+(mo.outSum?'−'+yen(mo.outSum):'—')+'</td>'+
      '<td class="num" style="font-weight:700">'+(net?yen(net):'—')+'</td>'+
      '<td class="num" style="font-weight:800">'+(start!=null?yen(running):'—')+(neg?' ⚠':'')+'</td>'+
    '</tr>';
  });
  html += '<div class="card"><div class="card__head"><div class="card__title">月ごとの見込み（8ヶ月）</div></div>'+
    '<div class="table-wrap"><table class="table" style="min-width:520px"><thead><tr>'+
      '<th>月</th><th class="num">入金予定</th><th class="num">支払予定</th><th class="num">差引</th><th class="num">月末残高</th>'+
    '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'+
    (cf.hasLater ? '<div class="cf-note" style="margin-top:8px">9ヶ月目以降にも予定あり：入 '+yen(cf.later.inSum)+' ／ 出 '+yen(cf.later.outSum)+'</div>' : '')+
  '</div>';

  // 明細（月ごと・タップで案件へ）
  html += '<div class="card"><div class="section-label">予定の明細</div>';
  cf.months.forEach(function(mo){
    if (!mo.items.length) return;
    html += '<div style="margin-top:10px;font-weight:700;font-size:12.5px;color:var(--muted)">'+esc(mo.label)+'</div><div class="paylist" style="margin-top:6px">'+
      mo.items.map(function(r){
        var isOut = r.it.dir === "out";
        return '<button type="button" class="payrow" data-goto="'+esc(r.dealId)+'">'+
          '<span class="payrow__tag '+(isOut?"is-out":"is-in")+'">'+(isOut?"支払":"入金")+'</span>'+
          '<span class="payrow__body"><span class="payrow__label">'+esc(r.company)+' / '+esc(r.it.label||"")+'</span>'+
          '<span class="payrow__due">'+(r.it.due?fmtDateFull(r.it.due):"日付未定")+'</span></span>'+
          '<span class="payrow__amt'+(isOut?" is-out":"")+'">'+(isOut?"−":"+")+yen(r.v)+'</span></button>';
      }).join("")+
    '</div>';
  });
  html += '</div>';

  return { title:"資金繰り", html:html, mount: cashflowMount };
}

function wireFilesCard(root, id){
  var fdisc = root.querySelector("#filesDisc");
  if (!fdisc) return;
  var ftog = root.querySelector("#filesToggle");
  if (ftog) ftog.onclick = function(){ fdisc.classList.toggle("is-open"); };

  var fin = root.querySelector("#fileInput");
  if (fin) fin.onchange = function(){
    var files = Array.prototype.slice.call(fin.files || []);
    fin.value = "";
    if (!files.length) return;
    var d = DB.deal(id); if (!d) return;
    var meta = (d.files || []).slice();
    var added = 0, skipped = 0;
    var chain = Promise.resolve();
    files.forEach(function(file){
      chain = chain.then(function(){
        if (file.size > 10485760){ skipped++; return; }
        var fid = uid();
        return FS.put(fid, file).then(function(){
          meta.push({ id:fid, name:file.name, type:file.type || "", size:file.size, addedOn:isoToday() });
          added++;
        }, function(e){ skipped++; logError("file-put", (e && e.message) || e); });
      });
    });
    chain.then(function(){
      DB.updateDeal(id, { files: meta });
      toast(added + "件を添付しました" + (skipped ? "（" + skipped + "件は10MB超過/失敗）" : ""));
      render();
      var fd = document.getElementById("filesDisc"); if (fd) fd.classList.add("is-open");
    });
  };

  root.querySelectorAll("[data-file-open]").forEach(function(b){
    b.onclick = function(){ openAttachment(DB.deal(id), b.getAttribute("data-file-open")); };
  });

  root.querySelectorAll("[data-file-del]").forEach(function(b){
    b.onclick = function(){
      var fid = b.getAttribute("data-file-del");
      var d = DB.deal(id);
      var m = (d.files || []).filter(function(f){ return f.id === fid; })[0] || {};
      confirmDialog("この添付を削除しますか？", (m.name || "ファイル") + " を削除します。", "削除する", function(){
        FS.del(fid);
        DB.updateDeal(id, { files: (d.files || []).filter(function(f){ return f.id !== fid; }) });
        toast("削除しました"); render();
        var fd = document.getElementById("filesDisc"); if (fd) fd.classList.add("is-open");
      }, true);
    };
  });
}

  });
  DB.events(deal.id).forEach(function(e){
    items.push({ on:e.changed_on, at:e.created_at||e.changed_on, txt:"→ " + statusMeta(e.status).label + " に変更", isLog:false, id:e.id, status:e.status });
  });
  items.sort(function(a,b){ return (a.at < b.at ? 1 : a.at > b.at ? -1 : 0); });
  var d = lastContactDays(deal);
  var staleTag = (d !== null && Calc.isActive(deal) && d >= 7)
    ? '<span class="badge '+(d>=14?'pr-high':'pr-mid')+'">'+d+'日 連絡なし</span>' : '';
  var html = '<div class="card"><div class="card__head"><div class="card__title">連絡ログ</div>'+staleTag+'</div>'+
    (Calc.isActive(deal) ? '<div class="segmented" style="margin-bottom:10px">'+
      LOG_KINDS.map(function(o){
        return '<button type="button" class="choice" data-log="'+o.k+'">'+o.icon+' '+esc(o.label)+'</button>';
      }).join("")+
    '</div>' : '');
  if (!items.length){
    html += '<div class="muted" style="font-size:13px">まだ記録がありません。上のボタンで「架電した」等を記録できます。</div>';
  } else {
    html += '<div class="loglist">'+
      items.slice(0, 12).map(function(it){
        return '<div class="loglist__row">'+
          '<span class="loglist__date tnum">'+fmtDate(it.on)+'</span>'+
          '<span class="loglist__txt'+(it.isLog?"":" muted")+'">'+esc(it.txt)+'</span>'+
          '<button type="button" class="loglist__edit" data-log-edit="'+esc(it.id||"")+'" data-ev="'+(it.isLog?"0":"1")+'" aria-label="この行を修正">修正</button>'+
        '</div>';
      }).join("")+
      (items.length > 12 ? '<div class="muted" style="font-size:12px;padding-top:6px">ほか '+(items.length-12)+' 件</div>' : '')+
    '</div>';
  }
  return html + '</div>';
}
function wireContactLog(root, id){

        openDialog({
          title:"メモを記録", confirmLabel:"記録",
          body:fieldTextarea("内容","lognote","",{placeholder:"例：担当者不在、折り返し待ち"}),
          onConfirm:function(body){

            if (!t){ toast("内容を入力してください"); return true; }
            DB.addLog(id, "note", t); toast("記録しました"); render();
          }
        });
        return;
      }
      DB.addLog(id, kind, "");
      toast(logKindLabel(kind) + " を記録しました");
      render();
    };
  });

function openLogEditDialog(dealId, logId){
  var entry = DB.logs(dealId).filter(function(l){ return l.id === logId; })[0];

  openDialog({
    title:"連絡ログを修正", confirmLabel:"保存",
    body:'<div class="stack">'+
      '<div><span class="field__label">種類</span>'+
        '<div class="segmented" data-seg="logkind" style="margin-top:8px">'+
          LOG_KINDS.map(function(o){
            return '<button type="button" class="choice'+(o.k===entry.kind?" is-on":"")+'" data-val="'+o.k+'">'+o.icon+' '+esc(o.label)+'</button>';
          }).join("")+
        '</div></div>'+
      dateField("日付","logon",entry.on)+
      fieldTextarea("ひとこと（任意）","logtext",entry.text||"",{placeholder:"例：担当者不在、折り返し待ち"})+
      '<button type="button" class="btn btn--ghost btn--sm" data-act="dellog" style="color:var(--danger);align-self:flex-start">'+icon("x")+'この記録を削除</button>'+

      wireDateFields(body);

      body.querySelectorAll('[data-seg="logkind"] .choice').forEach(function(c){
        c.onclick = function(){
          body.querySelectorAll('[data-seg="logkind"] .choice').forEach(function(x){ x.classList.remove("is-on"); });
          c.classList.add("is-on"); picked = c.getAttribute("data-val");
        };
      });
      body._getKind = function(){ return picked; };
      body.querySelector('[data-act="dellog"]').onclick = function(){
        var gone = DB.deleteLog(logId);
        _closeAnyDialog(); render();
        toastAction("削除しました", "元に戻す", function(){ DB.restoreLog(gone); toast("元に戻しました"); render(); });
      };
    },
    onConfirm:function(body){
      var kind = body._getKind ? body._getKind() : entry.kind;
      var on = (body.querySelector('[data-field="logon"]') || {}).value || entry.on;
      var text = (body.querySelector('[data-field="logtext"]').value || "").trim();
      DB.updateLog(logId, { kind:kind, on:on, text:text });
      toast("修正しました"); render();
    }
  });
}

/* 進捗の履歴（→ ◯◯ に変更）の1件を修正／取り消し */
function openEventEditDialog(dealId, eventId){
  var ev = DB.event(eventId);
  if (!ev){ toast("履歴が見つかりません"); render(); return; }
  var deal = DB.deal(dealId);
  var label = statusMeta(ev.status).label;
  var mine = DB.events(dealId).slice().sort(function(a,b){ var ka=a.created_at||a.changed_on||"", kb=b.created_at||b.changed_on||""; return ka<kb?-1:ka>kb?1:0; });
  var isLatest = mine.length > 0 && mine[mine.length-1].id === eventId;
  var willRevert = !!deal && deal.status === ev.status && isLatest && !!eventRevertTarget(ev.status);
  var backLabel = willRevert ? statusMeta(eventRevertTarget(ev.status)).label : "";
  openDialog({
    title:"進捗の履歴を修正", confirmLabel:"日付を保存",
    desc:"「"+label+" に変更」の記録です。"+(willRevert ? "いまの進捗もこの段階です。取り消すと「"+backLabel+"」に戻ります。" : "いまの進捗は変わりません。"),
    body:'<div class="stack">'+
      dateField("変更日","evon",ev.changed_on)+
      '<button type="button" class="btn btn--ghost btn--sm" data-act="delev" style="color:var(--danger);align-self:flex-start">'+icon("back")+(willRevert ? "この変更を取り消す（「"+esc(backLabel)+"」に戻す）" : "この履歴を削除")+'</button>'+
      (willRevert ? '' : '<div class="field__hint">いまの進捗（'+esc(deal ? statusMeta(deal.status).label : "")+'）はそのまま。履歴の行だけを消します。</div>')+
    '</div>',
    onMount:function(body){
      wireDateFields(body);
      body.querySelector('[data-act="delev"]').onclick = function(){
        var undo = DB.removeEvent(eventId);
        _closeAnyDialog(); render();
        toastAction(undo && undo.reverted ? "前の段階に戻しました" : "履歴を削除しました", "元に戻す", function(){
          DB.restoreEvent(undo); toast("元に戻しました"); render();
        });
      };
    },
    onConfirm:function(body){
      var on = (body.querySelector('[data-field="evon"]') || {}).value;
      if (!on){ toast("日付を入力してください"); return true; }
      DB.updateEvent(eventId, { changed_on:on });
      toast("日付を修正しました"); render();
    }
  });
}

function ViewDealDetail(id){
  var deal = DB.deal(id);
  if (!deal){
    return { title:"案件詳細", html:'<div class="card"><div class="empty">'+icon("inbox")+'<h3>案件が見つかりません</h3><button class="btn btn--primary" onclick="location.hash=\'#/deals\'">一覧へ</button></div></div>' };
  }
  var pr = Calc.profit(deal);
  var idx = pipeIndex(deal.status);
  var nextStage = (idx >= 0 && idx < PIPELINE.length - 1) ? PIPELINE[idx+1]
                 : (deal.status === "considering") ? null : null;
  var isClosed = deal.status === "won" || deal.status === "lost";

  var html = "";

  // header
  html += '<div class="page-head"><div>'+
    '<h1 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+esc(deal.company_name||"（無名）")+' '+statusBadge(deal.status,true)+'</h1>'+
    '<p>'+esc(deal.code)+' ・ 登録 '+fmtDateFull(deal.created_on)+' ・ '+esc(sourceLabel(deal)||"経路未設定")+
      (prioBadge(Calc.priorityBucket(deal))?' ・ '+prioBadge(Calc.priorityBucket(deal)):'')+'</p>'+
    '</div>'+
    '<button class="btn btn--danger-soft only-desktop" data-act="delete">'+icon("trash")+'削除</button>'+
  '</div>';

  // Status control
  html += '<div class="card" style="margin-bottom:14px"><div class="section-label">営業ステータス</div>';
  html += '<div class="row" style="align-items:center">';
  if (!isClosed){
    if (nextStage){
      html += '<button class="btn btn--primary btn--lg" data-status="'+nextStage.key+'">'+esc(nextStage.label)+'へ進める '+icon("arrow-right")+'</button>';
    }
    html += '<button class="btn btn--soft btn--lg" data-status="won">'+icon("check")+'成約</button>';
    html += '<button class="btn btn--danger-soft btn--lg" data-act="lost">失注にする</button>';
  } else {
    html += '<button class="btn btn--soft" data-act="reopen">対応中に戻す</button>';
    if (deal.status === "lost" && deal.lost_reason){
      html += '<span class="badge s-lost badge--lg">失注理由：'+esc(deal.lost_reason)+(deal.lost_reason==="その他"&&deal.lost_reason_note?"（"+esc(deal.lost_reason_note)+"）":"")+'</span>';
    }
  }
  html += '</div>';
  if (!isClosed && pipeIndex(deal.status) >= 1){
    var _prevStage = PIPELINE[pipeIndex(deal.status) - 1];
    html += '<button class="btn btn--ghost btn--sm" data-act="revert" style="margin-top:8px" title="進めるボタンを押し間違えたとき用。1つ前の段階に戻します">'+icon("back")+'1つ戻す（'+esc(_prevStage.label)+'へ）</button>';
  }
  // stepper / timeline
  html += '<div class="divider"></div><div class="timeline">';
  PIPELINE.forEach(function(st, i){
    var reached = Calc.reachedIndex(deal) >= i;
    var df = st.dateField;
    html += '<div class="tl__row '+(reached?"is-done":"")+'"><div class="tl__line"></div><div class="tl__dot"></div>'+
      '<div class="tl__main"><span class="tl__name">'+esc(st.label)+'</span>'+
      (df ? '<span class="tl__date">'+dateField(null,df,deal[df]||"",{bare:true, placeholder:"未入力"})+'</span>' : '<span class="muted" style="font-size:12px">登録時</span>')+
      '</div></div>';
  });
  if (deal.status === "won") html += '<div class="tl__row is-done"><div class="tl__dot"></div><div class="tl__main"><span class="tl__name">成約</span><span class="tl__date">'+dateField(null,"won_on",deal.won_on||"",{bare:true, placeholder:"未入力"})+'</span></div></div>';
  if (deal.status === "lost") html += '<div class="tl__row is-lost"><div class="tl__dot"></div><div class="tl__main"><span class="tl__name" style="color:var(--danger)">失注</span><span class="tl__date">'+dateField(null,"lost_on",deal.lost_on||"",{bare:true, placeholder:"未入力"})+'</span></div></div>';
  html += '</div></div>';

  // Two column layout on desktop
  html += '<div class="grid" style="grid-template-columns:1fr;gap:14px">';

  // 失注メモ（失注案件のときだけ・一番上に）
  if (deal.status === "lost"){
    html += lostMemoCardHTML(deal);
  }

  // 基本情報（まとめ表示 → 「編集」で入力欄）
  html += basicInfoCardHTML(deal);

  // 連絡ログ（活動履歴）
  html += contactLogCardHTML(deal);

  // 届出と事前調査（案件が進み始めたら表示）
  if (Calc.isActive(deal) && (deal.demo_date || deal.survey || pipeIndex(deal.status) >= 3)){
    html += regTasksCardHTML(deal);
  }
  // 相続・空き家メモ（目印が付いたら表示）
  if (deal.tag_inherited || deal.tag_vacant){
    html += proposalCardHTML(deal);
  }

  // 事前見積（社内） ＋ 客先予算比較
  var preEst = Calc.preEstimate(deal);
  var preSummary = preEst ? '<span class="muted">'+yen(preEst.mid)+(Calc.clientBudgetValue(deal)?' / 予算 '+yen(Calc.clientBudgetValue(deal)):'')+'</span>' : '';
  html += '<div class="disclosure" id="preDisc">'+
    '<button type="button" class="disclosure__btn" id="preToggle"><span>事前見積・客先予算・見込み度　'+preSummary+'　'+probBadge(deal.probability)+'</span>'+icon("chevron","chev")+'</button>'+
    '<div class="disclosure__body">'+
      '<div class="section-label">① 不動産情報から事前見積</div>'+
      preFieldsHTML(deal.pre)+
      '<div class="divider"></div>'+
      '<div class="section-label">② 客先予算を聞いて比較</div>'+
      budgetBlockHTML(deal)+
      '<div class="divider"></div>'+
      '<div class="section-label">③ 見込み度</div>'+
      '<div class="segmented" data-seg2="probability" style="margin-top:4px">'+
        PROBABILITIES.map(function(p){
          return '<button type="button" class="choice'+(deal.probability===p.k?" is-on":"")+'" data-val="'+p.k+'">'+p.k+'：'+esc(p.label)+'</button>';
        }).join("")+
      '</div>'+
      '<div class="field__hint" style="margin-top:6px">上の②で「見込み度を◯にする」を押すと目安が入ります。手で選び直してもOK。</div>'+
    '</div></div>';

  // Money panel
  html += '<div class="card"><div class="section-label">金額管理</div>'+
    '<div class="form-grid">'+
      moneyField("提示金額","amount_presented",deal.amount_presented)+
      moneyField("施工原価","cost_construction",deal.cost_construction)+
      moneyField("その他原価","cost_other",deal.cost_other,{hint:"諸経費・処分費など"})+
      '<div></div>'+
    '</div>'+
    '<div class="divider"></div>'+
    '<div class="row" style="gap:24px">'+
      '<div><div class="stat__label">見込利益（自動）</div><div class="stat__value tnum" id="mpProfit" style="color:'+(pr.profit!==null&&pr.profit<0?"var(--danger)":"var(--success)")+'">'+yen(pr.profit)+'</div></div>'+
      '<div><div class="stat__label">利益率（自動）</div><div class="stat__value tnum" id="mpRate">'+pct(pr.rate,1)+'</div></div>'+
    '</div>'+
    (DB.prices().length ? '<div class="row" style="margin-top:12px"><button class="btn btn--soft btn--sm" data-act="estimate">単価マスタから概算原価</button></div>' : '')+
  '</div>';

  // 入金・支払の予定（資金繰り）
  html += payPlanCardHTML(deal);

  // Follow-up
  html += '<div class="card"><div class="section-label">次回追客</div>'+
    '<div class="form-grid">'+
      dateField("次回追客日","next_follow_on",deal.next_follow_on)+
      fieldSelectWithOther("次回アクション","next_action",NEXT_ACTIONS,deal.next_action,"next_action_other",deal.next_action_other,{blank:"選択",otherPlaceholder:"具体的なアクションを入力（必須）"})+
    '</div>'+
    '<div class="row" style="margin-top:10px">'+
      '<button class="btn btn--soft btn--sm" data-follow="1">明日</button>'+
      '<button class="btn btn--soft btn--sm" data-follow="3">3日後</button>'+
      '<button class="btn btn--soft btn--sm" data-follow="7">1週間後</button>'+
    '</div></div>';

  // Survey
  var sv = deal.survey;
  var svSummary = sv ? ' <span class="muted">'+esc([sv.structure, (sv.tsubo?sv.tsubo+"坪":""), (sv.floors?sv.floors+"階":"")].filter(Boolean).join(" ・ "))+'</span>' : '';
  html += '<div class="disclosure" id="surveyDisc">'+
    '<button type="button" class="disclosure__btn" id="surveyToggle"><span>現調情報'+(sv?"":"を入力する")+svSummary+'</span>'+icon("chevron","chev")+'</button>'+
    '<div class="disclosure__body">'+surveyFieldsHTML(sv||{})+
      '<div class="row" style="margin-top:12px">'+
        '<button class="btn btn--primary btn--sm" data-act="saveSurvey">現調情報を保存</button>'+
        '<button class="btn btn--soft btn--sm" data-act="addlMemo">追加費用の「事前の取り決めメモ」を作る</button>'+
      '</div>'+
    '</div></div>';

  // 書類・写真
  html += filesCardHTML(deal);

  html += '<button class="btn btn--danger-soft btn--block only-mobile" data-act="delete">'+icon("trash")+'この案件を削除</button>';
  html += '</div>';

  return {
    title: deal.company_name || "案件詳細",
    html: html,
    back:function(){ navTo("/deals"); },
    appbarAction:'<button class="btn btn--sm btn--ghost" data-act="delete" aria-label="この案件を削除">'+icon("trash")+'</button>',
    mount:function(root){
      // autosave text/select/date/number fields
      var autoFields = root.querySelectorAll('.card [data-field], .timeline [data-field]');
      function saveField(el){
        var f = el.getAttribute("data-field");
        var val = (el.type === "number" || el.getAttribute("data-num")) ? num(el.value) : el.value;
        var patch = {}; patch[f] = val;
        DB.updateDeal(id, patch);
        // live recompute money panel
        var d2 = DB.deal(id); var p2 = Calc.profit(d2);
        var mp = root.querySelector("#mpProfit"), mr = root.querySelector("#mpRate");
        if (mp){
          var prevMp = mp.textContent;
          mp.textContent = yen(p2.profit);
          mp.style.color = (p2.profit!==null&&p2.profit<0)?"var(--danger)":"var(--success)";
          if (mp.textContent !== prevMp) flashValue(mp);
        }
        if (mr){
          var prevMr = mr.textContent;
          mr.textContent = pct(p2.rate,1);
          if (mr.textContent !== prevMr) flashValue(mr);
        }
        toast("保存しました");
      }
      autoFields.forEach(function(el){ el.addEventListener("change", function(){ saveField(el); }); });
      // 解体予定日・請負金額が変わったら「届出と事前調査」を再計算表示
      root.querySelectorAll('#regCard [data-field="demo_date"], #regCard [data-field="contract_incl"]').forEach(function(el){
        el.addEventListener("change", function(){ render(); });
      });
      wireSourceOther(root);
      wireDateFields(root);
      wireMoneyFields(root);

      // 事前見積・客先予算
      var preDisc = root.querySelector("#preDisc");
      if (preDisc) root.querySelector("#preToggle").onclick = function(){ preDisc.classList.toggle("is-open"); };
      wirePreEstimate(root, id);
      wireContactLog(root, id);
      wireFilesCard(root, id);
      wirePayPlanCard(root, id);

      // 基本情報: まとめ表示 ⇄ 編集
      var basicCard = root.querySelector("#basicCard");
      if (basicCard){
        var editBtn = basicCard.querySelector('[data-act="edit-basic"]');
        var doneBtn = basicCard.querySelector('[data-act="done-basic"]');
        var sumEl = basicCard.querySelector(".basic-summary");
        var edEl = basicCard.querySelector(".basic-edit");
        if (editBtn) editBtn.onclick = function(){
          sumEl.setAttribute("hidden", "");
          edEl.removeAttribute("hidden");
          editBtn.setAttribute("hidden", "");
          var first = edEl.querySelector('[data-field="company_name"]');
          if (first) first.focus();
        };
        if (doneBtn) doneBtn.onclick = function(){ render(); }; // 入力は autosave 済み。まとめ表示に戻す
        // 目印チップ（相続・空き家）: その場で保存。カード表示はまとめ表示に戻したとき反映
        basicCard.querySelectorAll('[data-tag]').forEach(function(chip){
          chip.onclick = function(){
            var key = chip.getAttribute("data-tag");
            var on = !chip.classList.contains("is-on");
            chip.classList.toggle("is-on", on);
            var patch = {}; patch[key] = on;
            DB.updateDeal(id, patch);
            toast(on ? "目印を付けました" : "目印を外しました");
          };
        });
      }

      // 届出・調査の「済」チェック
      root.querySelectorAll('[data-regtask]').forEach(function(cb){
        cb.onchange = function(){
          var d = DB.deal(id); if (!d) return;
          var rt = Object.assign({}, d.reg_tasks || {});
          rt[cb.getAttribute("data-regtask")] = cb.checked;
          DB.updateDeal(id, { reg_tasks: rt });
          render();
        };
      });

      // 相続・空き家メモ
      root.querySelectorAll('[data-prop]').forEach(function(cb){
        cb.onchange = function(){
          var d = DB.deal(id); if (!d) return;
          var p = Object.assign({}, d.proposal || {});
          p[cb.getAttribute("data-prop")] = cb.checked;
          DB.updateDeal(id, { proposal: p });
        };
      });
      root.querySelectorAll('[data-prop-field]').forEach(function(ta){
        ta.addEventListener("change", function(){
          var d = DB.deal(id); if (!d) return;
          var p = Object.assign({}, d.proposal || {});
          p[ta.getAttribute("data-prop-field")] = ta.value;
          DB.updateDeal(id, { proposal: p });
          toast("保存しました");
        });
      });

      // status advance buttons
      root.querySelectorAll("[data-status]").forEach(function(b){
        b.onclick = function(){
          var key = b.getAttribute("data-status");
          if (key === "won"){
            confirmDialog("成約にしますか？", (deal.company_name||"")+" を成約として記録します。", "成約にする", function(){
              DB.setStatus(id, "won"); toast("成約に更新しました"); render();
            });
            return;
          }
          DB.setStatus(id, key);
          toast(statusMeta(key).label + " に更新しました");
          render();
        };
      });

      // lost flow
      var lostBtn = root.querySelector('[data-act="lost"]');
      if (lostBtn) lostBtn.onclick = function(){ openLostDialog(id, false); };
      var editLost = root.querySelector('[data-act="edit-lost"]');
      if (editLost) editLost.onclick = function(){ openLostDialog(id, true); };

      var reopen = root.querySelector('[data-act="reopen"]');
      if (reopen) reopen.onclick = function(){
        DB.updateDeal(id, { status: deal.reached_before || "quote_submitted" });
        DB._addEvent(id, "considering", isoToday());
        DB.updateDeal(id, { status:"considering" });
        toast("対応中に戻しました"); render();
      };

      var revertBtn = root.querySelector('[data-act="revert"]');
      if (revertBtn) revertBtn.onclick = function(){
        var cur = statusMeta(deal.status).label;
        var i = pipeIndex(deal.status);
        var prevLabel = i >= 1 ? PIPELINE[i-1].label : "";
        confirmDialog("1つ前の段階に戻しますか？",
          "「"+cur+"」→「"+prevLabel+"」に戻します。"+cur+"の記録日は取り消されます。",
          "戻す", function(){
            DB.revertStatus(id);
            toast(prevLabel + " に戻しました");
            render();
          });
      };

      // probability segmented
      root.querySelectorAll('[data-seg2="probability"] .choice').forEach(function(b){
        b.onclick = function(){
          root.querySelectorAll('[data-seg2="probability"] .choice').forEach(function(x){ x.classList.remove("is-on"); });
          b.classList.add("is-on");
          DB.updateDeal(id, { probability:b.getAttribute("data-val") });
          toast("見込み度を更新しました");
        };
      });

      // follow quick buttons
      root.querySelectorAll("[data-follow]").forEach(function(b){
        b.onclick = function(){
          var n = Number(b.getAttribute("data-follow"));
          var d = new Date(); d.setDate(d.getDate()+n);
          var iso = isoDate(d);
          DB.updateDeal(id, { next_follow_on: iso });
          setDateField(root, "next_follow_on", iso);
          toast("次回追客日を設定しました");
        };
      });

      // survey
      var disc = root.querySelector("#surveyDisc");
      root.querySelector("#surveyToggle").onclick = function(){ disc.classList.toggle("is-open"); };
      root.querySelectorAll('[data-check]').forEach(function(cb){
        cb.onchange = function(){ cb.closest(".check").classList.toggle("is-on", cb.checked); };
      });
      var saveSv = root.querySelector('[data-act="saveSurvey"]');
      if (saveSv) saveSv.onclick = function(){
        if (requireOthers(root)) return;
        var before = DB.deal(id);
        var s = readSurveyFrom(root);
        DB.updateDeal(id, { survey:s });
        toast("現調情報を保存しました");
        // 現調が初めて入って「届出と事前調査」が新たに出る条件になったら、開いたまま再描画
        if (s && !before.survey && Calc.isActive(before) && pipeIndex(before.status) < 3){
          render();
          var sd = document.getElementById("surveyDisc"); if (sd) sd.classList.add("is-open");
        }
      };
      var addlBtn = root.querySelector('[data-act="addlMemo"]');
      if (addlBtn) addlBtn.onclick = function(){
        // 直前に現調のチェック状態を保存してからメモを作る
        var s = readSurveyFrom(root);
        DB.updateDeal(id, { survey:s });
        openAddlMemoDialog(id);
      };

      // estimate from unit master
      var est = root.querySelector('[data-act="estimate"]');
      if (est) est.onclick = function(){ openEstimateDialog(id); };

      // delete （ヘッダー右上のゴミ箱は #view の外にあるので document から拾う）
      document.querySelectorAll('[data-act="delete"]').forEach(function(b){
        b.onclick = function(){
          confirmDialog("本当に削除しますか？", (deal.company_name||"この案件")+"（"+deal.code+"）を削除します。", "削除する", function(){
            var snap = DB.deleteDeal(id);
            navTo("/deals");
            setTimeout(function(){
              toastAction("削除しました", "元に戻す", function(){ DB.restoreDeal(snap); toast("元に戻しました"); render(); });
            }, 120);
          }, true);
        };
      });
    }
  };
}

/* 追加費用の「事前の取り決めメモ」を作る（現調から） */
function openAddlMemoDialog(dealId){
  var deal = DB.deal(dealId);
  if (!deal) return;
  var sv = deal.survey || {};
  var ITEMS = [
    { k:"underground", label:"地中の障害物（古い基礎・コンクリートガラ）", on: !!sv.underground_risk },
    { k:"septic",      label:"浄化槽",                                   on: !!sv.has_septic },
    { k:"well",        label:"井戸",                                     on: !!sv.has_well },
    { k:"residue",     label:"想定より多い残置物",                       on: !!sv.has_residue },
    { k:"asbestos",    label:"図面と異なる構造・想定外のアスベスト",     on: sv.asbestos === "あり" || sv.asbestos === "不明" },
    { k:"soil",        label:"土壌の汚染・地盤の異常",                   on: false }
  ];
  function buildText(checkedKeys){
    var lines = ITEMS.filter(function(it){ return checkedKeys.indexOf(it.k) >= 0; })
      .map(function(it){ return "・" + it.label; });
    return "【追加費用についての事前確認】\n"+
      "お客様：" + (deal.company_name || "") + " 様\n"+
      (deal.site_address ? "現場：" + deal.site_address + "\n" : "")+
      "記録日：" + isoToday() + "\n\n"+
      "現地調査では確認できない下記のものは、工事中に出てきた場合、\n"+
      "いったん作業を止めて、写真と書面で状況をお伝えします。\n"+
      "金額にご同意いただいてから、続きの作業に入ります。\n\n"+
      (lines.length ? lines.join("\n") : "（項目を選んでください）")+"\n\n"+
      "※この内容は、契約前に口頭と書面でお客様と共有してください。";
  }
  openDialog({
    title:"追加費用の事前メモ", confirmLabel:"連絡ログに記録",
    body:'<div class="stack">'+
      '<div class="field__hint">工事中に出てくる可能性があり、事前に取り決めておく項目を選びます。</div>'+
      '<div class="chklist" id="addlChk">'+
        ITEMS.map(function(it){
          return '<label class="chkitem"><input type="checkbox" data-addl="'+it.k+'"'+(it.on?" checked":"")+'><span>'+esc(it.label)+'</span></label>';
        }).join("")+
      '</div>'+
      '<label class="field"><span class="field__label">この文面を記録します</span>'+
        '<textarea class="input" id="addlText" rows="9" style="min-height:170px;font-size:12.5px"></textarea></label>'+
      '<div class="row"><button type="button" class="btn btn--soft btn--sm" id="addlCopy">コピー</button></div>'+
    '</div>',
    onMount:function(body){
      function checked(){ return [].slice.call(body.querySelectorAll('[data-addl]:checked')).map(function(c){ return c.getAttribute("data-addl"); }); }
      var ta = body.querySelector("#addlText");
      function refresh(){ ta.value = buildText(checked()); }
      body.querySelectorAll('[data-addl]').forEach(function(c){ c.onchange = refresh; });
      refresh();
      body.querySelector("#addlCopy").onclick = function(){
        var ok = false;
        try { ta.select(); ok = document.execCommand("copy"); } catch(e){}
        if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); ok = true; }
        toast(ok ? "コピーしました" : "コピーできませんでした");
      };
    },
    onConfirm:function(body){
      var txt = body.querySelector("#addlText").value.trim();
      if (!txt){ toast("項目を選んでください"); return true; }
      DB.addLog(dealId, "note", txt);
      var d = DB.deal(dealId);
      var s = Object.assign({}, d.survey || {}, { addl_memo_on: isoToday() });
      DB.updateDeal(dealId, { survey: s });
      toast("連絡ログに記録しました"); render();
    }
  });
}

function openEstimateDialog(dealId){
  var deal = DB.deal(dealId);
  var prices = DB.prices();
  var addonRows = prices.filter(function(r){ return r.category !== "構造解体"; });
  var sv = deal.survey || {};
  openDialog({
    title:"概算施工原価",
    confirmLabel:"施工原価に反映",
    body:'<div class="stack">'+
      '<div class="form-grid">'+
        fieldSelectWithOther("構造","est_structure",STRUCTURES,sv.structure||"","est_structure_other","",{otherPlaceholder:"構造名を入力"})+
        fieldInput("坪数","est_tsubo",sv.tsubo||"",{type:"number",inputmode:"decimal"})+
      '</div>'+
      '<div><span class="field__label">付帯工事</span><div class="stack" style="margin-top:8px;gap:8px">'+
        (addonRows.length ? addonRows.map(function(r){
          return '<label class="check"><input type="checkbox" data-addon="'+r.id+'"> '+esc(r.name)+
            ' <span class="muted" style="margin-left:auto">'+yen(r.unit_price)+' / '+esc(r.unit)+'</span>'+
            ' <input class="input" style="width:64px;min-height:34px" type="number" value="1" data-qty="'+r.id+'"></label>';
        }).join("") : '<span class="muted">付帯工事の単価が未登録です</span>')+
      '</div></div>'+
      '<div class="card" style="background:var(--surface-2)"><div class="section-label">計算結果</div><div id="estResult" class="tnum" style="font-size:20px;font-weight:800">¥0</div><div id="estBreak" class="muted" style="font-size:12px;margin-top:6px"></div></div>'+
    '</div>',
    onMount:function(body){
      function recalc(){
        var st = body.querySelector('[data-field="est_structure"]').value;
        var ts = num(body.querySelector('[data-field="est_tsubo"]').value);
        var addons = [];
        body.querySelectorAll("[data-addon]").forEach(function(cb){
          if (cb.checked){
            var row = prices.filter(function(r){ return r.id === cb.getAttribute("data-addon"); })[0];
            var qty = num(body.querySelector('[data-qty="'+cb.getAttribute("data-addon")+'"]').value) || 1;
            addons.push({ name:row.name, qty:qty });
          }
        });
        var res = Calc.estimateCost(st, ts, addons) || { total:0, breakdown:[] };
        body.querySelector("#estResult").textContent = yen(res.total);
        body.querySelector("#estBreak").innerHTML = res.breakdown.map(function(b){ return esc(b.label)+" = "+yen(b.amount); }).join("<br>");
        body._estTotal = res.total;
      }
      body.querySelectorAll("input,select").forEach(function(el){ el.addEventListener("input", recalc); el.addEventListener("change", recalc); });
      wireOther(body);
      recalc();
    },
    onConfirm:function(body){

      '<div class="row" style="margin-top:9px">'+

  var html =

    html += '<div class="card"><div class="empty">'+icon("bell")+'<h3>追客予定はありません</h3>'+
      '<p>案件詳細で「次回追客日」を設定すると、ここに並びます。</p></div></div>';
  } else {
    html += '<div class="fu-cols">'+
      col("期限超過", b.overdue, "fu-col--overdue")+

  return {

        bd.onclick = function(){ openFollowDoneDialog(bd.getAttribute("data-done")); };
      });

/* ============================================================
   VIEW: Profit management
   ============================================================ */
var profitFilter = "all";
function rateColor(rate, profit){
  if (profit !== null && profit < 0) return "var(--danger)";
  if (rate === null) return "var(--muted)";
  if (rate < 15) return "var(--warning)";
  return "var(--success)";
}
function ViewProfit(){
  var deals = DB.deals().slice();
  var list = deals.filter(function(d){
    if (profitFilter === "active") return Calc.isActive(d);
    if (profitFilter === "won") return d.status === "won";
    return true;
  }).sort(function(a,b){ return (Calc.profit(b).profit||0) - (Calc.profit(a).profit||0); });

  var sumPresented = 0, sumEst = 0, sumConf = 0;
  deals.forEach(function(d){
    var p = Calc.profit(d);
    if (Calc.isActive(d) && num(d.amount_presented)!==null) sumPresented += num(d.amount_presented);
    if (Calc.isActive(d) && p.profit!==null) sumEst += p.profit;
    if (d.status === "won" && p.profit!==null) sumConf += p.profit;
  });
  var avgRateWon = Calc.avgProfitRate("won");
  var wonCount = deals.filter(function(d){ return d.status==="won"; }).length;

  var html =
    '<div class="page-head only-desktop"><div><h1>利益管理</h1><p>案件別の見込利益・利益率。進行中と成約で切り替え。</p></div></div>'+
    '<div class="stats" style="margin-bottom:16px">'+
      '<div class="stat stat--accent"><div class="stat__label">進行中 提示金額 合計</div><div class="stat__value tnum">'+yen(sumPresented)+'</div></div>'+
      '<div class="stat stat--accent"><div class="stat__label">見込利益 合計（進行中）</div><div class="stat__value tnum">'+yen(sumEst)+'</div></div>'+
      '<div class="stat stat--good"><div class="stat__label">確定利益 合計（成約）</div><div class="stat__value tnum">'+yen(sumConf)+'</div></div>'+
      '<div class="stat"><div class="stat__label">平均利益率（成約 '+wonCount+'件）</div><div class="stat__value tnum">'+pct(avgRateWon,1)+'</div></div>'+
    '</div>';

  // 月別 確定利益 推移（成約実績があるときだけ表示）
  if (wonCount > 0){
    var months = Calc.monthlyProfit(8);
    var maxAbs = Math.max.apply(null, months.map(function(m){ return Math.abs(m.profit); }).concat([1]));
    html += '<div class="card" style="margin-bottom:16px"><div class="card__head">'+
      '<div class="card__title">月別 確定利益の推移（直近8ヶ月）</div></div>'+
      '<div class="barlist">'+
      months.map(function(m){
        var w = m.profit === 0 ? 0 : Math.max(6, Math.round(Math.abs(m.profit) / maxAbs * 100));
        var col = m.profit < 0 ? "var(--danger)" : (m.isCurrent ? "var(--primary)" : "var(--success)");
        return '<div class="barlist__row">'+
          '<span'+(m.isCurrent?' style="font-weight:800;color:var(--primary)"':'')+'>'+esc(m.label)+(m.isCurrent?"（今月）":"")+'</span>'+
          '<span class="barlist__track"><span class="barlist__fill" style="width:'+w+'%;background:'+col+'"></span></span>'+
          '<span class="barlist__val" style="color:'+(m.profit===0?"var(--muted)":col)+'">'+yen(m.profit)+'</span>'+
        '</div>';
      }).join("")+
      '</div></div>';
  }

  html += '<div class="pill-toggle" style="margin-bottom:14px">'+
      '<button data-pf="all" class="'+(profitFilter==="all"?"is-on":"")+'">全て</button>'+
      '<button data-pf="active" class="'+(profitFilter==="active"?"is-on":"")+'">進行中</button>'+
      '<button data-pf="won" class="'+(profitFilter==="won"?"is-on":"")+'">成約</button>'+
    '</div>';

  if (!list.length){
    html += '<div class="card"><div class="empty">'+icon("yen")+'<p>該当する案件がありません</p></div></div>';
  } else {
    var sumP = 0, sumC = 0, sumO = 0, sumPr = 0, anyPr = false;
    list.forEach(function(d){
      var p = Calc.profit(d);
      if (num(d.amount_presented)!==null) sumP += num(d.amount_presented);
      if (num(d.cost_construction)!==null) sumC += num(d.cost_construction);
      if (num(d.cost_other)!==null) sumO += num(d.cost_other);
      if (p.profit!==null){ sumPr += p.profit; anyPr = true; }
    });
    html += '<div class="table-wrap only-desktop"><table class="table"><thead><tr>'+
      '<th>会社名</th><th>ステータス</th><th class="num">提示金額</th><th class="num">施工原価</th>'+
      '<th class="num">その他原価</th><th class="num">見込利益</th><th class="num">利益率</th></tr></thead><tbody>';
    list.forEach(function(d){
      var p = Calc.profit(d);
      html += '<tr class="clickable" data-goto="'+d.id+'">'+
        '<td style="font-weight:700">'+esc(d.company_name||"（無名）")+'</td>'+
        '<td>'+statusBadge(d.status)+'</td>'+
        '<td class="num">'+yen(d.amount_presented)+'</td>'+
        '<td class="num">'+yen(d.cost_construction)+'</td>'+
        '<td class="num">'+yen(d.cost_other)+'</td>'+
        '<td class="num" style="font-weight:800;color:'+rateColor(p.rate,p.profit)+'">'+yen(p.profit)+'</td>'+
        '<td class="num" style="font-weight:700;color:'+rateColor(p.rate,p.profit)+'">'+pct(p.rate,1)+'</td>'+
      '</tr>';
    });
    html += '</tbody><tfoot><tr>'+
        '<td colspan="2">合計（'+list.length+'件）</td>'+
        '<td class="num">'+yen(sumP)+'</td><td class="num">'+yen(sumC)+'</td><td class="num">'+yen(sumO)+'</td>'+
        '<td class="num" style="color:'+(sumPr<0?"var(--danger)":"var(--success)")+'">'+yen(anyPr?sumPr:null)+'</td><td class="num">—</td>'+
      '</tr></tfoot></table></div>';

    // mobile cards
    html += '<div class="stack only-mobile">';
    list.forEach(function(d){
      var p = Calc.profit(d);
      html += '<div class="deal-card" data-goto="'+d.id+'">'+
        '<div class="deal-card__top"><div class="deal-card__co">'+esc(d.company_name||"（無名）")+'</div>'+statusBadge(d.status)+'</div>'+
        '<div class="deal-card__row"><span class="muted">提示 '+yen(d.amount_presented)+'</span>'+
          '<span class="deal-card__amt" style="color:'+rateColor(p.rate,p.profit)+'">'+yen(p.profit)+'</span></div>'+
        '<div class="deal-card__row"><span class="muted">原価（施工＋その他）</span><span>'+yen((num(d.cost_construction)||0)+(num(d.cost_other)||0))+'</span></div>'+
        '<div class="deal-card__row"><span class="muted">利益率</span><span style="font-weight:800;color:'+rateColor(p.rate,p.profit)+'">'+pct(p.rate,1)+'</span></div>'+
      '</div>';
    });
    html += '</div>';
  }

  return {
    title:"利益管理", html:html,
    mount:function(root){
      root.querySelectorAll("[data-pf]").forEach(function(b){ b.onclick=function(){ profitFilter=b.getAttribute("data-pf"); render(); }; });
      root.querySelectorAll("[data-goto]").forEach(function(el){ el.onclick=function(){ navTo("/deals/"+el.getAttribute("data-goto")); }; });
    }
  };
}

var simState = { deals: 4, profit: 200000 };
function ViewSimulation(){
  function calc(n){ var m = n * simState.profit; return { m:m, y:m*12 }; }
  var cur = calc(simState.deals);
  var rows = [2,4,6,8].map(function(n){ return { n:n, r:calc(n) }; });

  var html =
    '<div class="page-head only-desktop"><div><h1>利益シミュレーション</h1><p>月間成約件数 × 1件平均利益 から、月間・年間利益を試算。</p></div></div>'+
    '<div class="grid" style="grid-template-columns:1fr;gap:16px">'+
      '<div class="card"><div class="section-label">入力</div>'+
        '<div class="form-grid">'+
          fieldInput("月間成約件数","sim_deals",simState.deals,{type:"number",inputmode:"numeric"})+
          fieldInput("1件平均利益 (円)","sim_profit",simState.profit,{type:"number",inputmode:"numeric"})+
        '</div>'+
        '<div class="row" style="margin-top:10px">'+
          '<button class="btn btn--soft btn--sm" data-preset="150000">¥150,000</button>'+
          '<button class="btn btn--soft btn--sm" data-preset="200000">¥200,000</button>'+
          '<button class="btn btn--soft btn--sm" data-preset="300000">¥300,000</button>'+
        '</div>'+
      '</div>'+
      '<div class="stats">'+
        '<div class="stat stat--accent"><div class="stat__label">月間利益</div><div class="stat__value tnum" id="simM">'+yen(cur.m)+'</div>'+
          '<div class="stat__delta">'+simState.deals+'件 × '+yen(simState.profit)+'</div></div>'+
        '<div class="stat stat--good"><div class="stat__label">年間利益</div><div class="stat__value tnum" id="simY">'+yen(cur.y)+'</div>'+
          '<div class="stat__delta">月間 × 12</div></div>'+
      '</div>'+
      '<div class="card"><div class="section-label">件数別の早見表（1件平均利益 '+yen(simState.profit)+'）</div>'+
        '<div class="table-wrap"><table class="table" style="min-width:auto"><thead><tr><th>月間成約</th><th class="num">月間利益</th><th class="num">年間利益</th></tr></thead><tbody id="simTable">'+
        rows.map(function(x){ return '<tr><td>月 '+x.n+' 件</td><td class="num">'+yen(x.r.m)+'</td><td class="num">'+yen(x.r.y)+'</td></tr>'; }).join("")+
        '</tbody></table></div></div>'+
    '</div>';

  return {
    title:"シミュレーション", html:html,
    mount:function(root){
      function refresh(){
        var cur = calc(simState.deals);
        root.querySelector("#simM").textContent = yen(cur.m);
        root.querySelector("#simY").textContent = yen(cur.y);
        root.querySelector("#simTable").innerHTML = [2,4,6,8].map(function(n){
          var r = calc(n); return '<tr><td>月 '+n+' 件</td><td class="num">'+yen(r.m)+'</td><td class="num">'+yen(r.y)+'</td></tr>';
        }).join("");
      }
      root.querySelector('[data-field="sim_deals"]').addEventListener("input", function(){ simState.deals = num(this.value)||0; refresh(); });
      root.querySelector('[data-field="sim_profit"]').addEventListener("input", function(){ simState.profit = num(this.value)||0; refresh(); });
      root.querySelectorAll("[data-preset]").forEach(function(b){
        b.onclick = function(){ simState.profit = Number(b.getAttribute("data-preset")); root.querySelector('[data-field="sim_profit"]').value = simState.profit; refresh(); };
      });
    }
  };
}

    mount:function(root){
      function editDialog(row){
        openDialog({

          confirmLabel:"保存",
          body:'<div class="stack">'+
            fieldSelectWithOther("カテゴリ","up_cat",["構造解体","付帯工事","諸経費","その他"],row?row.category:"","up_cat_other",row?row.category_other:"",{blank:false,otherPlaceholder:"カテゴリ名を入力（必須）"})+
            fieldInput("項目名","up_name",row?row.name:"",{required:true,placeholder:"例：木造解体"})+
            fieldInput("単位","up_unit",row?row.unit:"式",{placeholder:"坪 / 式 / m / m2 / 本"})+
            fieldInput("単価 (円)","up_price",row?row.unit_price:"",{type:"number",inputmode:"numeric"})+
          '</div>',
          onMount:function(body){ wireOther(body); },
          onConfirm:function(body){
            if (requireField(body.querySelector('[data-field="up_name"]'), "項目名を入力してください")) return true;
            if (requireField(body.querySelector('[data-field="up_price"]'), "単価を入力してください")) return true;
            if (requireOthers(body)) return true;
            var name = body.querySelector('[data-field="up_name"]').value.trim();
            var cat = body.querySelector('[data-field="up_cat"]').value || "その他";
            var catOther = (body.querySelector('[data-field="up_cat_other"]') || {}).value.trim() || "";
            DB.savePrice({
              id: row ? row.id : null,
              category: cat,
              category_other: cat === "その他" ? catOther : "",
              name: name,
              unit: body.querySelector('[data-field="up_unit"]').value.trim() || "式",
              unit_price: num(body.querySelector('[data-field="up_price"]').value)
            });
            toast("保存しました"); render();

      document.querySelectorAll('[data-act="add"]').forEach(function(b){ b.onclick=function(){ editDialog(null); }; });
