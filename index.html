function wireFilesCard(root, id){
  var fdisc = root.querySelector("#filesDisc");
  if (!fdisc) return;
  var ftog = root.querySelector("#filesToggle");
  if (ftog) ftog.onclick = function(){ fdisc.classList.toggle("is-open"); };

  var fin = root.querySelector("#fileInput");
  if (fin) fin.onchange = function(){
    var files = Array.prototype.slice.call(fin.files || []);
    fin.value = "";
    if (!files.length) return;
    var d = DB.deal(id); if (!d) return;
    var meta = (d.files || []).slice();
    var added = 0, skipped = 0;
    var chain = Promise.resolve();
    files.forEach(function(file){
      chain = chain.then(function(){
        if (file.size > 10485760){ skipped++; return; }
        var fid = uid();
        return FS.put(fid, file).then(function(){
          meta.push({ id:fid, name:file.name, type:file.type || "", size:file.size, addedOn:isoToday() });
          added++;
        }, function(e){ skipped++; logError("file-put", (e && e.message) || e); });
      });
    });
    chain.then(function(){
      DB.updateDeal(id, { files: meta });
      toast(added + "件を添付しました" + (skipped ? "（" + skipped + "件は10MB超過/失敗）" : ""));
      render();
      var fd = document.getElementById("filesDisc"); if (fd) fd.classList.add("is-open");
    });
  };

  root.querySelectorAll("[data-file-open]").forEach(function(b){
    b.onclick = function(){
      var fid = b.getAttribute("data-file-open");
      var d = DB.deal(id);
      var m = (d.files || []).filter(function(f){ return f.id === fid; })[0] || {};
      FS.get(fid).then(function(blob){
        if (!blob){ toast("ファイル本体が見つかりません"); return; }
        var url = URL.createObjectURL(blob);
        var isImg = /^image\//.test(m.type || blob.type || "");
        var isPdf = /pdf/i.test(m.type || blob.type || "");
        openDialog({
          title: m.name || "ファイル", hideCancel: true, confirmLabel: "閉じる",
          body: (isImg ? '<img src="'+url+'" alt="" style="max-width:100%;border-radius:8px;display:block">'
                : isPdf ? '<iframe src="'+url+'" style="width:100%;height:58vh;border:1px solid var(--border);border-radius:8px"></iframe>'
                : '<div class="muted" style="font-size:13px">この形式はプレビューできません。下のボタンで開いてください。</div>')+
            '<div class="row" style="margin-top:10px;gap:8px">'+
              '<a href="'+url+'" download="'+esc(m.name || "file")+'" class="btn btn--soft btn--sm">ダウンロード</a>'+
              '<button type="button" class="btn btn--ghost btn--sm" id="fileNewTab">新しいタブで開く</button>'+
            '</div>',
          onMount: function(bd){
            var nt = bd.querySelector("#fileNewTab");
            if (nt) nt.onclick = function(){ try { window.open(url, "_blank"); } catch(e){} };
          },
          onConfirm: function(){ setTimeout(function(){ try { URL.revokeObjectURL(url); } catch(e){} }, 3000); }
        });
      }, function(e){ toast("開けませんでした"); logError("file-get", (e && e.message) || e); });
    };
  });

  root.querySelectorAll("[data-file-del]").forEach(function(b){
    b.onclick = function(){
      var fid = b.getAttribute("data-file-del");
      var d = DB.deal(id);
      var m = (d.files || []).filter(function(f){ return f.id === fid; })[0] || {};
      confirmDialog("この添付を削除しますか？", (m.name || "ファイル") + " を削除します。", "削除する", function(){
        FS.del(fid);
        DB.updateDeal(id, { files: (d.files || []).filter(function(f){ return f.id !== fid; }) });
        toast("削除しました"); render();
        var fd = document.getElementById("filesDisc"); if (fd) fd.classList.add("is-open");
      }, true);
    };
  });
}

function contactLogCardHTML(deal){
  var items = [];
  DB.logs(deal.id).forEach(function(l){
    items.push({ on:l.on, at:l.created_at||l.on, txt:(LOG_KINDS.filter(function(o){return o.k===l.kind;})[0]||{}).icon + " " + logKindLabel(l.kind) + (l.text ? "：" + l.text : ""), id:l.id, isLog:true });
  });
  DB.events(deal.id).forEach(function(e){
    items.push({ on:e.changed_on, at:e.created_at||e.changed_on, txt:"→ " + statusMeta(e.status).label + " に変更", isLog:false });
  });
  items.sort(function(a,b){ return (a.at < b.at ? 1 : a.at > b.at ? -1 : 0); });
  var d = lastContactDays(deal);
  var staleTag = (d !== null && Calc.isActive(deal) && d >= 7)
    ? '<span class="badge '+(d>=14?'pr-high':'pr-mid')+'">'+d+'日 連絡なし</span>' : '';
  var html = '<div class="card"><div class="card__head"><div class="card__title">連絡ログ</div>'+staleTag+'</div>'+
    (Calc.isActive(deal) ? '<div class="segmented" style="margin-bottom:10px">'+
      LOG_KINDS.map(function(o){
        return '<button type="button" class="choice" data-log="'+o.k+'">'+o.icon+' '+esc(o.label)+'</button>';
      }).join("")+
    '</div>' : '');
  if (!items.length){
    html += '<div class="muted" style="font-size:13px">まだ記録がありません。上のボタンで「架電した」等を記録できます。</div>';
  } else {
    html += '<div class="loglist">'+
      items.slice(0, 12).map(function(it){
        return '<div class="loglist__row">'+
          '<span class="loglist__date tnum">'+fmtDate(it.on)+'</span>'+
          '<span class="loglist__txt'+(it.isLog?"":" muted")+'">'+esc(it.txt)+'</span>'+
          (it.isLog ? '<button type="button" class="loglist__del" data-log-del="'+it.id+'" aria-label="削除">'+icon("x")+'</button>' : '<span></span>')+
        '</div>';
      }).join("")+
      (items.length > 12 ? '<div class="muted" style="font-size:12px;padding-top:6px">ほか '+(items.length-12)+' 件</div>' : '')+
    '</div>';
  }
  return html + '</div>';
}

          setTimeout(function(){ navTo("/deals/" + deal.id); }, 160);
        }
        var dup = DB.deals().filter(function(d){ return (d.company_name||"").trim() === v("company_name"); });
        if (dup.length){
          confirmDialog("同じ会社名の案件があります",
            "「"+v("company_name")+"」は既に "+dup.length+" 件登録されています（"+dup.map(function(d){return statusMeta(d.status).label;}).slice(0,3).join("・")+" 等）。別物件としてこのまま登録しますか？",
            "このまま登録", doCreate);
          return;
        }
        doCreate();
      };
    }
  };
}

/* ============================================================
   VIEW: Deal detail
   ============================================================ */
function ViewDealDetail(id){
  var deal = DB.deal(id);
  if (!deal){
    return { title:"案件詳細", html:'<div class="card"><div class="empty">'+icon("inbox")+'<h3>案件が見つかりません</h3><button class="btn btn--primary" onclick="location.hash=\'#/deals\'">一覧へ</button></div></div>' };
  }
  var pr = Calc.profit(deal);
  var idx = pipeIndex(deal.status);
  var nextStage = (idx >= 0 && idx < PIPELINE.length - 1) ? PIPELINE[idx+1]
                 : (deal.status === "considering") ? null : null;
  var isClosed = deal.status === "won" || deal.status === "lost";

  var html = "";

  // header
  html += '<div class="page-head"><div>'+
    '<h1 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+esc(deal.company_name||"（無名）")+' '+statusBadge(deal.status,true)+'</h1>'+
    '<p>'+esc(deal.code)+' ・ 登録 '+fmtDateFull(deal.created_on)+' ・ '+esc(sourceLabel(deal)||"経路未設定")+
      (prioBadge(Calc.priorityBucket(deal))?' ・ '+prioBadge(Calc.priorityBucket(deal)):'')+'</p>'+
    '</div>'+
    '<button class="btn btn--danger-soft only-desktop" data-act="delete">'+icon("trash")+'削除</button>'+
  '</div>';

  // Status control
  html += '<div class="card" style="margin-bottom:14px"><div class="section-label">営業ステータス</div>';
  html += '<div class="row" style="align-items:center">';
  if (!isClosed){
    if (nextStage){
      html += '<button class="btn btn--primary btn--lg" data-status="'+nextStage.key+'">'+esc(nextStage.label)+'へ進める '+icon("arrow-right")+'</button>';
    }
    html += '<button class="btn btn--soft btn--lg" data-status="won">'+icon("check")+'成約</button>';
    html += '<button class="btn btn--danger-soft btn--lg" data-act="lost">失注にする</button>';
  } else {
    html += '<button class="btn btn--soft" data-act="reopen">対応中に戻す</button>';
    if (deal.status === "lost" && deal.lost_reason){
      html += '<span class="badge s-lost badge--lg">失注理由：'+esc(deal.lost_reason)+(deal.lost_reason==="その他"&&deal.lost_reason_note?"（"+esc(deal.lost_reason_note)+"）":"")+'</span>';
    }
  }
  html += '</div>';
  if (!isClosed && pipeIndex(deal.status) >= 1){
    var _prevStage = PIPELINE[pipeIndex(deal.status) - 1];
    html += '<button class="btn btn--ghost btn--sm" data-act="revert" style="margin-top:8px" title="進めるボタンを押し間違えたとき用。1つ前の段階に戻します">'+icon("back")+'1つ戻す（'+esc(_prevStage.label)+'へ）</button>';
  }
  // stepper / timeline
  html += '<div class="divider"></div><div class="timeline">';
  PIPELINE.forEach(function(st, i){
    var reached = Calc.reachedIndex(deal) >= i;
    var df = st.dateField;
    html += '<div class="tl__row '+(reached?"is-done":"")+'"><div class="tl__line"></div><div class="tl__dot"></div>'+
      '<div class="tl__main"><span class="tl__name">'+esc(st.label)+'</span>'+
      (df ? '<span class="tl__date">'+dateField(null,df,deal[df]||"",{bare:true, placeholder:"未入力"})+'</span>' : '<span class="muted" style="font-size:12px">登録時</span>')+
      '</div></div>';
  });
  if (deal.status === "won") html += '<div class="tl__row is-done"><div class="tl__dot"></div><div class="tl__main"><span class="tl__name">成約</span><span class="tl__date">'+dateField(null,"won_on",deal.won_on||"",{bare:true, placeholder:"未入力"})+'</span></div></div>';
  if (deal.status === "lost") html += '<div class="tl__row is-lost"><div class="tl__dot"></div><div class="tl__main"><span class="tl__name" style="color:var(--danger)">失注</span><span class="tl__date">'+dateField(null,"lost_on",deal.lost_on||"",{bare:true, placeholder:"未入力"})+'</span></div></div>';
  html += '</div></div>';

  // Two column layout on desktop
  html += '<div class="grid" style="grid-template-columns:1fr;gap:14px">';

  // 基本情報（まとめ表示 → 「編集」で入力欄）
  html += basicInfoCardHTML(deal);

  // 連絡ログ（活動履歴）
  html += contactLogCardHTML(deal);

  // 事前見積（社内） ＋ 客先予算比較
  var preEst = Calc.preEstimate(deal);
  var preSummary = preEst ? '<span class="muted">'+yen(preEst.mid)+(Calc.clientBudgetValue(deal)?' / 予算 '+yen(Calc.clientBudgetValue(deal)):'')+'</span>' : '';
  html += '<div class="disclosure" id="preDisc">'+
    '<button type="button" class="disclosure__btn" id="preToggle"><span>事前見積・客先予算 '+preSummary+'</span>'+icon("chevron","chev")+'</button>'+
    '<div class="disclosure__body">'+
      '<div class="section-label">① 不動産情報から事前見積</div>'+
      preFieldsHTML(deal.pre)+
      '<div class="divider"></div>'+
      '<div class="section-label">② 客先予算を聞いて比較</div>'+
      budgetBlockHTML(deal)+
    '</div></div>';

  // Money panel
  html += '<div class="card"><div class="section-label">金額管理</div>'+
    '<div class="form-grid">'+
      moneyField("提示金額","amount_presented",deal.amount_presented)+
      moneyField("施工原価","cost_construction",deal.cost_construction)+
      moneyField("その他原価","cost_other",deal.cost_other,{hint:"諸経費・処分費など"})+
      '<div></div>'+
    '</div>'+
    '<div class="divider"></div>'+
    '<div class="row" style="gap:24px">'+
      '<div><div class="stat__label">見込利益（自動）</div><div class="stat__value tnum" id="mpProfit" style="color:'+(pr.profit!==null&&pr.profit<0?"var(--danger)":"var(--success)")+'">'+yen(pr.profit)+'</div></div>'+
      '<div><div class="stat__label">利益率（自動）</div><div class="stat__value tnum" id="mpRate">'+pct(pr.rate,1)+'</div></div>'+
    '</div>'+
    (DB.prices().length ? '<div class="row" style="margin-top:12px"><button class="btn btn--soft btn--sm" data-act="estimate">単価マスタから概算原価</button></div>' : '')+
  '</div>';

  // Follow-up
  html += '<div class="card"><div class="section-label">次回追客</div>'+
    '<div class="form-grid">'+
      dateField("次回追客日","next_follow_on",deal.next_follow_on)+
      fieldSelectWithOther("次回アクション","next_action",NEXT_ACTIONS,deal.next_action,"next_action_other",deal.next_action_other,{blank:"選択",otherPlaceholder:"具体的なアクションを入力（必須）"})+
    '</div>'+
    '<div class="row" style="margin-top:10px">'+
      '<button class="btn btn--soft btn--sm" data-follow="1">明日</button>'+
      '<button class="btn btn--soft btn--sm" data-follow="3">3日後</button>'+
      '<button class="btn btn--soft btn--sm" data-follow="7">1週間後</button>'+
    '</div></div>';

  // Survey
  var sv = deal.survey;
  var svSummary = sv ? ' <span class="muted">'+esc([sv.structure, (sv.tsubo?sv.tsubo+"坪":""), (sv.floors?sv.floors+"階":"")].filter(Boolean).join(" ・ "))+'</span>' : '';
  html += '<div class="disclosure" id="surveyDisc">'+
    '<button type="button" class="disclosure__btn" id="surveyToggle"><span>現調情報'+(sv?"":"を入力する")+svSummary+'</span>'+icon("chevron","chev")+'</button>'+
    '<div class="disclosure__body">'+surveyFieldsHTML(sv||{})+
      '<div class="row" style="margin-top:12px"><button class="btn btn--primary btn--sm" data-act="saveSurvey">現調情報を保存</button></div>'+
    '</div></div>';

  // 書類・写真
  html += filesCardHTML(deal);

  html += '<button class="btn btn--danger-soft btn--block only-mobile" data-act="delete">'+icon("trash")+'この案件を削除</button>';
  html += '</div>';

  return {
    title: deal.company_name || "案件詳細",
    html: html,
    back:function(){ navTo("/deals"); },
    appbarAction:'<button class="btn btn--sm btn--ghost" data-act="delete" aria-label="この案件を削除">'+icon("trash")+'</button>',
    mount:function(root){
      // autosave text/select/date/number fields
      var autoFields = root.querySelectorAll('.card [data-field], .timeline [data-field]');
      function saveField(el){
        var f = el.getAttribute("data-field");
        var val = (el.type === "number" || el.getAttribute("data-num")) ? num(el.value) : el.value;
        var patch = {}; patch[f] = val;
        DB.updateDeal(id, patch);
        // live recompute money panel
        var d2 = DB.deal(id); var p2 = Calc.profit(d2);
        var mp = root.querySelector("#mpProfit"), mr = root.querySelector("#mpRate");
        if (mp){ mp.textContent = yen(p2.profit); mp.style.color = (p2.profit!==null&&p2.profit<0)?"var(--danger)":"var(--success)"; }
        if (mr) mr.textContent = pct(p2.rate,1);
        toast("保存しました");
      }
      autoFields.forEach(function(el){ el.addEventListener("change", function(){ saveField(el); }); });
      wireSourceOther(root);
      wireDateFields(root);
      wireMoneyFields(root);

      // 事前見積・客先予算
      var preDisc = root.querySelector("#preDisc");
      if (preDisc) root.querySelector("#preToggle").onclick = function(){ preDisc.classList.toggle("is-open"); };
      wirePreEstimate(root, id);
      wireContactLog(root, id);
      wireFilesCard(root, id);

      // 基本情報: まとめ表示 ⇄ 編集
      var basicCard = root.querySelector("#basicCard");
      if (basicCard){
        var editBtn = basicCard.querySelector('[data-act="edit-basic"]');
        var doneBtn = basicCard.querySelector('[data-act="done-basic"]');
        var sumEl = basicCard.querySelector(".basic-summary");
        var edEl = basicCard.querySelector(".basic-edit");
        if (editBtn) editBtn.onclick = function(){
          sumEl.setAttribute("hidden", "");
          edEl.removeAttribute("hidden");
          editBtn.setAttribute("hidden", "");
          var first = edEl.querySelector('[data-field="company_name"]');
          if (first) first.focus();
        };
        if (doneBtn) doneBtn.onclick = function(){ render(); }; // 入力は autosave 済み。まとめ表示に戻す
      }

      // status advance buttons
      root.querySelectorAll("[data-status]").forEach(function(b){
        b.onclick = function(){
          var key = b.getAttribute("data-status");
          if (key === "won"){
            confirmDialog("成約にしますか？", (deal.company_name||"")+" を成約として記録します。", "成約にする", function(){
              DB.setStatus(id, "won"); toast("成約に更新しました"); render();
            });
            return;
          }
          DB.setStatus(id, key);
          toast(statusMeta(key).label + " に更新しました");
          render();
        };
      });

      // lost flow
      var lostBtn = root.querySelector('[data-act="lost"]');
      if (lostBtn) lostBtn.onclick = function(){
        openDialog({
          title:"失注として記録",
          confirmLabel:"失注にする",
          danger:true,
          body:'<div class="stack">'+
            fieldSelectWithOther("失注理由","lost_reason",LOST_REASONS,"","lost_reason_note","",{required:true,blank:"選択してください",otherPlaceholder:"失注の理由を入力（必須）"})+
          '</div>',
          onMount:function(body){ wireOther(body); },
          onConfirm:function(body){
            var reason = body.querySelector('[data-field="lost_reason"]').value;
            if (requireField(body.querySelector('[data-field="lost_reason"]'), "失注理由を選んでください")) return true;
            if (requireOthers(body)) return true;
            var note = (body.querySelector('[data-field="lost_reason_note"]') || {}).value || "";
            DB.updateDeal(id, { lost_reason:reason, lost_reason_note: reason === "その他" ? note : "" });
            DB.setStatus(id, "lost");
            toast("失注として記録しました"); render();
          }
        });
      };

      var reopen = root.querySelector('[data-act="reopen"]');
      if (reopen) reopen.onclick = function(){
        DB.updateDeal(id, { status: deal.reached_before || "quote_submitted" });
        DB._addEvent(id, "considering", isoToday());
        DB.updateDeal(id, { status:"considering" });
        toast("対応中に戻しました"); render();
      };

      var revertBtn = root.querySelector('[data-act="revert"]');
      if (revertBtn) revertBtn.onclick = function(){
        var cur = statusMeta(deal.status).label;
        var i = pipeIndex(deal.status);
        var prevLabel = i >= 1 ? PIPELINE[i-1].label : "";
        confirmDialog("1つ前の段階に戻しますか？",
          "「"+cur+"」→「"+prevLabel+"」に戻します。"+cur+"の記録日は取り消されます。",
          "戻す", function(){
            DB.revertStatus(id);
            toast(prevLabel + " に戻しました");
            render();
          });
      };

      // probability segmented
      root.querySelectorAll('[data-seg2="probability"] .choice').forEach(function(b){
        b.onclick = function(){
          root.querySelectorAll('[data-seg2="probability"] .choice').forEach(function(x){ x.classList.remove("is-on"); });
          b.classList.add("is-on");
          DB.updateDeal(id, { probability:b.getAttribute("data-val") });
          toast("見込み度を更新しました");
        };
      });

      // follow quick buttons
      root.querySelectorAll("[data-follow]").forEach(function(b){
        b.onclick = function(){
          var n = Number(b.getAttribute("data-follow"));
          var d = new Date(); d.setDate(d.getDate()+n);
          var iso = isoDate(d);
          DB.updateDeal(id, { next_follow_on: iso });
          setDateField(root, "next_follow_on", iso);
          toast("次回追客日を設定しました");
        };
      });

      // survey
      var disc = root.querySelector("#surveyDisc");
      root.querySelector("#surveyToggle").onclick = function(){ disc.classList.toggle("is-open"); };
      root.querySelectorAll('[data-check]').forEach(function(cb){
        cb.onchange = function(){ cb.closest(".check").classList.toggle("is-on", cb.checked); };
      });
      var saveSv = root.querySelector('[data-act="saveSurvey"]');
      if (saveSv) saveSv.onclick = function(){
        if (requireOthers(root)) return;
        var s = readSurveyFrom(root);
        DB.updateDeal(id, { survey:s });
        toast("現調情報を保存しました");
      };

      // estimate from unit master
      var est = root.querySelector('[data-act="estimate"]');
      if (est) est.onclick = function(){ openEstimateDialog(id); };

      // delete （ヘッダー右上のゴミ箱は #view の外にあるので document から拾う）
      document.querySelectorAll('[data-act="delete"]').forEach(function(b){
        b.onclick = function(){
          confirmDialog("本当に削除しますか？", (deal.company_name||"この案件")+"（"+deal.code+"）を削除します。", "削除する", function(){
            var snap = DB.deleteDeal(id);
            navTo("/deals");
            setTimeout(function(){
              toastAction("削除しました", "元に戻す", function(){ DB.restoreDeal(snap); toast("元に戻しました"); render(); });
            }, 120);
          }, true);
        };
      });
    }
  };
}

function openEstimateDialog(dealId){
  var deal = DB.deal(dealId);
  var prices = DB.prices();
  var addonRows = prices.filter(function(r){ return r.category !== "構造解体"; });
  var sv = deal.survey || {};
  openDialog({
    title:"概算施工原価",
    confirmLabel:"施工原価に反映",
    body:'<div class="stack">'+
      '<div class="form-grid">'+
        fieldSelectWithOther("構造","est_structure",STRUCTURES,sv.structure||"","est_structure_other","",{otherPlaceholder:"構造名を入力"})+
        fieldInput("坪数","est_tsubo",sv.tsubo||"",{type:"number",inputmode:"decimal"})+
      '</div>'+
      '<div><span class="field__label">付帯工事</span><div class="stack" style="margin-top:8px;gap:8px">'+
        (addonRows.length ? addonRows.map(function(r){
          return '<label class="check"><input type="checkbox" data-addon="'+r.id+'"> '+esc(r.name)+
            ' <span class="muted" style="margin-left:auto">'+yen(r.unit_price)+' / '+esc(r.unit)+'</span>'+
            ' <input class="input" style="width:64px;min-height:34px" type="number" value="1" data-qty="'+r.id+'"></label>';
        }).join("") : '<span class="muted">付帯工事の単価が未登録です</span>')+
      '</div></div>'+
      '<div class="card" style="background:var(--surface-2)"><div class="section-label">計算結果</div><div id="estResult" class="tnum" style="font-size:20px;font-weight:800">¥0</div><div id="estBreak" class="muted" style="font-size:12px;margin-top:6px"></div></div>'+
    '</div>',
    onMount:function(body){
      function recalc(){
        var st = body.querySelector('[data-field="est_structure"]').value;
        var ts = num(body.querySelector('[data-field="est_tsubo"]').value);
        var addons = [];
        body.querySelectorAll("[data-addon]").forEach(function(cb){
          if (cb.checked){
            var row = prices.filter(function(r){ return r.id === cb.getAttribute("data-addon"); })[0];
            var qty = num(body.querySelector('[data-qty="'+cb.getAttribute("data-addon")+'"]').value) || 1;
            addons.push({ name:row.name, qty:qty });
          }
        });
        var res = Calc.estimateCost(st, ts, addons) || { total:0, breakdown:[] };
        body.querySelector("#estResult").textContent = yen(res.total);
        body.querySelector("#estBreak").innerHTML = res.breakdown.map(function(b){ return esc(b.label)+" = "+yen(b.amount); }).join("<br>");
        body._estTotal = res.total;
      }
      body.querySelectorAll("input,select").forEach(function(el){ el.addEventListener("input", recalc); el.addEventListener("change", recalc); });
      wireOther(body);
      recalc();
    },
    onConfirm:function(body){
      DB.updateDeal(dealId, { cost_construction: Math.round(body._estTotal || 0) });
      toast("施工原価に反映しました"); render();
    }
  });
}

function ViewFollowUps(){

        ' <span>'+esc(d.next_action||"アクション未設定")+'</span>'+
        ' <span>'+fmtDate(d.next_follow_on)+'</span>'+
        ' <span>見込 '+yenMan(pr.profit)+'</span></div>'+
      '<div class="row" style="margin-top:9px">'+
        (tel ? '<a class="chipbtn" style="min-height:34px;font-size:12px" href="tel:'+esc(tel)+'">'+icon("phone")+'電話</a>' : '')+
        '<button class="btn btn--sm btn--soft" data-done="'+d.id+'">対応した</button>'+
        '<button class="btn btn--sm btn--ghost" data-snooze="'+d.id+'">+3日</button>'+
      '</div>'+
    '</div>';
  }
  function col(title, list, mod){
    var isOverdue = mod === "fu-col--overdue";
    return '<div class="card fu-col '+(mod||"")+'"><div class="fu-col__head"><h3>'+esc(title)+'</h3>'+
      '<span class="badge '+(isOverdue?"pr-high":"")+'">'+list.length+'</span></div>'+
      (list.length ? list.map(function(d){ return itemHTML(d, isOverdue); }).join("") : '<div class="muted" style="font-size:13px;padding:8px 2px">なし</div>')+
    '</div>';
  }

  var html =
    '<div class="page-head only-desktop"><div><h1>追客管理</h1><p>期限超過を最優先で。対応したらその場で次回を設定。</p></div></div>';

  if (!b.overdue.length && !b.today.length && !b.upcoming.length){
    html += '<div class="card"><div class="empty">'+icon("bell")+'<h3>追客予定はありません</h3>'+
      '<p>案件詳細で「次回追客日」を設定すると、ここに並びます。</p></div></div>';
  } else {
    html += '<div class="fu-cols">'+
      col("期限超過", b.overdue, "fu-col--overdue")+
      col("今日", b.today)+
      col("今後", b.upcoming)+
    '</div>';
  }

  return {
    title:"追客管理",
    html:html,
    mount:function(root){
      root.querySelectorAll("[data-goto]").forEach(function(el){
        el.onclick = function(e){ if (e.target.closest("button, a")) return; navTo("/deals/"+el.getAttribute("data-goto")); };
      });
      root.querySelectorAll("[data-done]").forEach(function(bd){
        bd.onclick = function(){ openFollowDoneDialog(bd.getAttribute("data-done")); };
      });
      root.querySelectorAll("[data-snooze]").forEach(function(bs){
        bs.onclick = function(){
          var did = bs.getAttribute("data-snooze");
          var d0 = DB.deal(did);
          var base = d0.next_follow_on ? new Date(d0.next_follow_on) : new Date();
          base.setDate(base.getDate()+3);
          DB.updateDeal(did, { next_follow_on: isoDate(base) });
          toast("3日後に延期しました"); render();
        };
      });
    }
  };
}

/* ============================================================
   VIEW: Profit management
   ============================================================ */
var profitFilter = "all";
function rateColor(rate, profit){
  if (profit !== null && profit < 0) return "var(--danger)";
  if (rate === null) return "var(--muted)";
  if (rate < 15) return "var(--warning)";
  return "var(--success)";
}
function ViewProfit(){
  var deals = DB.deals().slice();
  var list = deals.filter(function(d){
    if (profitFilter === "active") return Calc.isActive(d);
    if (profitFilter === "won") return d.status === "won";
    return true;
  }).sort(function(a,b){ return (Calc.profit(b).profit||0) - (Calc.profit(a).profit||0); });

  var sumPresented = 0, sumEst = 0, sumConf = 0;
  deals.forEach(function(d){
    var p = Calc.profit(d);
    if (Calc.isActive(d) && num(d.amount_presented)!==null) sumPresented += num(d.amount_presented);
    if (Calc.isActive(d) && p.profit!==null) sumEst += p.profit;
    if (d.status === "won" && p.profit!==null) sumConf += p.profit;
  });
  var avgRateWon = Calc.avgProfitRate("won");
  var wonCount = deals.filter(function(d){ return d.status==="won"; }).length;

  var html =
    '<div class="page-head only-desktop"><div><h1>利益管理</h1><p>案件別の見込利益・利益率。進行中と成約で切り替え。</p></div></div>'+
    '<div class="stats" style="margin-bottom:16px">'+
      '<div class="stat stat--accent"><div class="stat__label">進行中 提示金額 合計</div><div class="stat__value tnum">'+yen(sumPresented)+'</div></div>'+
      '<div class="stat stat--accent"><div class="stat__label">見込利益 合計（進行中）</div><div class="stat__value tnum">'+yen(sumEst)+'</div></div>'+
      '<div class="stat stat--good"><div class="stat__label">確定利益 合計（成約）</div><div class="stat__value tnum">'+yen(sumConf)+'</div></div>'+
      '<div class="stat"><div class="stat__label">平均利益率（成約 '+wonCount+'件）</div><div class="stat__value tnum">'+pct(avgRateWon,1)+'</div></div>'+
    '</div>';

  // 月別 確定利益 推移（成約実績があるときだけ表示）
  if (wonCount > 0){
    var months = Calc.monthlyProfit(8);
    var maxAbs = Math.max.apply(null, months.map(function(m){ return Math.abs(m.profit); }).concat([1]));
    html += '<div class="card" style="margin-bottom:16px"><div class="card__head">'+
      '<div class="card__title">月別 確定利益の推移（直近8ヶ月）</div></div>'+
      '<div class="barlist">'+
      months.map(function(m){
        var w = m.profit === 0 ? 0 : Math.max(6, Math.round(Math.abs(m.profit) / maxAbs * 100));
        var col = m.profit < 0 ? "var(--danger)" : (m.isCurrent ? "var(--primary)" : "var(--success)");
        return '<div class="barlist__row">'+
          '<span'+(m.isCurrent?' style="font-weight:800;color:var(--primary)"':'')+'>'+esc(m.label)+(m.isCurrent?"（今月）":"")+'</span>'+
          '<span class="barlist__track"><span class="barlist__fill" style="width:'+w+'%;background:'+col+'"></span></span>'+
          '<span class="barlist__val" style="color:'+(m.profit===0?"var(--muted)":col)+'">'+yen(m.profit)+'</span>'+
        '</div>';
      }).join("")+
      '</div></div>';
  }

  html += '<div class="pill-toggle" style="margin-bottom:14px">'+
      '<button data-pf="all" class="'+(profitFilter==="all"?"is-on":"")+'">全て</button>'+
      '<button data-pf="active" class="'+(profitFilter==="active"?"is-on":"")+'">進行中</button>'+
      '<button data-pf="won" class="'+(profitFilter==="won"?"is-on":"")+'">成約</button>'+
    '</div>';

  if (!list.length){
    html += '<div class="card"><div class="empty">'+icon("yen")+'<p>該当する案件がありません</p></div></div>';
  } else {
    var sumP = 0, sumC = 0, sumO = 0, sumPr = 0, anyPr = false;
    list.forEach(function(d){
      var p = Calc.profit(d);
      if (num(d.amount_presented)!==null) sumP += num(d.amount_presented);
      if (num(d.cost_construction)!==null) sumC += num(d.cost_construction);
      if (num(d.cost_other)!==null) sumO += num(d.cost_other);
      if (p.profit!==null){ sumPr += p.profit; anyPr = true; }
    });
    html += '<div class="table-wrap only-desktop"><table class="table"><thead><tr>'+
      '<th>会社名</th><th>ステータス</th><th class="num">提示金額</th><th class="num">施工原価</th>'+
      '<th class="num">その他原価</th><th class="num">見込利益</th><th class="num">利益率</th></tr></thead><tbody>';
    list.forEach(function(d){
      var p = Calc.profit(d);
      html += '<tr class="clickable" data-goto="'+d.id+'">'+
        '<td style="font-weight:700">'+esc(d.company_name||"（無名）")+'</td>'+
        '<td>'+statusBadge(d.status)+'</td>'+
        '<td class="num">'+yen(d.amount_presented)+'</td>'+
        '<td class="num">'+yen(d.cost_construction)+'</td>'+
        '<td class="num">'+yen(d.cost_other)+'</td>'+
        '<td class="num" style="font-weight:800;color:'+rateColor(p.rate,p.profit)+'">'+yen(p.profit)+'</td>'+
        '<td class="num" style="font-weight:700;color:'+rateColor(p.rate,p.profit)+'">'+pct(p.rate,1)+'</td>'+
      '</tr>';
    });
    html += '</tbody><tfoot><tr>'+
        '<td colspan="2">合計（'+list.length+'件）</td>'+
        '<td class="num">'+yen(sumP)+'</td><td class="num">'+yen(sumC)+'</td><td class="num">'+yen(sumO)+'</td>'+
        '<td class="num" style="color:'+(sumPr<0?"var(--danger)":"var(--success)")+'">'+yen(anyPr?sumPr:null)+'</td><td class="num">—</td>'+
      '</tr></tfoot></table></div>';

    // mobile cards
    html += '<div class="stack only-mobile">';
    list.forEach(function(d){
      var p = Calc.profit(d);
      html += '<div class="deal-card" data-goto="'+d.id+'">'+
        '<div class="deal-card__top"><div class="deal-card__co">'+esc(d.company_name||"（無名）")+'</div>'+statusBadge(d.status)+'</div>'+
        '<div class="deal-card__row"><span class="muted">提示 '+yen(d.amount_presented)+'</span>'+
          '<span class="deal-card__amt" style="color:'+rateColor(p.rate,p.profit)+'">'+yen(p.profit)+'</span></div>'+
        '<div class="deal-card__row"><span class="muted">原価（施工＋その他）</span><span>'+yen((num(d.cost_construction)||0)+(num(d.cost_other)||0))+'</span></div>'+
        '<div class="deal-card__row"><span class="muted">利益率</span><span style="font-weight:800;color:'+rateColor(p.rate,p.profit)+'">'+pct(p.rate,1)+'</span></div>'+
      '</div>';
    });
    html += '</div>';
  }

  return {
    title:"利益管理", html:html,
    mount:function(root){
      root.querySelectorAll("[data-pf]").forEach(function(b){ b.onclick=function(){ profitFilter=b.getAttribute("data-pf"); render(); }; });
      root.querySelectorAll("[data-goto]").forEach(function(el){ el.onclick=function(){ navTo("/deals/"+el.getAttribute("data-goto")); }; });
    }
  };
}

  var html =

          fieldInput("月間成約件数","sim_deals",simState.deals,{type:"number",inputmode:"numeric"})+

        '<div class="stat stat--accent"><div class="stat__label">月間利益</div><div class="stat__value tnum" id="simM">'+yen(cur.m)+'</div>'+
          '<div class="stat__delta">'+simState.deals+'件 × '+yen(simState.profit)+'</div></div>'+
        '<div class="stat stat--good"><div class="stat__label">年間利益</div><div class="stat__value tnum" id="simY">'+yen(cur.y)+'</div>'+
          '<div class="stat__delta">月間 × 12</div></div>'+

      '<div class="card"><div class="section-label">件数別の早見表（1件平均利益 '+yen(simState.profit)+'）</div>'+

  return {

/* ============================================================
   VIEW: Analytics
   ============================================================ */
function ViewAnalytics(){
  var deals = DB.deals();
  if (!deals.length){
    return { title:"営業分析", html:'<div class="card"><div class="empty">'+icon("chart")+'<h3>分析できるデータがありません</h3><p>案件が増えると、経路別・見込み度別の成果が表示されます。</p></div></div>' };
  }

  function group(keyFn){
    var g = {};
    deals.forEach(function(d){
      var k = keyFn(d) || "未設定";
      g[k] = g[k] || { total:0, won:0, lost:0, profit:0, daySum:0, dayN:0 };
      g[k].total++;
      if (d.status === "won"){
        g[k].won++;
        var p = Calc.profit(d).profit; if (p!==null) g[k].profit += p;
        if (d.won_on && d.created_on){ var dd = daysBetween(d.created_on, d.won_on); if (dd!=null){ g[k].daySum += dd; g[k].dayN++; } }
      }
      if (d.status === "lost") g[k].lost++;
    });
    return g;
  }
  var bySource = group(function(d){ return sourceLabel(d) || d.source; });
  var byProb = group(function(d){ return d.probability; });

  var lostReasons = {};
  deals.filter(function(d){ return d.status==="lost" && d.lost_reason; }).forEach(function(d){
    lostReasons[d.lost_reason] = (lostReasons[d.lost_reason]||0) + 1;
  });
  var lostRank = Object.keys(lostReasons).map(function(k){ return { k:k, n:lostReasons[k] }; }).sort(function(a,b){ return b.n-a.n; });

  var wonDeals = deals.filter(function(d){ return d.status==="won"; });
  var avgProfit = wonDeals.length ? Math.round(wonDeals.reduce(function(a,d){ return a + (Calc.profit(d).profit||0); },0) / wonDeals.length) : null;
  var avgDays = Calc.avgWinDays();

  function barTable(title, g, opts){
    var keys = Object.keys(g);
    var showDays = !!opts.days;
    var html = '<div class="card"><div class="section-label">'+esc(title)+'</div>';
    html += '<div class="table-wrap"><table class="table" style="min-width:auto"><thead><tr><th>'+esc(opts.head)+'</th><th class="num">案件</th><th class="num">成約</th><th class="num">成約率</th><th class="num">確定利益</th>'+(showDays?'<th class="num">平均日数</th>':'')+'</tr></thead><tbody>';
    keys.sort(function(a,b){ return g[b].total - g[a].total; }).forEach(function(k){
      var x = g[k];
      var decided = x.won + x.lost;
      var rate = decided ? x.won/decided*100 : null;
      var rc = rate===null ? "" : rate>=50 ? "var(--success)" : rate>=25 ? "var(--warning)" : "var(--danger)";
      html += '<tr><td style="font-weight:700">'+esc(k)+'</td>'+
        '<td class="num">'+x.total+'</td><td class="num">'+x.won+'</td>'+
        '<td class="num" style="font-weight:700'+(rc?';color:'+rc:'')+'">'+pct(rate)+'</td>'+
        '<td class="num" title="'+yen(x.profit)+'">'+yenMan(x.profit)+'</td>'+
        (showDays?'<td class="num">'+(x.dayN?Math.round(x.daySum/x.dayN)+'日':'—')+'</td>':'')+'</tr>';
    });
    html += '</tbody></table></div></div>';
    return html;
  }

  var html =
    '<div class="page-head only-desktop"><div><h1>営業分析</h1><p>どの経路が効率よく成果につながっているか。</p></div></div>'+
    '<div class="stats" style="margin-bottom:16px">'+
      '<div class="stat stat--good"><div class="stat__label">平均案件利益（成約）</div><div class="stat__value tnum" title="'+yen(avgProfit)+'">'+yenMan(avgProfit)+'</div></div>'+
      '<div class="stat"><div class="stat__label">平均受注期間</div><div class="stat__value tnum">'+(avgDays===null?"—":avgDays)+'<small> 日</small></div></div>'+
      '<div class="stat"><div class="stat__label">成約 / 総案件</div><div class="stat__value tnum">'+wonDeals.length+' <small>/ '+deals.length+'</small></div></div>'+
    '</div>'+
    barTable("発見経路別 成果（どこから探すのが効率的か）", bySource, { head:"発見経路", days:true })+
    barTable("見込み度別 成果", byProb, { head:"見込み度" })+

/* ============================================================

function landFingerprint(rec){

  var h = 5381, i = s.length;
  while (i) h = (h * 33) ^ s.charCodeAt(--i);

// ページからのコピーに混ざる「いらない行」を落とす（ナビ・広告・関連物件の見出しなど）
var LAND_NOISE = [

  "地図で見る","地図を見る","ストリートビュー","パノラマ","写真をもっと見る","画像一覧",
  "印刷","このページを印刷","不動産会社に問い合わせ","無料相談","来店予約","電話で問い合わせ","メールで問い合わせ","資料請求",

  "広告","スポンサー","会員限定","ページトップ","トップへ戻る","もっと見る","一覧に戻る","前へ","次へ",
  "利用規約","プライバシーポリシー","個人情報","Cookie","クッキー","サイトマップ","運営会社","ヘルプ","よくある質問","お知らせ"

function stripLandNoise(text){
  var lines = z2h(text || "").replace(/\r/g, "").split("\n"), out = [];
  for (var i=0;i<lines.length;i++){
    var ln = lines[i].replace(/[\t 　]+/g, " ").trim();
    if (!ln){ out.push(""); continue; }
    if (ln.length <= 1) continue;
    if (/^[×✕✖◯○●▲▼△▽◆◇■□【】\-—―_=＝*※・:：|｜>＞<＜~〜\s]+$/.test(ln)) continue;
    // パンくず（「ホーム > 県 > 市 > …」）: 区切りが2個以上ある短めの行
    if (ln.length < 60 && (ln.match(/[>＞»›\/｜|]/g) || []).length >= 2 && !/[0-9]/.test(ln)) continue;
    if (/^(ホーム|トップ|TOP|HOME|サイトトップ)\b/i.test(ln)) continue;
    var noise = false;
    for (var j=0;j<LAND_NOISE.length;j++){ if (ln.indexOf(LAND_NOISE[j]) >= 0){ noise = true; break; } }
    if (noise && ln.length < 26) continue; // 短いナビ行だけ除去（本文中の言及は残す）
    out.push(ln);
  }
  return out.join("\n").replace(/\n{3,}/g, "\n\n").trim();
}
// 一覧ページ用の分割。空行だけで切ると1物件が分裂するので、
// 「価格 or 明確な見出しを含む断片」だけを新しい物件の先頭とみなし、他は前の物件にくっつける。
function splitLandBlocks(text){
  var frags = z2h(text || "").replace(/\r/g, "").split(/\n{2,}/)
    .map(function(s){ return s.trim(); }).filter(Boolean);
  var priceRe = /[0-9][0-9,]*\s*万\s*円|[0-9]+\s*億/;
  var headRe = /^(?:■|●|◆|▶|【|\d+\s*[.．)]\s|物件番号|物件No|お問い合わせ番号)/;
  var blocks = [];
  frags.forEach(function(f){
    var startsNew = headRe.test(f) ||
      (priceRe.test(f) && (!blocks.length || priceRe.test(blocks[blocks.length-1])));
    if (!blocks.length || startsNew) blocks.push(f);
    else blocks[blocks.length-1] += "\n" + f;
  });
  if (!blocks.length && text.trim()) blocks.push(z2h(text).trim());
  return blocks;
}
function firstMatch(hay, kws){
  for (var i=0;i<kws.length;i++){ if (hay.indexOf(kws[i]) >= 0) return kws[i]; }
  return null;
}
function lineOf(text, kw){
  var lines = String(text).split("\n");
  for (var i=0;i<lines.length;i++){ if (lines[i].indexOf(kw) >= 0) return lines[i].trim().slice(0,120); }
  var w = winAfter(z2h(text), kw, 50);
  return w ? w.replace(/\n/g," ").trim().slice(0,120) : kw;
}
function parseLandBlock(block){
  var t = z2h(block);
  var rec = { raw: block };
  // ラベルの値を拾う。「ラベル：値」も「ラベル[改行]値」（タブ区切り表のコピー）も対応。
  function clean(s){ return String(s).replace(/^[\s　:：\t]+/,"").replace(/[\s　]+$/,""); }
  function pick(kws){
    for (var i=0;i<kws.length;i++){
      var k = kws[i];
      var same = t.match(new RegExp("(?:" + k + ")[ \\t　]*[:：]?[ \\t　]*([^\\n]+)"));
      if (same && clean(same[1])) return clean(same[1]);
      var next = t.match(new RegExp("(?:" + k + ")[ \\t　]*[:：]?[ \\t　]*\\n+[ \\t　]*([^\\n]+)"));
      if (next && clean(next[1])) return clean(next[1]);
    }
    return "";
  }
  var um = t.match(/https?:\/\/[^\s"'<>）)]+/);
  rec.url = um ? um[0] : "";
  var oku = t.match(/([0-9]+)\s*億\s*([0-9,]*)\s*万?円?/);
  var man = t.match(/([0-9][0-9,]*)\s*万\s*円/);
  if (oku){
    rec.priceYen = parseInt(oku[1],10) * 100000000 + (oku[2] ? parseInt(oku[2].replace(/,/g,"")||"0",10) * 10000 : 0);
    rec.price = oku[1] + "億" + (oku[2] ? oku[2] + "万" : "") + "円";
  } else if (man){
    rec.priceYen = parseInt(man[1].replace(/,/g,""),10) * 10000;
    rec.price = man[1] + "万円";
  } else {
    rec.price = pick(["価格","販売価格","売買価格"]);
    rec.priceYen = rec.price ? parseYen(rec.price) : null;
  }
  var landWin = "";
  ["土地面積","敷地面積","地積","土地"].some(function(k){ var w = winAfter(t,k,50); if (w){ landWin = w; return true; } });
  var lt = areaToTsubo(landWin);
  if (lt) rec.landTsubo = Math.round(lt*10)/10;
  var lm = landWin.match(/([0-9,]+(?:\.[0-9]+)?)\s*(?:m2|㎡|m²|平米|坪)/i);
  rec.landText = lm ? lm[0].replace(/\s+/g,"") : (rec.landTsubo ? rec.landTsubo + "坪" : "");
  rec.address = pick(["所在地","物件所在地","住所","所在"]);
  if (!rec.address){
    var am = t.match(/[^\n]*?(?:都|道|府|県)[^\n]*?(?:市|区|郡)[^\n]*/);
    rec.address = am ? am[0].trim().slice(0,80) : "";
  }
  rec.genkyo = pick(["現況","現状","状況","建物現況"]);
  rec.hikiwatashi = pick(["引渡条件","引渡し条件","引き渡し条件","引渡時期","お引渡し","引き渡し","引渡し"]);
  if (rec.hikiwatashi.length <= 3) rec.hikiwatashi = ""; // 「可」「相談」等の断片は無効
  if (!rec.hikiwatashi){
    // 現況欄や本文に「更地渡し／解体渡し」が書かれている場合、その語句を引渡条件として拾う
    var dk = firstMatch(z2h(rec.genkyo || ""), SARACHI_POS);
    if (dk) rec.hikiwatashi = "現況欄に「" + dk + "」の記載";
    else {
      var dk2 = firstMatch(t, SARACHI_POS);
      if (dk2) rec.hikiwatashi = lineOf(t, dk2);
    }
  }
  rec.agency = pick(["取扱店舗","取扱会社","取扱不動産会社","情報提供元","情報提供","不動産会社","会社名","問合せ先","お問い合わせ先","掲載会社","仲介会社","取扱"]);
  rec.agentName = pick(["担当者","担当","営業担当","担当者名"]).replace(/\s*(TEL|Tel|電話|℡|FAX|お問い合わせ|問合せ|[0-9]).*$/, "").trim().slice(0, 24);
  var pm = t.match(/(?:TEL|Tel|電話|℡|お問い合わせ|問合せ)[^\d]{0,6}(0\d{1,4}[-\s]?\d{1,4}[-\s]?\d{3,4})/) || t.match(/(0\d0[-\s]?\d{4}[-\s]?\d{4})/) || t.match(/(0\d{1,4}[-\s]\d{1,4}[-\s]\d{3,4})/);
  rec.phone = pm ? pm[1].replace(/\s/g, "") : "";
  if (!rec.name){
    var cand = t.split("\n").map(function(x){ return x.trim(); }).filter(function(x){
      if (!x || x.indexOf(">") >= 0 || x.indexOf("＞") >= 0) return false;
      if (/^(所在地|住所|現況|現状|引渡|引き渡し|土地面積|敷地面積|地積|価格|販売価格|坪単価|取扱|交通|最寄|接道|都市計画|地目|用途地域|地勢|建ぺい率|建蔽率|容積率|土地権利|権利|JR|西鉄|地下鉄|バス)/.test(x)) return false;
      if (/^[\d,.\s]+(万円|億|㎡|m2|m²|坪|%)/.test(x)) return false; // 価格や面積で始まる行
      if (x.replace(/[\d,.\s　円¥￥㎡m²坪%()（）\/\-億万：:～~]/g,"").length < 2) return false;
      return true;

    var first = (cand[0] || "").replace(/^[■●◆▶【\]\d.．)\s　]+/, "").replace(/\s*[0-9][0-9,]*\s*万円.*$/, "").replace(/\s*[0-9]+\s*億.*$/, "").trim();
    var srcAddr = first || rec.address || "";
    // 住所そのものっぽい場合は「◯◯（市以降） 土地」に整える
    if (/[都道府県].*[市区郡]/.test(srcAddr)) first = srcAddr.replace(/^.*?[都道府県]/, "").replace(/\s+/g, "") + " 土地";
    else if (first.replace(/[\s　,、.．]/g, "").length < 2 && rec.address) first = rec.address.replace(/^.*?[都道府県]/, "").replace(/\s+/g, "") + " 土地";

  }
  return rec;
}
function judgeLand(rec){
  var hay = z2h([rec.genkyo, rec.hikiwatashi, rec.name, rec.raw].join("\n"));
  var posKw = firstMatch(hay, SARACHI_POS);
  var bldKw = firstMatch(hay, SARACHI_BLD);
  var bldByGenkyo = /居宅|住宅|家屋|建物|木造|鉄骨|鉄筋|アパート|平屋|マンション|店舗/.test(rec.genkyo || "");
  var hasBld = !!bldKw || bldByGenkyo;
  var bldDesc = bldKw || (rec.genkyo || "").slice(0, 20) || "建物あり";
  var alreadyVacant = /更地渡し済|更地渡済|更地済|さら地渡し|建物なし|上物なし|整地済/.test(hay)
    || (/現況\s*[:：]?\s*(更地|さら地|空地)/.test(hay) && !hasBld && !posKw);
  var level, reason;
  if (alreadyVacant && !posKw){
    level = "対象外";
    reason = "現況がすでに更地（建物なし）です。売主が解体する仕事は発生しない見込みです。";
  } else if (posKw && hasBld){
    level = "高確度";
    reason = "「" + posKw + "」の記載があり、現況に建物（" + bldDesc + "）も確認できます。売主側で解体して引き渡す可能性が高い物件です。";
  } else if (posKw && !hasBld){
    level = "候補";
    reason = "「" + posKw + "」の記載はありますが、いま建物があるかどうかが読み取れませんでした。ページ本文で現況を確認してください。";
  } else if (!posKw && hasBld){
    level = "候補";
    reason = "現況に建物（" + bldDesc + "）がありますが、「更地渡し」等の記載は見当たりません。買主が解体するケースの可能性があります。";
  } else {
    level = "対象外";
    reason = "「更地渡し」「解体渡し」「売主負担で解体」等に当てはまる記載が見つかりませんでした。";
  }
  rec.level = level;
  rec.reason = reason;
  rec.fp = landFingerprint(rec);
  return rec;
}
// 貼り付けテキストが「1物件か複数か」を自動判定する
function looksLikeListingPrice(line){
  var l = String(line).replace(/[（(][^）)]*?(単価|㎡|m2|平米)[^）)]*?[）)]/g, "");
  if (/予算|月々|ローン|返済|管理費|修繕|敷金|礼金|家賃|賃料|想定|参考|前回|改定前|旧価格|坪単価|平米単価/.test(l)) return false;
  var m = l.match(/([0-9][0-9,]*)\s*万\s*円/);
  if (m && parseInt(m[1].replace(/,/g, ""), 10) >= 100) return true;
  if (/[0-9]\s*億\s*[0-9,]*\s*万?\s*円?/.test(l)) return true;
  return false;
}
function detectLandSingle(text){
  var lines = stripLandNoise(text).split("\n");
  var priceLines = 0, markers = 0;
  for (var i=0;i<lines.length;i++){
    if (looksLikeListingPrice(lines[i])) priceLines++;
    if (/物件番号|物件No|お問い合わせ番号|^\s*[■●◆▶]/.test(lines[i])) markers++;
  }
  var detailish = ["接道","用途地域","地目","建ぺい率","建蔽率","都市計画","土地権利","地勢","私道負担"]
    .filter(function(k){ return text.indexOf(k) >= 0; }).length;
  if (priceLines <= 1) return true;                    // 価格が1つ → 1物件
  if (detailish >= 4 && priceLines <= 3) return true;  // 1つの詳細ページ内の複数価格表記
  if (priceLines >= 2 && markers >= 1) return false;   // 明確に複数
  return priceLines <= 2;                              // 迷ったら1物件寄り
}

// キーワード解析（オフラインでも常に動く）。single=true なら分割せず「1件」として扱う。
function ingestLandText(text, portalKey, single){
  var seen = DB.landSeen();
  var cleaned = stripLandNoise(text);
  var blocks = single ? [cleaned] : splitLandBlocks(cleaned);
  return blocks.map(function(b){
    var rec = judgeLand(parseLandBlock(b));
    rec.portal = portalKey || "other";
    rec.isNew = !seen[rec.fp];
    rec.foundAt = isoToday();
    rec.registeredDealId = null;
    return rec;
  });
}

// AIが返したJSON配列を、キーワード解析と同じ形のレコードに整える（値は必ず検証）
function normalizeAiLand(arr, portalKey){

  var seen = DB.landSeen();

    o = o || {};

    if (lv !== "高確度" && lv !== "候補" && lv !== "対象外") lv = "候補";
    function n(x){ return (x != null && x !== "" && !isNaN(Number(x))) ? Number(x) : null; }
    var lt = n(o.landTsubo), lm2 = n(o.landM2);
    if (lt == null && lm2 != null) lt = Math.round(lm2 / 3.30578 * 10) / 10;
    var rec = {
      name: String(o.name || "").slice(0,80) || "（名称不明）",
      address: String(o.address || "").slice(0,120),
      price: String(o.price || "").slice(0,40),
      landText: String(o.landArea || o.landText || (lm2 ? lm2 + "㎡" : "") || (lt ? lt + "坪" : "")).slice(0,60),
      landTsubo: lt != null ? Math.round(lt*10)/10 : null,
      buildingM2: n(o.buildingM2),
      structure: (["木造","鉄骨造","RC造","SRC造","その他"].indexOf(String(o.structure)) >= 0) ? String(o.structure) : "",
      floors: n(o.floors),
      buildYear: (n(o.buildYear) && n(o.buildYear) > 1900 && n(o.buildYear) <= new Date().getFullYear()+1) ? n(o.buildYear) : null,
      coverage: n(o.coverage),
      far: n(o.far),

      level: lv,

    return rec;
  }).filter(function(r){ return r.name || r.address; });

        '</div>'+
        '<div class="field__hint" style="margin-top:8px">設定するとダッシュボード（今月表示）に達成度が出ます。</div>'+

      '<div class="card"><div class="section-label">表示テーマ</div>'+
        '<div class="segmented">'+
          [["light","ライト"],["dark","ダーク"],["system","端末に合わせる"]].map(function(t){
            return '<button class="choice'+(s.theme===t[0]?" is-on":"")+'" data-theme="'+t[0]+'">'+t[1]+'</button>';
          }).join("")+
        '</div>'+
      '</div>'+
      '<div class="card"><div class="section-label">データ</div>'+
        '<div class="kv" style="margin-bottom:14px"><dt>案件</dt><dd>'+counts.deals+' 件</dd>'+
          '<dt>営業履歴</dt><dd>'+counts.events+' 件</dd><dt>単価</dt><dd>'+counts.prices+' 件</dd></div>'+
        '<div class="row">'+
          '<button class="btn btn--soft" data-act="export">JSON書き出し</button>'+
          '<button class="btn btn--soft" data-act="import">JSON読み込み</button>'+
          '<button class="btn btn--soft" data-act="seed">デモデータ投入</button>'+
        '</div>'+
        '<div class="divider"></div>'+
        '<button class="btn btn--danger-soft" data-act="reset">'+icon("trash")+'全データを初期化</button>'+
        '<p class="muted" style="font-size:12px;margin:10px 0 0">データはこの端末のブラウザ内（localStorage）にのみ保存されます。将来 Supabase に移行する際は <code>DB</code> の実装だけ差し替えます。</p>'+
      '</div>'+

      '<div class="card"><div class="section-label">自動バックアップ（この端末内）</div>'+
        '<p class="muted" style="font-size:12px;margin:0 0 10px">アプリを開くたびに自動で1日1回スナップショットを保存します（初期化・読み込み・デモ投入の直前も自動保存）。誤って消した／読み込みに失敗した時は、ここから戻せます。<br>'+
          '<b>最後のファイル書き出し：'+esc(lastExp)+'</b>　端末が変わるとデータは移りません。時々「JSON書き出し」で端末外にも保管してください。</p>'+
        (snaps.length
          ? '<div class="table-wrap"><table class="table" style="min-width:auto"><thead><tr><th>日時</th><th>きっかけ</th><th class="num">案件</th><th></th></tr></thead><tbody>'+
            snaps.map(function(sn){
              var dt = new Date(sn.at);
              var lbl = (dt.getMonth()+1)+"/"+dt.getDate()+" "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");
              return '<tr><td style="white-space:nowrap">'+esc(lbl)+'</td><td style="font-size:12px">'+esc(sn.reason||"auto")+'</td>'+
                '<td class="num">'+(sn.counts?sn.counts.deals:"?")+'</td>'+
                '<td><button class="btn btn--soft btn--sm" data-restore="'+esc(sn.id)+'">この状態に戻す</button></td></tr>';
            }).join("")+
            '</tbody></table></div>'
          : '<p class="muted" style="font-size:12.5px">まだスナップショットはありません（データを入れて一度開き直すと作成されます）。</p>')+
        '<div class="row" style="margin-top:10px"><button class="btn btn--ghost btn--sm" data-act="snapnow">今すぐスナップショット</button></div>'+
      '</div>'+

      '<div class="card"><div class="section-label">システム（不具合対策）</div>'+
        (SAFE_MODE ? '<div style="color:var(--warning);font-weight:700;font-size:13px;margin-bottom:8px">現在セーフモードで動作中です</div>' : '')+
        '<p class="muted" style="font-size:12.5px;margin:0 0 10px">画面が固まる・エラーが出るときの窓口です。エラーは自動で記録され、下からコピーして共有できます。'+
          '起動できない時は URL の末尾に <code>?safe=1</code> を付けると最小構成で開きます。</p>'+
        '<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">'+
          '<button class="btn btn--soft btn--sm" data-act="updatecheck">最新版を確認して再読み込み</button>'+
          '<button class="btn btn--soft btn--sm" data-act="safemode">セーフモードで開く</button>'+
          '<button class="btn btn--ghost btn--sm" data-act="errcopy">エラーログをコピー</button>'+
          '<button class="btn btn--ghost btn--sm" data-act="errclear">エラーログを消去</button>'+
        '</div>'+
        (errLog.length
          ? '<pre style="font-size:10.5px;white-space:pre-wrap;word-break:break-word;color:var(--muted);max-height:150px;overflow:auto;margin:0;background:var(--surface-3);border-radius:8px;padding:10px">'+
              esc(errLog.slice(-8).reverse().map(function(x){ return x.at.replace("T"," ").slice(0,19)+"  ["+x.kind+"] "+x.msg+(x.extra?"  ("+x.extra+")":""); }).join("\n"))+
            '</pre>'
          : '<p class="muted" style="font-size:12.5px;margin:0">記録されたエラーはありません。</p>')+
      '</div>'+

      '<div class="card"><div class="section-label">このアプリについて</div>'+
        '<p class="muted" style="font-size:13px;margin:0 0 6px"><b>バージョン: '+APP_BUILD+'</b>（この番号を伝えてもらえると、最新かどうか確認できます）</p>'+
        '<p class="muted" style="font-size:13px;margin:0">解体サーチ — Phase 1 (MVP)。ダッシュボード / 案件管理 / ステータス管理 / 見込利益計算 / 追客管理 と、Phase 2 の 単価マスタ / 概算原価 / 分析 / シミュレーション を収録。</p>'+
      '</div>'+
    '</div>';

  return {
    title:"設定", html:html,
    mount:function(root){
      root.querySelectorAll("[data-theme]").forEach(function(b){
        b.onclick = function(){ var t = b.getAttribute("data-theme"); DB.saveSettings({ theme:t }); applyTheme(t); render(); };
      });
      var uc = root.querySelector('[data-act="updatecheck"]');
      if (uc) uc.onclick = function(){
        // キャッシュを避けて本体を取り直す（Netlify/保存版では最新デプロイに切り替わる）
        var base = location.href.split("#")[0].split("?")[0];
        location.href = base + "?v=" + Date.now() + (location.hash || "#/settings");
      };
      var sm = root.querySelector('[data-act="safemode"]');
      if (sm) sm.onclick = function(){
        location.href = location.href.split("#")[0].split("?")[0] + "?safe=1";
      };
      var ecp = root.querySelector('[data-act="errcopy"]');
      if (ecp) ecp.onclick = function(){
        var txt = "解体サーチ エラーログ  build " + APP_BUILD + "\n" +
          readErrLog().map(function(x){ return x.at + "  [" + x.kind + "] " + x.msg + (x.extra ? "  (" + x.extra + ")" : "") + "  @" + (x.path||""); }).join("\n");
        var ok = false;
        try { var t=document.createElement("textarea"); t.value=txt; document.body.appendChild(t); t.select(); ok=document.execCommand("copy"); document.body.removeChild(t); } catch(e){}
        if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok=true; }
        toast(ok ? "エラーログをコピーしました" : "コピーできませんでした");
      };
      var ecl = root.querySelector('[data-act="errclear"]');
      if (ecl) ecl.onclick = function(){
        try { localStorage.removeItem("dcrm.errlog"); } catch(e){}
        Object.keys(localStorage).filter(function(k){ return /\.corrupt$/.test(k) && k.indexOf("dcrm.")===0; }).forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
        toast("エラーログを消去しました"); render();
      };
      ["goal_won","goal_profit"].forEach(function(f){
        var el = root.querySelector('[data-field="'+f+'"]');
        if (el) el.addEventListener("change", function(){
          var patch = {}; patch[f] = num(el.value) || 0; DB.saveSettings(patch); toast("目標を保存しました");
        });
      });
      root.querySelector('[data-act="export"]').onclick = function(){
        var data = DB.exportJSON();
        DB.markExported();
        var downloaded = false;
        try {
          var blob = new Blob([data], { type:"application/json" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "kaitai-eigyo-" + isoToday() + ".json";
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
          downloaded = true;
        } catch (e) { downloaded = false; }
        openDialog({
          title:"データの書き出し",
          desc: downloaded
            ? "ダウンロードを開始しました。保存できない環境の場合は、下の内容をコピーして保管してください。"
            : "この画面ではファイル保存ができません。下の内容をすべてコピーして、テキストとして保管してください。",
          body:'<textarea id="expText" class="input" readonly style="min-height:180px;font-size:12px;white-space:pre">'+esc(data)+'</textarea>',
          confirmLabel:"コピー", hideCancel:false,
          onMount:function(b){ var t=b.querySelector("#expText"); t.focus(); t.select(); },
          onConfirm:function(b){
            var t=b.querySelector("#expText"); t.focus(); t.select();
            var ok=false;
            try { ok = document.execCommand("copy"); } catch(e){}
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(t.value).then(function(){}, function(){});
              ok = true;
            }
            toast(ok ? "コピーしました" : "手動で選択してコピーしてください");
            return true;
          }
        });
      };
      root.querySelector('[data-act="import"]').onclick = function(){
        openDialog({
          title:"データの読み込み",
          desc:"書き出したJSONファイルを選ぶか、テキストを貼り付けてください。現在のデータは置き換えられます。",
          body:'<div class="stack">'+
            '<button class="btn btn--soft" id="impFile" type="button">ファイルを選ぶ</button>'+
            '<textarea id="impText" class="input" placeholder="ここにJSONを貼り付け" style="min-height:150px;font-size:12px"></textarea>'+
          '</div>',
          confirmLabel:"読み込む",
          onMount:function(b){
            b.querySelector("#impFile").onclick = function(){
              var inp = document.createElement("input");
              inp.type = "file"; inp.accept = "application/json,.json";
              inp.onchange = function(){
                var f = inp.files[0]; if (!f) return;
                var r = new FileReader();
                r.onload = function(){ b.querySelector("#impText").value = r.result; };
                r.readAsText(f);
              };
              inp.click();
            };
          },
          onConfirm:function(b){
            if (requireField(b.querySelector("#impText"), "JSONを貼り付けるか、ファイルを選んでください")) return true;
            var txt = b.querySelector("#impText").value.trim();
            try { DB.importJSON(txt); toast("読み込みました"); render(); }
            catch(e){ markFieldError(b.querySelector("#impText"), "JSONの形式が正しくありません"); return true; }
          }
        });
      };
      root.querySelector('[data-act="seed"]').onclick = function(){
        confirmDialog("デモデータを投入しますか？", "現在のデータは置き換えられます。", "投入する", function(){ DB.seed(); toast("デモデータを投入しました"); render(); });
      };
      root.querySelector('[data-act="reset"]').onclick = function(){
        confirmDialog("本当に初期化しますか？", "すべての案件・履歴・単価が削除されます。直前の状態は「自動バックアップ」に残るので、間違えたら戻せます。", "初期化する", function(){ DB.clearAll(); toast("初期化しました（自動バックアップに退避済み）"); navTo("/"); render(); }, true);
      };
      var snapNow = root.querySelector('[data-act="snapnow"]');
      if (snapNow) snapNow.onclick = function(){ DB.takeSnapshot("手動"); toast("スナップショットを保存しました"); render(); };
      root.querySelectorAll("[data-restore]").forEach(function(b){
        b.onclick = function(){
          var sid = b.getAttribute("data-restore");
          confirmDialog("この状態に戻しますか？", "今のデータは、戻す前にもう1つ自動バックアップされます。", "戻す", function(){
            if (DB.restoreSnapshot(sid)){ toast("復元しました"); navTo("/"); render(); }
            else toast("復元できませんでした");
          });
        };
      });
    }
  };
}

/* ============================================================
   Theme
   ============================================================ */
function applyTheme(t){
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
}

/* ============================================================
   App shell render + boot
   ============================================================ */
var NAV = [
  { key:"/",             label:"ダッシュボード", icon:"grid" },
  { key:"/deals",        label:"案件一覧",       icon:"list" },
  { key:"/deals/new",    label:"新規案件登録",   icon:"plus" },
  { key:"/follow-ups",   label:"追客管理",       icon:"bell" },
  { key:"/profit",       label:"利益管理",       icon:"yen" },
  { key:"/simulation",   label:"シミュレーション", icon:"slider" },
  { key:"/unit-prices",  label:"単価マスタ",     icon:"tag" },
  { key:"/analytics",    label:"営業分析",       icon:"chart" },
  { key:"/settings",     label:"設定",           icon:"gear" }
];
var TABS = [
  { key:"/",           label:"ホーム", icon:"grid" },
  { key:"/deals",      label:"案件",   icon:"list" },
  { key:"/deals/new",  label:"登録",   icon:"plus" },
  { key:"/follow-ups", label:"追客",   icon:"bell" },
  { key:"__more",      label:"その他", icon:"more" }
];

function boot(){
  // 起動時クラッシュの連鎖を検知してセーフモードに落とす
  var crash = 0;
  try { crash = parseInt(sessionStorage.getItem("dcrm.bootfail") || "0", 10) || 0; } catch(e){}
  SAFE_MODE = /[?&]safe=1/.test(location.search) || crash >= 2;
  try { sessionStorage.setItem("dcrm.bootfail", String(crash + 1)); } catch(e){}  // 正常起動できたら 0 に戻す

  // 非同期エラー・ハンドラ外のエラーを拾ってログに残す
  window.addEventListener("error", function(ev){
    logError("window-error", ev && ev.message, (ev && ev.filename ? ev.filename + ":" + ev.lineno + ":" + ev.colno : ""));
  });
  window.addEventListener("unhandledrejection", function(ev){
    var r = ev && ev.reason;
    logError("promise-rejection", (r && (r.message || r)) || "unhandled", r && r.stack);
  });

  try { DB.migrate(); } catch(e){ logError("migrate", (e && e.message) || e, e && e.stack); }
  if (!SAFE_MODE){
    try { DB.autoBackupIfDue(); } catch(e){ logError("autobackup", (e && e.message) || e); }
    try { setTimeout(function(){ FS.gc(); }, 4000); } catch(e){}  // 孤立した添付ファイルの掃除
  }
  try { applyTheme(DB.settings().theme); } catch(e){ applyTheme("light"); }

  var root = document.getElementById("root");
  root.innerHTML =
    '<div class="app">'+
      '<aside class="sidebar">'+
        '<div class="brand"><div class="brand__mark"></div>'+
          '<div><div class="brand__name">解体サーチ</div><div class="brand__sub">SALES CONSOLE</div></div></div>'+
        '<nav class="nav">'+
          NAV.map(function(n, i){
            var sep = (i===3 || i===7) ? '<div class="nav__sep"></div>' : '';
            return sep + '<button type="button" class="nav__item" data-nav="'+n.key+'">'+icon(n.icon)+'<span>'+esc(n.label)+'</span></button>';
          }).join("")+
        '</nav>'+
      '</aside>'+
      '<main class="main">'+
        '<header class="appbar">'+
          '<div class="appbar__left">'+
            '<button class="btn btn--sm btn--ghost" id="appbarBack" aria-label="戻る" style="display:none">'+icon("back")+'</button>'+
            '<span class="appbar__title" id="appbarTitle">ダッシュボード</span>'+
          '</div>'+
          '<div id="appbarAction"></div>'+
        '</header>'+
        '<div class="content" id="view"></div>'+
      '</main>'+
    '</div>'+
    '<nav class="tabbar">'+
      TABS.map(function(t){
        return '<button class="tabbar__item" data-tab="'+t.key+'">'+icon(t.icon)+'<span>'+esc(t.label)+'</span></button>';
      }).join("")+
    '</nav>'+
    '<div class="backdrop" id="backdrop"></div>'+
    '<div class="sheet-backdrop" id="sheetBackdrop"></div>'+
    '<div class="sheet" id="sheet"><div class="sheet__grab"></div>'+
      '<div class="sheet__title">メニュー</div>'+
      '<nav class="nav">'+
        NAV.filter(function(n){ return ["/profit","/simulation","/unit-prices","/analytics","/settings"].indexOf(n.key) >= 0; })
           .map(function(n){ return '<button type="button" class="nav__item" data-sheet-nav="'+n.key+'">'+icon(n.icon)+'<span>'+esc(n.label)+'</span></button>'; }).join("")+
      '</nav>'+
    '</div>'+
    '<div class="toast" id="toast"></div>'+
    '<div id="errbanner"></div>';

  var sheet = document.getElementById("sheet");
  var sheetBackdrop = document.getElementById("sheetBackdrop");
  function openSheet(){ sheet.classList.add("is-open"); sheetBackdrop.classList.add("is-open"); }
  function closeSheet(){ sheet.classList.remove("is-open"); sheetBackdrop.classList.remove("is-open"); }
  document.querySelectorAll("[data-tab]").forEach(function(b){
    b.onclick = function(){
      var k = b.getAttribute("data-tab");
      if (k === "__more"){ openSheet(); return; }
      closeSheet();
      navTo(k);
    };
  });
  document.querySelectorAll("[data-nav]").forEach(function(b){
    b.onclick = function(){ navTo(b.getAttribute("data-nav")); };
  });
  sheet.querySelectorAll("[data-sheet-nav]").forEach(function(b){
    b.onclick = function(){ closeSheet(); navTo(b.getAttribute("data-sheet-nav")); };
  });
  sheetBackdrop.onclick = closeSheet;

  window.addEventListener("hashchange", function(){ render(); });

  // 電話・メール・地図: 通常のブラウザ / 端末に保存した場合はそのままアプリが開く。
  // プレビュー枠（サンドボックス iframe）内では空白画面になるため、
  // 番号・アドレスをコピーできるダイアログに切り替える。
  function copyText(str){
    var ok = false;
    try {
      var t = document.createElement("textarea");
      t.value = str; t.setAttribute("readonly", "");
      t.style.position = "fixed"; t.style.opacity = "0";
      document.body.appendChild(t); t.select();
      ok = document.execCommand("copy");
      document.body.removeChild(t);
    } catch(err){}
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(str).then(function(){}, function(){});
      ok = true;
    }
    return ok;
  }
  document.addEventListener("click", function(e){
    if (!e.target.closest) return;
    var a = e.target.closest('a[href^="tel:"],a[href^="mailto:"],a.js-maps');
    if (!a) return;
    if (!isFramed()) return; // 実機・Netlify・保存版ではネイティブ動作にまかせる
    e.preventDefault();
    var isMaps = a.classList.contains("js-maps");
    var href = a.getAttribute("href");
    var isTel = !isMaps && href.indexOf("tel:") === 0;
    var value = isMaps ? (a.getAttribute("data-addr") || "")
             : (function(){ var s = href.replace(/^tel:/, "").replace(/^mailto:/, ""); try { return decodeURIComponent(s); } catch(err){ return s; } })();
    var openLabel = isMaps ? "Googleマップで開く" : isTel ? "電話アプリで開く" : "メールアプリで開く";
    openDialog({
      title: isMaps ? "地図で見る" : isTel ? "電話をかける" : "メールを送る",
      desc: "スマホ・保存版・Netlify版では下のボタンでそのままアプリが開きます。このプレビュー画面ではブロックされることがあるので、その場合は" + (isMaps ? "住所" : isTel ? "番号" : "アドレス") + "をコピーしてお使いください。",
      body: '<div class="bigcopy">' + esc(value) + '</div>'+
            '<button type="button" class="btn btn--primary btn--block" id="nativeOpen" style="margin-top:12px">' + esc(openLabel) + '</button>',
      confirmLabel: (isMaps ? "住所" : isTel ? "番号" : "アドレス") + "をコピー",
      onMount: function(body){
        body.querySelector("#nativeOpen").onclick = function(){
          var w = null;
          try { w = window.open(href, "_blank", "noopener"); } catch(err){}
          if (!w && !isMaps){
            // ポップアップが塞がれている場合の最終手段: 自フレームで遷移を試みる
            try { window.location.href = href; } catch(err){}
          }
        };
      },
      onConfirm: function(){ toast(copyText(value) ? "コピーしました" : "長押しで選択してコピーしてください"); return true; }
    });
  });

  // 別タブでの変更を反映（同一端末で複数タブを開いている場合）
  var syncT;
  window.addEventListener("storage", function(e){
    if (!e.key || e.key.indexOf("dcrm.") !== 0) return;
    clearTimeout(syncT);
    syncT = setTimeout(function(){
      if (e.key === "dcrm.settings") applyTheme(DB.settings().theme);
      render();
    }, 150);
  });

  if (!location.hash) location.hash = "/";
  render();

  // ここまで来たら起動成功 → クラッシュカウンタをリセット
  try { sessionStorage.setItem("dcrm.bootfail", "0"); } catch(e){}

  // セーフモード / 破損データの通知バナー
  try {
    if (SAFE_MODE){
      flashError("セーフモードで起動しました（自動バックアップは停止中）。設定＞システム を確認してください。");
    } else {
      var corrupt = Object.keys(localStorage).filter(function(k){ return /^dcrm\..*\.corrupt$/.test(k); });
      if (corrupt.length){
        flashError("一部データの読み込みに問題がありました。設定＞システム、または自動バックアップから復元できます。");
      }
    }
  } catch(e){}
}

try {
  boot();
} catch (e){
  // シェル構築自体が失敗した場合の最終防衛ライン
  try { logError("boot-fatal", (e && e.message) || e, e && e.stack); } catch(x){}
  var rootEl = document.getElementById("root");
  if (rootEl){
    rootEl.innerHTML =
      '<div style="max-width:520px;margin:60px auto;padding:24px;font-family:sans-serif">'+
      '<h2 style="margin:0 0 8px">起動できませんでした</h2>'+
      '<p style="color:#666;font-size:14px">データは保存されています。下のボタンを試してください。</p>'+
      '<p><button onclick="location.href=location.pathname+\'?safe=1\'" style="padding:10px 16px;font-size:14px;font-weight:700">セーフモードで起動</button> '+
      '<button onclick="location.reload()" style="padding:10px 16px;font-size:14px">再読み込み</button></p>'+
      '<pre style="font-size:11px;white-space:pre-wrap;color:#999">'+String((e && (e.stack||e.message)) || e)+'</pre>'+
      '</div>';
  }
}
})();
</script>
</body>
</html>
